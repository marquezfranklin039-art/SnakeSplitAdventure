<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Snake Split</title>
<style>
* { box-sizing: border-box; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
body {
  margin: 0;
  min-height: 100vh;
  padding: 10px;
  background: linear-gradient(160deg, #e0f2fe 0%, #f1f5f9 55%, #e2e8f0 100%);
  color: #0f172a;
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  touch-action: manipulation;
}
body.dark {
  background: linear-gradient(160deg, #090d16 0%, #111827 60%, #0b1120 100%);
  color: #f8fafc;
}
.bar {
  width: 100%;
  max-width: 360px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 6px;
  margin-bottom: 8px;
  font-size: 13px;
  font-weight: 800;
  letter-spacing: 0.2px;
}
.pill {
  background: #ffffff;
  color: #0f172a;
  border: 2px solid #0284c7;
  border-radius: 999px;
  padding: 6px 11px;
  box-shadow: 0 3px 0 rgba(2, 132, 199, 0.22);
}
body.dark .pill {
  background: #172033;
  color: #f8fafc;
  border-color: #38bdf8;
  box-shadow: 0 3px 0 rgba(14, 165, 233, 0.25);
}
#box {
  position: relative;
  width: 100%;
  max-width: 360px;
  aspect-ratio: 300 / 340;
  border-radius: 18px;
  overflow: hidden;
  border: 3px solid #0284c7;
  box-shadow: 0 10px 25px rgba(15, 23, 42, 0.18), inset 0 0 18px rgba(2, 132, 199, 0.14);
  background: radial-gradient(circle at 50% 30%, #ffffff 0%, #e0f2fe 100%);
}
body.dark #box {
  background: radial-gradient(circle at 50% 30%, #1e293b 0%, #0b1120 100%);
  border-color: #38bdf8;
  box-shadow: 0 10px 28px rgba(0, 0, 0, 0.55), inset 0 0 22px rgba(56, 189, 248, 0.18);
}
canvas { width: 100%; height: 100%; display: block; }
#cfg-panel {
  display: none;
  width: 100%;
  max-width: 360px;
  margin-top: 8px;
  padding: 10px;
  border-radius: 14px;
  background: #ffffff;
  border: 2px solid #cbd5e1;
  gap: 6px;
  flex-wrap: wrap;
  justify-content: center;
  box-shadow: 0 6px 16px rgba(15, 23, 42, 0.1);
}
body.dark #cfg-panel { background: #172033; border-color: #334155; }
#cfg-panel.open { display: flex; }
.pads {
  width: 100%;
  max-width: 360px;
  margin-top: 10px;
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
}
button {
  border: 2px solid #94a3b8;
  background: #ffffff;
  color: #0f172a;
  border-radius: 12px;
  padding: 10px;
  font-weight: 800;
  font-size: 13px;
  cursor: pointer;
  touch-action: manipulation;
  box-shadow: 0 3px 0 #cbd5e1;
  transition: transform 0.08s ease;
}
button:active { transform: translateY(2px); box-shadow: 0 1px 0 #cbd5e1; }
body.dark button {
  background: #172033;
  color: #f8fafc;
  border-color: #334155;
  box-shadow: 0 3px 0 #0f172a;
}
.main {
  background: linear-gradient(180deg, #0ea5e9 0%, #0284c7 100%);
  color: #ffffff;
  border-color: #0369a1;
  box-shadow: 0 3px 0 #0369a1;
}
</style>
</head>

      <button type="button" id="b-cfg">Ajustes</button>
    </div>
  </div>

  <div id="box">
    <canvas id="c" width="300" height="340"></canvas>
  </div>

  <div id="cfg-panel">
    <button type="button" id="o-diff">Dificultad: Estándar</button>
    <button type="button" id="o-theme">Pantalla: Clara</button>
    <button type="button" id="o-snd">Sonido: Sí</button>
  </div>

  <div class="pads">
    <button type="button" id="b-left">◀ Izq</button>
    <button type="button" class="main" id="b-center">▶ Jugar</button>
    <button type="button" id="b-right">Der ▶</button>
  </div>
