<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Snake Split</title>
  <style>
    :root {
      --bg: #eef2f6;
      --text: #0f172a;
      --card: #ffffff;
      --border: #cbd5e1;
      --board-border: #94a3b8;
      --board-bg: radial-gradient(circle at 50% 35%, #ffffff 0%, #e2e8f0 100%);
      --btn-active: #e2e8f0;
      --accent: #0284c7;
      --accent-dark: #0369a1;
      --overlay: rgba(241, 245, 249, 0.92);
      --subtext: #334155;
    }
    body.dark {
      --bg: #0e1116;
      --text: #f8fafc;
      --card: #1b222c;
      --border: #2e3948;
      --board-border: #334155;
      --board-bg: radial-gradient(circle at 50% 35%, #19222f 0%, #10151d 100%);
      --btn-active: #2b3a4e;
      --accent: #1f6feb;
      --accent-dark: #1158c7;
      --overlay: rgba(14, 17, 22, 0.9);
      --subtext: #cbd5e1;
    }
    * { box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }
    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 10px 12px;
      overflow: hidden;
      touch-action: none;
      transition: background-color 0.2s, color 0.2s;
    }
    .top-bar {
      width: 100%;
      max-width: 360px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 6px;
      margin-bottom: 6px;
    }
    .hud {
      width: 100%;
      max-width: 360px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 6px;
      margin-bottom: 8px;
      font-weight: 700;
      font-size: 13px;
    }
    .badge {
      background: var(--card);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 6px 10px;
      border-radius: 999px;
      box-shadow: 0 2px 6px rgba(15, 23, 42, 0.06);
      white-space: nowrap;
    }
    .icon-actions {
      display: flex;
      gap: 6px;
    }
    .icon-btn {
      background: var(--card);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 6px 10px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(15, 23, 42, 0.06);
    }
    .icon-btn:active {
      background: var(--btn-active);
      transform: scale(0.96);
    }
    .progress-wrap {
      width: 100%;
      max-width: 360px;
      height: 7px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 999px;
      overflow: hidden;
      margin-bottom: 8px;
    }
    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #10b981, #0284c7);
      transition: width 0.2s ease;
    }
    #game-wrap {
      position: relative;
      width: 100%;
      max-width: 360px;
      aspect-ratio: 300 / 340;
      border-radius: 16px;
      overflow: hidden;
      border: 2px solid var(--board-border);
      box-shadow: 0 10px 24px rgba(15, 23, 42, 0.12);
      background: var(--board-bg);
    }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }
    .modal-overlay {
      position: absolute;
      inset: 0;
      background: var(--overlay);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 18px;
      text-align: center;
      z-index: 10;
    }
    .modal-overlay.active {
      display: flex;
    }
    .modal-title {
      font-size: 20px;
      font-weight: 800;
      margin: 0 0 6px;
    }
    .modal-sub {
      font-size: 13px;
      color: var(--subtext);
      margin: 0 0 14px;
    }
    .setting-row {
      width: 100%;
      max-width: 250px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      font-size: 13px;
      font-weight: 700;
    }
    .pill-group {
      display: flex;
      gap: 4px;
    }
    .pill-btn {
      background: var(--card);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 5px 8px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }
    .pill-btn.selected {
      background: var(--accent);
      color: #ffffff;
      border-color: var(--accent-dark);
    }
    .modal-actions {
      display: flex;
      gap: 8px;
      margin-top: 8px;
    }
    .controls {
      width: 100%;
      max-width: 360px;
      margin-top: 10px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }
    .ctrl-btn {
      background: var(--card);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 8px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(15, 23, 42, 0.06);
    }
    .ctrl-btn:active {
      background: var(--btn-active);
      transform: scale(0.98);
    }
    .split-btn {
      background: var(--accent);
      color: #ffffff;
      border-color: var(--accent-dark);
    }
    .split-btn:active {
      background: var(--accent-dark);
    }
  </style>
</head>
<body>
  <div class="top-bar">
    <div class="badge" id="level-ui">Nivel 1</div>
    <div class="icon-actions">
      <button class="icon-btn" id="btn-pause" aria-label="Pausa">⏸ Pausa</button>
      <button class="icon-btn" id="btn-settings" aria-label="Configuración">⚙️</button>
    </div>
  </div>

  <div class="hud">
    <div class="badge" id="score-ui">Puntos: 0 / 300</div>
    <div class="badge" id="snakes-ui">Culebras: 1</div>
  </div>

  <div class="progress-wrap">
    <div class="progress-fill" id="progress-fill"></div>
  </div>

  <div id="game-wrap">
    <canvas id="game" width="300" height="340"></canvas>

    <!-- Pantalla de Pausa -->
    <div class="modal-overlay" id="pause-modal">
      <div class="modal-title">Juego en Pausa</div>
      <div class="modal-sub" id="pause-info">Nivel 1 · 0 / 300 pts</div>
      <div class="modal-actions">
        <button class="ctrl-btn split-btn" id="btn-resume">▶ Continuar</button>
        <button class="ctrl-btn" id="btn-restart-pause">↻ Reiniciar</button>
      </div>
    </div>

    <!-- Pantalla de Configuración -->
    <div class="modal-overlay" id="settings-modal">
      <div class="modal-title">Configuración</div>
      <div class="modal-sub">Ajusta el juego a tu gusto</div>

      <div class="setting-row">
        <span>Velocidad</span>
        <div class="pill-group" id="speed-options">
          <button class="pill-btn" data-speed="48">Lenta</button>
          <button class="pill-btn selected" data-speed="62">Normal</button>
          <button class="pill-btn" data-speed="80">Rápida</button>
        </div>
      </div>

      <div class="setting-row">
        <span>Pantalla</span>
        <div class="pill-group" id="theme-options">
          <button class="pill-btn selected" data-theme="light">Clara</button>
          <button class="pill-btn" data-theme="dark">Oscura</button>
        </div>
      </div>

      <div class="setting-row">
        <span>Vibración</span>
        <div class="pill-group" id="vib-options">
          <button class="pill-btn selected" data-vib="on">Sí</button>
          <button class="pill-btn" data-vib="off">No</button>
        </div>
      </div>

      <div class="modal-actions">
        <button class="ctrl-btn split-btn" id="btn-close-settings">Listo</button>
      </div>
    </div>

    <!-- Pantalla de Nivel Superado -->
    <div class="modal-overlay" id="levelup-modal">
      <div class="modal-title" id="levelup-title">¡Nivel 1 Superado!</div>
      <div class="modal-sub" id="levelup-sub">Alcanzaste los 300 puntos. Se suman más calaveras y frutas.</div>
      <div class="modal-actions">
        <button class="ctrl-btn split-btn" id="btn-next-level">Siguiente Nivel ▶</button>
      </div>
    </div>
  </div>

  <div class="controls">
    <button class="ctrl-btn" id="btn-left">◀ Izq</button>
    <button class="ctrl-btn split-btn" id="btn-split">✂ Dividir</button>
    <button class="ctrl-btn" id="btn-right">Der ▶</button>
  </div>

  <script>
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");
    const levelUi = document.getElementById("level-ui");
    const scoreUi = document.getElementById("score-ui");
    const snakesUi = document.getElementById("snakes-ui");
    const progressFill = document.getElementById("progress-fill");

    const pauseModal = document.getElementById("pause-modal");
    const pauseInfo = document.getElementById("pause-info");
    const settingsModal = document.getElementById("settings-modal");
    const levelupModal = document.getElementById("levelup-modal");
    const levelupTitle = document.getElementById("levelup-title");
    const levelupSub = document.getElementById("levelup-sub");

    const W = canvas.width;
    const H = canvas.height;
    const POINTS_PER_LEVEL = 300;

    let level = 1;
    let levelScore = 0;
    let totalScore = 0;
    let gameOver = false;
    let deathReason = "¡Chocaste!";
    let isPaused = false;
    let isSettingsOpen = false;
    let isLevelUp = false;
    let lastTime = 0;
    let touchStartX = null;

    let baseSpeed = 62;
    let vibrationEnabled = true;

    let skulls = [];
    let items = [];
    let popups = [];

    function buzz(ms) {
      if (vibrationEnabled && navigator.vibrate) {
        navigator.vibrate(ms);
      }
    }

    function addPopup(x, y, text, color = "#0284c7") {
      popups.push({ x, y, text, color, life: 0.9 });
    }

    function createSnake(x, y, angle, length = 12, hue = 152, isPlayer = true) {
      const segments = [];
      for (let i = 0; i < length; i++) {
        segments.push({
          x: x - Math.cos(angle) * i * 5,
          y: y - Math.sin(angle) * i * 5
        });
      }
      return {
        segments,
        angle,
        turnDir: 0,
        hue,
        radius: 6.5,
        isPlayer,
        aiTimer: 0.4 + Math.random() * 0.7,
        aiTurn: Math.random() < 0.5 ? -1 : 1
      };
    }

    let snakes = [createSnake(W / 2, H * 0.72, -Math.PI / 2, 12, 152, true)];

    function isSafeSpot(x, y, minDist = 28) {
      // Lejos de la posición inicial de la culebra principal
      if (Math.hypot(x - W / 2, y - H * 0.72) < 55) return false;
      for (const sk of skulls) {
        if (Math.hypot(x - sk.x, y - sk.y) < minDist) return false;
      }
      for (const it of items) {
        if (Math.hypot(x - it.x, y - it.y) < minDist * 0.7) return false;
      }
      return true;
    }

    function spawnSkullsForLevel(lvl) {
      skulls = [];
      // Desde nivel 1 o 2: pongamos 1 calavera en nivel 1 como aviso suave, y más a partir del nivel 2
      const count = lvl === 1 ? 1 : Math.min(7, lvl + 1);
      let attempts = 0;
      while (skulls.length < count && attempts < 120) {
        attempts++;
        const x = 34 + Math.random() * (W - 68);
        const y = 34 + Math.random() * (H - 68);
        if (isSafeSpot(x, y, 36)) {
          skulls.push({
            x,
            y,
            r: 8.5,
            bob: Math.random() * Math.PI * 2
          });
        }
      }
    }

    function spawnItem(forcedType = null) {
      let type = forcedType;
      if (!type) {
        const roll = Math.random();
        if (roll < 0.55) type = "berry";     // Fruta fresa (+10 pts)
        else if (roll < 0.85) type = "citrus"; // Fruta cítrica (+20 pts)
        else type = "reward";                  // Recompensa estrella (+40 pts + 3 segmentos)
      }

      let x = W / 2;
      let y = H / 2;
      for (let i = 0; i < 40; i++) {
        const tx = 24 + Math.random() * (W - 48);
        const ty = 24 + Math.random() * (H - 48);
        if (isSafeSpot(tx, ty, 24)) {
          x = tx;
          y = ty;
          break;
        }
      }

      const points = type === "reward" ? 40 : (type === "citrus" ? 20 : 10);
      const growth = type === "reward" ? 3 : (type === "citrus" ? 2 : 2);
      const r = type === "reward" ? 6.5 : 5.5;

      items.push({
        x,
        y,
        r,
        type,
        points,
        growth,
        pulse: Math.random() * Math.PI * 2
      });
    }

    function initItems(count = 6) {
      items = [];
      for (let i = 0; i < count; i++) {
        spawnItem(i === count - 1 ? "reward" : null);
      }
    }

    function updateHud() {
      levelUi.textContent = `Nivel ${level}`;
      scoreUi.textContent = `Puntos: ${levelScore} / ${POINTS_PER_LEVEL}`;
      snakesUi.textContent = `Culebras: ${snakes.length}`;
      const pct = Math.min(100, Math.round((levelScore / POINTS_PER_LEVEL) * 100));
      progressFill.style.width = `${pct}%`;
    }

    function setupLevel(targetLevel, keepReset = false) {
      level = targetLevel;
      levelScore = 0;
      if (keepReset) totalScore = 0;
      gameOver = false;
      deathReason = "¡Chocaste!";
      isLevelUp = false;
      isPaused = false;
      popups = [];
      pauseModal.classList.remove("active");
      levelupModal.classList.remove("active");
      snakes = [createSnake(W / 2, H * 0.72, -Math.PI / 2, 12, 152, true)];
      spawnSkullsForLevel(level);
      initItems(6);
      updateHud();
    }

    function resetGame() {
      setupLevel(1, true);
    }

    function normalizeAngle(a) {
      while (a > Math.PI) a -= Math.PI * 2;
      while (a < -Math.PI) a += Math.PI * 2;
      return a;
    }

    function chooseAutonomousDirection(s) {
      const head = s.segments[0];
      const margin = 34;

      // Esquivar calaveras cercanas
      for (const sk of skulls) {
        const d = Math.hypot(head.x - sk.x, head.y - sk.y);
        if (d < 34) {
          const awayAngle = Math.atan2(head.y - sk.y, head.x - sk.x);
          const diff = normalizeAngle(awayAngle - s.angle);
          return diff >= 0 ? 1 : -1;
        }
      }

      // Evitar bordes
      if (head.x < margin) return normalizeAngle(0 - s.angle) >= 0 ? 1 : -1;
      if (head.x > W - margin) return normalizeAngle(Math.PI - s.angle) >= 0 ? 1 : -1;
      if (head.y < margin) return normalizeAngle(Math.PI / 2 - s.angle) >= 0 ? 1 : -1;
      if (head.y > H - margin) return normalizeAngle(-Math.PI / 2 - s.angle) >= 0 ? 1 : -1;

      // Buscar fruta o recompensa más cercana
      if (items.length > 0) {
        let nearest = items[0];
        let bestDist = Math.hypot(head.x - nearest.x, head.y - nearest.y);
        for (let i = 1; i < items.length; i++) {
          const d = Math.hypot(head.x - items[i].x, head.y - items[i].y);
          if (d < bestDist) {
            bestDist = d;
            nearest = items[i];
          }
        }
        const targetAngle = Math.atan2(nearest.y - head.y, nearest.x - head.x);
        const diff = normalizeAngle(targetAngle - s.angle);
        if (Math.abs(diff) < 0.14) return 0;
        return diff > 0 ? 1 : -1;
      }

      return s.aiTurn;
    }

    function splitSnakes() {
      if (isPaused || isSettingsOpen || isLevelUp) return;
      if (gameOver) {
        resetGame();
        return;
      }
      const nextSnakes = [];
      let didSplit = false;
      for (const s of snakes) {
        if (s.segments.length >= 8 && nextSnakes.length + snakes.length <= 4) {
          const mid = Math.floor(s.segments.length / 2);
          const secondPart = s.segments.splice(mid);
          s.segments.push({ ...s.segments[s.segments.length - 1] });
          const angleB = normalizeAngle(s.angle + (s.isPlayer ? 0.85 : 0.65));
          nextSnakes.push(s);
          nextSnakes.push({
            segments: secondPart,
            angle: angleB,
            turnDir: 0,
            hue: (s.hue + 55) % 360,
            radius: s.radius,
            isPlayer: false,
            aiTimer: 0.45 + Math.random() * 0.6,
            aiTurn: Math.random() < 0.5 ? -1 : 1
          });
          didSplit = true;
        } else {
          nextSnakes.push(s);
        }
      }
      if (didSplit) buzz(25);
      snakes = nextSnakes;
      updateHud();
    }

    function setPlayerTurn(dir) {
      for (const s of snakes) {
        if (s.isPlayer) s.turnDir = dir;
      }
    }

    // Botones de Pausa y Configuración
    document.getElementById("btn-pause").addEventListener("click", () => {
      if (gameOver || isLevelUp || isSettingsOpen) return;
      isPaused = !isPaused;
      if (isPaused) {
        pauseInfo.textContent = `Nivel ${level} · ${levelScore} / ${POINTS_PER_LEVEL} pts`;
        pauseModal.classList.add("active");
      } else {
        pauseModal.classList.remove("active");
      }
    });

    document.getElementById("btn-resume").addEventListener("click", () => {
      isPaused = false;
      pauseModal.classList.remove("active");
    });

    document.getElementById("btn-restart-pause").addEventListener("click", () => {
      resetGame();
    });

    document.getElementById("btn-settings").addEventListener("click", () => {
      if (gameOver || isLevelUp) return;
      isSettingsOpen = !isSettingsOpen;
      if (isSettingsOpen) {
        pauseModal.classList.remove("active");
        isPaused = false;
        settingsModal.classList.add("active");
      } else {
        settingsModal.classList.remove("active");
      }
    });

    document.getElementById("btn-close-settings").addEventListener("click", () => {
      isSettingsOpen = false;
      settingsModal.classList.remove("active");
    });

    document.getElementById("btn-next-level").addEventListener("click", () => {
      setupLevel(level + 1, false);
    });

    // Opciones de Configuración
    document.querySelectorAll("#speed-options .pill-btn").forEach((btn) => {
      btn.addEventListener("click", () => {
        document.querySelectorAll("#speed-options .pill-btn").forEach(b => b.classList.remove("selected"));
        btn.classList.add("selected");
        baseSpeed = Number(btn.dataset.speed);
      });
    });

    document.querySelectorAll("#theme-options .pill-btn").forEach((btn) => {
      btn.addEventListener("click", () => {
        document.querySelectorAll("#theme-options .pill-btn").forEach(b => b.classList.remove("selected"));
        btn.classList.add("selected");
        if (btn.dataset.theme === "dark") document.body.classList.add("dark");
        else document.body.classList.remove("dark");
      });
    });

    document.querySelectorAll("#vib-options .pill-btn").forEach((btn) => {
      btn.addEventListener("click", () => {
        document.querySelectorAll("#vib-options .pill-btn").forEach(b => b.classList.remove("selected"));
        btn.classList.add("selected");
        vibrationEnabled = btn.dataset.vib === "on";
        if (vibrationEnabled) buzz(20);
      });
    });

    // Controles de movimiento
    document.getElementById("btn-left").addEventListener("pointerdown", () => setPlayerTurn(-1));
    document.getElementById("btn-left").addEventListener("pointerup", () => setPlayerTurn(0));
    document.getElementById("btn-left").addEventListener("pointerleave", () => setPlayerTurn(0));

    document.getElementById("btn-right").addEventListener("pointerdown", () => setPlayerTurn(1));
    document.getElementById("btn-right").addEventListener("pointerup", () => setPlayerTurn(0));
    document.getElementById("btn-right").addEventListener("pointerleave", () => setPlayerTurn(0));

    document.getElementById("btn-split").addEventListener("click", splitSnakes);

    canvas.addEventListener("pointerdown", (e) => {
      if (isPaused || isSettingsOpen || isLevelUp) return;
      if (gameOver) {
        resetGame();
        return;
      }
      touchStartX = e.clientX;
    });

    canvas.addEventListener("pointermove", (e) => {
      if (touchStartX === null) return;
      const dx = e.clientX - touchStartX;
      if (dx < -14) setPlayerTurn(-1);
      else if (dx > 14) setPlayerTurn(1);
    });

    canvas.addEventListener("pointerup", () => {
      touchStartX = null;
      setPlayerTurn(0);
    });

    window.addEventListener("keydown", (e) => {
      if (e.key === "ArrowLeft" || e.key === "a") setPlayerTurn(-1);
      if (e.key === "ArrowRight" || e.key === "d") setPlayerTurn(1);
      if (e.key === " " || e.key === "Enter") splitSnakes();
    });

    window.addEventListener("keyup", (e) => {
      if (["ArrowLeft", "a", "ArrowRight", "d"].includes(e.key)) setPlayerTurn(0);
    });

    function triggerLevelUp() {
      isLevelUp = true;
      buzz([40, 50, 60]);
      const nextLvl = level + 1;
      const nextSkulls = Math.min(7, nextLvl + 1);
      levelupTitle.textContent = `¡Nivel ${level} Superado!`;
      levelupSub.textContent = `Alcanzaste los ${POINTS_PER_LEVEL} puntos. En el Nivel ${nextLvl} habrá ${nextSkulls} calaveras y más ritmo.`;
      levelupModal.classList.add("active");
    }

    function update(dt) {
      if (gameOver || isPaused || isSettingsOpen || isLevelUp) return;

      const currentSpeed = baseSpeed + (level - 1) * 5;
      const turnSpeed = 3.0;
      const survivingSnakes = [];

      for (const s of snakes) {
        if (!s.isPlayer) {
          s.aiTimer -= dt;
          if (s.aiTimer <= 0) {
            s.aiTimer = 0.35 + Math.random() * 0.65;
            s.aiTurn = chooseAutonomousDirection(s);
          }
          s.turnDir = chooseAutonomousDirection(s);
        }

        s.angle = normalizeAngle(s.angle + s.turnDir * turnSpeed * dt);
        const head = s.segments[0];
        const nx = head.x + Math.cos(s.angle) * currentSpeed * dt;
        const ny = head.y + Math.sin(s.angle) * currentSpeed * dt;

        // Choque contra borde
        const hitWall = nx < s.radius || nx > W - s.radius || ny < s.radius || ny > H - s.radius;
        if (hitWall) {
          if (s.isPlayer) {
            deathReason = "¡Chocaste con el borde!";
            gameOver = true;
            buzz(80);
            return;
          } else {
            addPopup(head.x, head.y, "×", "#ef4444");
            continue;
          }
        }

        // Choque contra calavera
        let hitSkull = false;
        for (const sk of skulls) {
          if (Math.hypot(nx - sk.x, ny - sk.y) < s.radius + sk.r - 1.5) {
            hitSkull = true;
            break;
          }
        }
        if (hitSkull) {
          if (s.isPlayer) {
            deathReason = "¡Tocaste una calavera!";
            gameOver = true;
            buzz([70, 40, 90]);
            return;
          } else {
            addPopup(head.x, head.y, "💀", "#ef4444");
            continue;
          }
        }

        s.segments.unshift({ x: nx, y: ny });
        s.segments.pop();

        // Comer frutas o recompensas
        for (let i = items.length - 1; i >= 0; i--) {
          const it = items[i];
          const dist = Math.hypot(nx - it.x, ny - it.y);
          if (dist < s.radius + it.r + 2) {
            items.splice(i, 1);
            spawnItem();
            levelScore += it.points;
            totalScore += it.points;
            buzz(it.type === "reward" ? [25, 25, 35] : 15);
            addPopup(
              it.x,
              it.y - 6,
              `+${it.points}`,
              it.type === "reward" ? "#d97706" : "#16a34a"
            );

            const tail = s.segments[s.segments.length - 1];
            for (let g = 0; g < it.growth; g++) {
              s.segments.push({ ...tail });
            }
            updateHud();

            if (levelScore >= POINTS_PER_LEVEL) {
              triggerLevelUp();
              return;
            }
          }
        }

        survivingSnakes.push(s);
      }

      if (survivingSnakes.length !== snakes.length) {
        snakes = survivingSnakes;
        updateHud();
      }

      for (const it of items) it.pulse += dt * 5;
      for (const sk of skulls) sk.bob += dt * 3;
      for (let i = popups.length - 1; i >= 0; i--) {
        popups[i].y -= 22 * dt;
        popups[i].life -= dt;
        if (popups[i].life <= 0) popups.splice(i, 1);
      }
    }

    function drawSkull(sk) {
      const yOff = Math.sin(sk.bob) * 1.4;
      const x = sk.x;
      const y = sk.y + yOff;
      const r = sk.r;

      // Sombra/alerta suave
      ctx.fillStyle = "rgba(239, 68, 68, 0.16)";
      ctx.beginPath();
      ctx.arc(x, y, r * 1.45, 0, Math.PI * 2);
      ctx.fill();

      // Cráneo
      ctx.fillStyle = "#f8fafc";
      ctx.strokeStyle = "#334155";
      ctx.lineWidth = 1.6;
      ctx.beginPath();
      ctx.arc(x, y - 1.5, r * 0.78, Math.PI * 0.85, Math.PI * 2.15);
      ctx.lineTo(x + r * 0.55, y + r * 0.65);
      ctx.lineTo(x - r * 0.55, y + r * 0.65);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      // Ojos oscuros
      ctx.fillStyle = "#0f172a";
      ctx.beginPath();
      ctx.arc(x - r * 0.28, y - 1.5, r * 0.18, 0, Math.PI * 2);
      ctx.arc(x + r * 0.28, y - 1.5, r * 0.18, 0, Math.PI * 2);
      ctx.fill();

      // Pequeñas líneas de mandíbula
      ctx.strokeStyle = "#334155";
      ctx.lineWidth = 1.1;
      ctx.beginPath();
      ctx.moveTo(x - r * 0.22, y + r * 0.35);
      ctx.lineTo(x - r * 0.22, y + r * 0.65);
      ctx.moveTo(x, y + r * 0.35);
      ctx.lineTo(x, y + r * 0.65);
      ctx.moveTo(x + r * 0.22, y + r * 0.35);
      ctx.lineTo(x + r * 0.22, y + r * 0.65);
      ctx.stroke();
    }

    function drawItem(it) {
      const pulseR = it.r + Math.sin(it.pulse) * 1.3;

      if (it.type === "reward") {
        // Recompensa dorada brillante
        const grad = ctx.createRadialGradient(it.x, it.y, 1, it.x, it.y, pulseR * 2.2);
        grad.addColorStop(0, "rgba(251, 191, 36, 0.75)");
        grad.addColorStop(1, "rgba(251, 191, 36, 0)");
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(it.x, it.y, pulseR * 2.2, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = "#f59e0b";
        ctx.beginPath();
        for (let i = 0; i < 10; i++) {
          const rad = i % 2 === 0 ? pulseR + 1.5 : (pulseR + 1.5) * 0.48;
          const ang = -Math.PI / 2 + (i * Math.PI) / 5;
          const px = it.x + Math.cos(ang) * rad;
          const py = it.y + Math.sin(ang) * rad;
          if (i === 0) ctx.moveTo(px, py);
          else ctx.lineTo(px, py);
        }
        ctx.closePath();
        ctx.fill();
      } else if (it.type === "citrus") {
        // Fruta cítrica naranja
        ctx.fillStyle = "#fb923c";
        ctx.beginPath();
        ctx.arc(it.x, it.y, pulseR, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = "#22c55e";
        ctx.beginPath();
        ctx.ellipse(it.x + 2, it.y - pulseR + 0.5, 3, 1.5, -0.5, 0, Math.PI * 2);
        ctx.fill();
      } else {
        // Fruta roja tipo fresa
        ctx.fillStyle = "#ef4444";
        ctx.beginPath();
        ctx.arc(it.x, it.y, pulseR, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = "#22c55e";
        ctx.beginPath();
        ctx.ellipse(it.x, it.y - pulseR + 0.5, 3.2, 1.6, 0.2, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    function draw() {
      ctx.clearRect(0, 0, W, H);

      for (const sk of skulls) drawSkull(sk);
      for (const it of items) drawItem(it);

      for (const s of snakes) {
        for (let i = s.segments.length - 1; i >= 0; i--) {
          const seg = s.segments[i];
          const ratio = 1 - (i / Math.max(s.segments.length, 1)) * 0.45;
          const r = s.radius * ratio;

          const bodyGrad = ctx.createRadialGradient(
            seg.x - r * 0.35,
            seg.y - r * 0.35,
            r * 0.15,
            seg.x,
            seg.y,
            r
          );
          bodyGrad.addColorStop(0, `hsla(${s.hue}, 88%, 62%, 1)`);
          bodyGrad.addColorStop(1, `hsla(${s.hue}, 78%, 32%, 1)`);

          ctx.fillStyle = bodyGrad;
          ctx.beginPath();
          ctx.arc(seg.x, seg.y, r, 0, Math.PI * 2);
          ctx.fill();
        }

        if (s.isPlayer && s.segments.length > 0) {
          const h = s.segments[0];
          ctx.fillStyle = "#ffffff";
          ctx.beginPath();
          ctx.arc(h.x, h.y, 2.2, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      for (const p of popups) {
        ctx.save();
        ctx.globalAlpha = Math.max(0, p.life / 0.9);
        ctx.fillStyle = p.color;
        ctx.font = "bold 12px system-ui, sans-serif";
        ctx.textAlign = "center";
        ctx.fillText(p.text, p.x, p.y);
        ctx.restore();
      }

      if (gameOver) {
        const isDark = document.body.classList.contains("dark");
        ctx.fillStyle = isDark ? "rgba(14, 17, 22, 0.88)" : "rgba(241, 245, 249, 0.88)";
        ctx.fillRect(0, 0, W, H);
        ctx.fillStyle = isDark ? "#f8fafc" : "#0f172a";
        ctx.font = "bold 20px system-ui, sans-serif";
        ctx.textAlign = "center";
        ctx.fillText(deathReason, W / 2, H / 2 - 16);
        ctx.font = "13px system-ui, sans-serif";
        ctx.fillStyle = isDark ? "#cbd5e1" : "#334155";
        ctx.fillText(`Nivel ${level} · Total acumulado: ${totalScore} pts`, W / 2, H / 2 + 8);
        ctx.fillText("Toca aquí o en Dividir para reiniciar", W / 2, H / 2 + 30);
      }
    }

    function loop(timestamp) {
      const dt = Math.min((timestamp - lastTime) / 1000 || 0.016, 0.05);
      lastTime = timestamp;
      update(dt);
      draw();
      requestAnimationFrame(loop);
    }

    setupLevel(1, true);
    requestAnimationFrame(loop);
  </script>
</body>
</html>
