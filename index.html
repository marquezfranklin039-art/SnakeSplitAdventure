<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Snake Split Arena</title>
    <style>
        * { box-sizing: border-box; touch-action: none; -webkit-tap-highlight-color: transparent; }
        body, html { 
            margin: 0; padding: 0; 
            background-color: #050508; color: #fff; 
            font-family: Arial, sans-serif; 
            overflow: hidden; width: 100vw; height: 100vh; 
            display: flex; flex-direction: column; align-items: center; justify-content: space-between;
        }
        
        /* ENCABEZADO CON META DE 300 PUNTOS */
        #ui-header {
            width: 100%; height: 50px; display: flex; flex-direction: column; 
            justify-content: center; align-items: center; background: #0a0a12;
            border-bottom: 2px solid #ff0055; flex-shrink: 0;
        }
        #title { font-size: 14px; font-weight: bold; color: #ff0055; margin: 0; }
        #scores { font-size: 12px; font-weight: bold; margin-top: 2px; display: flex; gap: 12px; }
        #score-val { color: #00ffcc; }
        #target-val { color: #ff00ff; }
        #high-val { color: #ffcc00; }

        /* CANCHA CENTRADA Y DELIMITADA */
        #canvas-area {
            width: 100%; flex-grow: 1; display: flex; 
            justify-content: center; align-items: center;
            padding: 5px 0;
        }
        canvas { 
            border: 3px solid #ff0055; 
            box-shadow: 0 0 15px rgba(255, 0, 85, 0.5); 
            border-radius: 8px;
            background: #000005;
            display: block;
        }

        /* MODAL DE VICTORIA */
        #victory-modal {
            display: none;
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(5, 5, 8, 0.9); backdrop-filter: blur(5px);
            z-index: 100; flex-direction: column; justify-content: center; align-items: center;
        }
        #victory-card {
            background: #0a0a12; border: 2px solid #00ffcc; border-radius: 12px;
            padding: 25px; text-align: center; box-shadow: 0 0 25px rgba(0, 255, 204, 0.4);
            max-width: 85%;
        }
        #victory-card h2 { color: #00ffcc; margin: 0 0 10px 0; font-size: 20px; }
        #victory-card p { color: #fff; margin: 0 0 20px 0; font-size: 14px; }
        #next-btn {
            background: #ff0055; color: #fff; border: none; padding: 12px 24px;
            font-size: 15px; font-weight: bold; border-radius: 8px;
            box-shadow: 0 0 10px rgba(255, 0, 85, 0.5); cursor: pointer;
        }

        /* BLOQUE INFERIOR DE CONTROLES (SIN ATRAVESAR LA CANCHA) */
        #dpad-container {
            width: 100%; height: 160px; display: flex; 
            justify-content: center; align-items: center; 
            background: #050508; flex-shrink: 0; padding-bottom: 10px;
        }
        #dpad {
            width: 140px; height: 140px; display: grid; 
            grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr);
        }
        .d-btn {
            background: rgba(0, 240, 255, 0.3); border: 2px solid #00f0ff; border-radius: 10px;
            display: flex; justify-content: center; align-items: center; color: #00f0ff; font-size: 24px;
            user-select: none;
        }
        .d-btn:active { background: rgba(0, 240, 255, 0.7); }
        #btn-up { grid-column: 2; grid-row: 1; }
        #btn-left { grid-column: 1; grid-row: 2; }
        #btn-right { grid-column: 3; grid-row: 2; }
        #btn-down { grid-column: 2; grid-row: 3; }
    </style>
</head>
<body>
    <div id="ui-header">
        <div id="title">SNAKE SPLIT: BATTLE ARENA - ÁREA 1</div>
        <div id="scores">
            <span id="score-val">PUNTOS: 0</span>
            <span id="target-val">META: 300</span>
            <span id="high-val">RÉCORD: 0</span>
        </div>
    </div>

    <div id="canvas-area">
        <canvas id="gameCanvas"></canvas>
    </div>

    <div id="victory-modal">
        <div id="victory-card">
            <h2>¡ÁREA COMPLETADA!</h2>
            <p>¡Lograste los 300 puntos!</p>
            <button id="next-btn">SIGUIENTE ÁREA</button>
        </div>
    </div>

    <div id="dpad-container">
        <div id="dpad">
            <div id="btn-up" class="d-btn">&#9650;</div>
            <div id="btn-left" class="d-btn">&#9668;</div>
            <div id="btn-right" class="d-btn">&#9658;</div>
            <div id="btn-down" class="d-btn">&#9660;</div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        const GRID_SIZE = 20;
        const TARGET_SCORE = 300;
        let COLS = 14;
        let ROWS = 16;
        
        let snake = [];
        let splitSnakes = [];
        let food = { x: 3, y: 3 };
        let splitItem = { x: 8, y: 8 };
        let direction = 'RIGHT';
        let nextDirection = 'RIGHT';
        let score = 0;
        let currentLevel = 1;
        let isLevelComplete = false;
        let highScore = parseInt(localStorage.getItem('snake_highscore')) || 0;
        let audioCtx = null;

        function setupCanvasSize() {
            const area = document.getElementById('canvas-area');
            const maxW = area.clientWidth - 16;
            const maxH = area.clientHeight - 16;

            COLS = Math.floor(maxW / GRID_SIZE);
            ROWS = Math.floor(maxH / GRID_SIZE);

            if (COLS < 10) COLS = 10;
            if (ROWS < 10) ROWS = 10;

            canvas.width = COLS * GRID_SIZE;
            canvas.height = ROWS * GRID_SIZE;
        }

        function initAudio() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }

        function playSound(type) {
            try {
                initAudio();
                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);

                if (type === 'eat') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(600, audioCtx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.1);
                    gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
                    osc.start(); osc.stop(audioCtx.currentTime + 0.1);
                } else if (type === 'split') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(400, audioCtx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 0.2);
                    gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
                    osc.start(); osc.stop(audioCtx.currentTime + 0.2);
                } else if (type === 'win') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(523, audioCtx.currentTime);
                    osc.frequency.setValueAtTime(659, audioCtx.currentTime + 0.15);
                    osc.frequency.setValueAtTime(783, audioCtx.currentTime + 0.3);
                    gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
                    osc.start(); osc.stop(audioCtx.currentTime + 0.5);
                } else if (type === 'die') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(220, audioCtx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(50, audioCtx.currentTime + 0.3);
                    gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                    osc.start(); osc.stop(audioCtx.currentTime + 0.3);
                }
            } catch (e) {}
        }

        function resetGame() {
            score = 0;
            isLevelComplete = false;
            direction = 'RIGHT';
            nextDirection = 'RIGHT';
            document.getElementById('victory-modal').style.display = 'none';
            document.getElementById('score-val').innerText = 'PUNTOS: ' + score;
            document.getElementById('high-val').innerText = 'RÉCORD: ' + highScore;
            document.getElementById('title').innerText = 'SNAKE SPLIT: BATTLE ARENA - ÁREA ' + currentLevel;

            let startX = Math.floor(COLS / 2);
            let startY = Math.floor(ROWS / 2);

            snake = [];
            for (let i = 0; i < 5; i++) {
                snake.push({ x: startX - i, y: startY });
            }

            splitSnakes = [];
            spawnFood();
            spawnSplitItem();
            draw();
        }

        function spawnFood() {
            food.x = Math.floor(Math.random() * COLS);
            food.y = Math.floor(Math.random() * ROWS);
        }

        function spawnSplitItem() {
            splitItem.x = Math.floor(Math.random() * COLS);
            splitItem.y = Math.floor(Math.random() * ROWS);
        }

        function changeDir(newDir) {
            initAudio();
            if (isLevelComplete) return;
            if (newDir === 'UP' && direction !== 'DOWN') nextDirection = 'UP';
            if (newDir === 'DOWN' && direction !== 'UP') nextDirection = 'DOWN';
            if (newDir === 'LEFT' && direction !== 'RIGHT') nextDirection = 'LEFT';
            if (newDir === 'RIGHT' && direction !== 'LEFT') nextDirection = 'RIGHT';
        }

        function doSplit() {
            if (snake.length <= 3) return;
            let half = Math.floor(snake.length / 2);
            let tailPart = snake.splice(half);

            let dirs = ['UP', 'DOWN', 'LEFT', 'RIGHT'];
            splitSnakes.push({
                body: tailPart,
                dir: dirs[Math.floor(Math.random() * dirs.length)]
            });
            playSound('split');
        }

        function update() {
            if (isLevelComplete) return;

            direction = nextDirection;
            let head = { x: snake[0].x, y: snake[0].y };

            if (direction === 'RIGHT') head.x++;
            else if (direction === 'LEFT') head.x--;
            else if (direction === 'UP') head.y--;
            else if (direction === 'DOWN') head.y++;

            // Choque con paredes
            if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS) {
                playSound('die');
                resetGame();
                return;
            }

            // Choque propio
            for (let i = 1; i < snake.length; i++) {
                if (head.x === snake[i].x && head.y === snake[i].y) {
                    playSound('die');
                    resetGame();
                    return;
                }
            }

            // Choque con serpientes divididas
            for (let group of splitSnakes) {
                for (let seg of group.body) {
                    if (head.x === seg.x && head.y === seg.y) {
                        playSound('die');
                        resetGame();
                        return;
                    }
                }
            }

            snake.unshift(head);

            if (head.x === food.x && head.y === food.y) {
                score += 10;
                checkScore();
                playSound('eat');
                spawnFood();
            } else if (head.x === splitItem.x && head.y === splitItem.y) {
                score += 25;
                checkScore();
                doSplit();
                spawnSplitItem();
            } else {
                snake.pop();
            }

            // Movimiento de serpientes divididas
            splitSnakes.forEach(group => {
                let sBody = group.body;
                let sHead = { x: sBody[0].x, y: sBody[0].y };

                if (group.dir === 'DOWN') sHead.y++;
                else if (group.dir === 'UP') sHead.y--;
                else if (group.dir === 'RIGHT') sHead.x++;
                else if (group.dir === 'LEFT') sHead.x--;

                if (sHead.x < 0 || sHead.x >= COLS || sHead.y < 0 || sHead.y >= ROWS) {
                    let dirs = ['UP', 'DOWN', 'LEFT', 'RIGHT'];
                    group.dir = dirs[Math.floor(Math.random() * dirs.length)];
                    return;
                }

                if (Math.random() < 0.15) {
                    let dirs = ['UP', 'DOWN', 'LEFT', 'RIGHT'];
                    group.dir = dirs[Math.floor(Math.random() * dirs.length)];
                }

                sBody.unshift(sHead);
                sBody.pop();
            });

            draw();
        }

        function checkScore() {
            document.getElementById('score-val').innerText = 'PUNTOS: ' + score;
            if (score > highScore) {
                highScore = score;
                localStorage.setItem('snake_highscore', highScore);
                document.getElementById('high-val').innerText = 'RÉCORD: ' + highScore;
            }

            if (score >= TARGET_SCORE) {
                isLevelComplete = true;
                playSound('win');
                document.getElementById('victory-modal').style.display = 'flex';
            }
        }

        function drawStar(cx, cy, spikes, outerRadius, innerRadius, color) {
            let rot = Math.PI / 2 * 3;
            let x = cx;
            let y = cy;
            let step = Math.PI / spikes;

            ctx.beginPath();
            ctx.moveTo(cx, cy - outerRadius);
            for (let i = 0; i < spikes; i++) {
                x = cx + Math.cos(rot) * outerRadius;
                y = cy + Math.sin(rot) * outerRadius;
                ctx.lineTo(x, y);
                rot += step;

                x = cx + Math.cos(rot) * innerRadius;
                y = cy + Math.sin(rot) * innerRadius;
                ctx.lineTo(x, y);
                rot += step;
            }
            ctx.lineTo(cx, cy - outerRadius);
            ctx.closePath();
            ctx.fillStyle = color;
            ctx.fill();
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 1. Manzana Rosa
            let fx = food.x * GRID_SIZE + GRID_SIZE/2;
            let fy = food.y * GRID_SIZE + GRID_SIZE/2;
            ctx.fillStyle = '#ff0055';
            ctx.beginPath();
            ctx.arc(fx, fy, GRID_SIZE/2 - 2, 0, Math.PI * 2);
            ctx.fill();

            // 2. Estrella Dorada (Split)
            let sx = splitItem.x * GRID_SIZE + GRID_SIZE/2;
            let sy = splitItem.y * GRID_SIZE + GRID_SIZE/2;
            drawStar(sx, sy, 5, GRID_SIZE/2 - 2, GRID_SIZE/4, '#ffcc00');

            // 3. Serpiente Principal
            snake.forEach((seg, index) => {
                let px = seg.x * GRID_SIZE;
                let py = seg.y * GRID_SIZE;

                if (index === 0) {
                    ctx.fillStyle = '#00ffcc';
                    ctx.fillRect(px + 1, py + 1, GRID_SIZE - 2, GRID_SIZE - 2);
                    ctx.fillStyle = '#ff0000';
                    ctx.fillRect(px + 3, py + 3, 4, 4);
                    ctx.fillRect(px + GRID_SIZE - 7, py + 3, 4, 4);
                } else {
                    ctx.fillStyle = '#00bfff';
                    ctx.beginPath();
                    ctx.arc(px + GRID_SIZE/2, py + GRID_SIZE/2, GRID_SIZE/2 - 2, 0, Math.PI * 2);
                    ctx.fill();
                }
            });

            // 4. Serpientes Divididas
            splitSnakes.forEach(group => {
                group.body.forEach((seg, index) => {
                    let px = seg.x * GRID_SIZE;
                    let py = seg.y * GRID_SIZE;

                    if (index === 0) {
                        ctx.fillStyle = '#ff5500';
                        ctx.fillRect(px + 1, py + 1, GRID_SIZE - 2, GRID_SIZE - 2);
                        ctx.fillStyle = '#ffff00';
                        ctx.fillRect(px + 3, py + 3, 4, 4);
                        ctx.fillRect(px + GRID_SIZE - 7, py + 3, 4, 4);
                    } else {
                        ctx.fillStyle = '#ffaa00';
                        ctx.beginPath();
                        ctx.arc(px + GRID_SIZE/2, py + GRID_SIZE/2, GRID_SIZE/2 - 2, 0, Math.PI * 2);
                        ctx.fill();
                    }
                });
            });
        }

        const bindBtn = (id, dir) => {
            const el = document.getElementById(id);
            el.addEventListener('touchstart', (e) => { e.preventDefault(); changeDir(dir); });
            el.addEventListener('mousedown', (e) => { e.preventDefault(); changeDir(dir); });
        };

        bindBtn('btn-up', 'UP');
        bindBtn('btn-down', 'DOWN');
        bindBtn('btn-left', 'LEFT');
        bindBtn('btn-right', 'RIGHT');

        document.getElementById('next-btn').addEventListener('click', () => {
            currentLevel++;
            resetGame();
        });

        // Inicialización limpia
        setupCanvasSize();
        resetGame();
        setInterval(update, 200);
    </script>
</body>
</html>
