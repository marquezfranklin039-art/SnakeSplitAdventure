<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Snake Split</title>
<style>
* { box-sizing: border-box; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
body {
  margin: 0;
  width: 100%;
  min-height: 100vh;
  padding: 6px;
  background: linear-gradient(160deg, #dbeafe 0%, #f1f5f9 55%, #e2e8f0 100%);
  color: #0f172a;
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-start;
  overflow-x: hidden;
  touch-action: manipulation;
}
body.dark {
  background: linear-gradient(160deg, #090d16 0%, #111827 60%, #0b1120 100%);
  color: #f8fafc;
}
.bar {
  width: 100%;
  max-width: 480px;
  flex-shrink: 0;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 6px;
  margin-bottom: 6px;
  font-size: 13.5px;
  font-weight: 800;
}
.pill {
  background: #ffffff;
  color: #0369a1;
  border: 2px solid #0284c7;
  border-radius: 999px;
  padding: 5px 11px;
  box-shadow: 0 3px 0 rgba(2, 132, 199, 0.22);
}
body.dark .pill {
  background: #172033;
  color: #38bdf8;
  border-color: #38bdf8;
}
#box {
  position: relative;
  width: 100%;
  max-width: 480px;
  height: calc(100vh - 118px);
  min-height: 260px;
  max-height: 620px;
  border-radius: 18px;
  overflow: hidden;
  border: 3px solid #0284c7;
  background-color: #f0f9ff;
  background-image:
    linear-gradient(to right, rgba(2, 132, 199, 0.11) 1px, transparent 1px),
    linear-gradient(to bottom, rgba(2, 132, 199, 0.11) 1px, transparent 1px);
  background-size: 22px 22px;
  box-shadow: 0 10px 24px rgba(15, 23, 42, 0.18);
}
body.dark #box {
  background-color: #0b1120;
  background-image:
    linear-gradient(to right, rgba(56, 189, 248, 0.11) 1px, transparent 1px),
    linear-gradient(to bottom, rgba(56, 189, 248, 0.11) 1px, transparent 1px);
  background-size: 22px 22px;
  border-color: #38bdf8;
}
#stage {
  position: relative;
  width: 100%;
  height: 100%;
}
.ent {
  position: absolute;
  transform: translate(-50%, -50%);
  pointer-events: none;
}
.seg {
  border-radius: 50%;
  border: 1.5px solid #064e3b;
}
.head {
  border-radius: 50%;
  border: 2px solid #064e3b;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 10px;
  font-weight: 900;
  color: #0f172a;
}
.food {
  border-radius: 50%;
  border: 1.5px solid #0f172a;
}
.skull {
  border-radius: 50%;
  background: #ffffff;
  border: 2px solid #ef4444;
  color: #0f172a;
  font-size: 11px;
  font-weight: 900;
  display: flex;
  align-items: center;
  justify-content: center;
}
.wall {
  position: absolute;
  background: #334155;
  border: 1.5px solid #0f172a;
  border-radius: 4px;
  pointer-events: none;
}
body.dark .wall {
  background: #475569;
  border-color: #94a3b8;
}
.portal {
  border-radius: 50%;
  border: 2.5px dashed #a855f7;
  background: rgba(15, 23, 42, 0.85);
}
.fire {
  border-radius: 50%;
  background: #f97316;
  border: 1.5px solid #fef08a;
}
.fx {
  font-size: 12px;
  font-weight: 900;
  white-space: nowrap;
}
#overlay {
  position: absolute;
  left: 16px;
  right: 16px;
  top: 18px;
  padding: 10px 14px;
  border-radius: 14px;
  text-align: center;
  background: rgba(255, 255, 255, 0.86);
  border: 2px solid #0284c7;
  z-index: 5;
  cursor: pointer;
}
body.dark #overlay {
  background: rgba(15, 23, 42, 0.86);
  border-color: #38bdf8;
}
#ov-title {
  font-size: 20px;
  font-weight: 900;
  color: #0369a1;
}
body.dark #ov-title { color: #38bdf8; }
#ov-sub {
  margin-top: 2px;
  font-size: 12.5px;
  font-weight: 800;
  color: #0f172a;
}
body.dark #ov-sub { color: #e2e8f0; }
#cfg-panel {
  display: none;
  width: 100%;
  max-width: 480px;
  flex-shrink: 0;
  margin-top: 6px;
  padding: 8px;
  border-radius: 14px;
  background: #ffffff;
  border: 2px solid #cbd5e1;
  gap: 6px;
  flex-wrap: wrap;
  justify-content: center;
}
body.dark #cfg-panel { background: #172033; border-color: #334155; }
#cfg-panel.open { display: flex; }
.rec-tag {
  width: 100%;
  text-align: center;
  font-size: 12px;
  font-weight: 800;
  color: #0369a1;
  margin-top: 2px;
}
body.dark .rec-tag { color: #38bdf8; }
.pads {
  width: 100%;
  max-width: 480px;
  flex-shrink: 0;
  margin-top: 6px;
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
}
button {
  border: 2px solid #94a3b8;
  background: #ffffff;
  color: #0f172a;
  border-radius: 12px;
  padding: 10px 8px;
  font-weight: 800;
  font-size: 13.5px;
  cursor: pointer;
  touch-action: manipulation;
  box-shadow: 0 3px 0 #cbd5e1;
}
body.dark button {
  background: #172033;
  color: #f8fafc;
  border-color: #334155;
  box-shadow: 0 3px 0 #0f172a;
}
.main {
  background: linear-gradient(180deg, #0ea5e9 0%, #0284c7 100%);
  color: #ffffff;
  border-color: #0369a1;
  box-shadow: 0 3px 0 #0369a1;
}
</style>
</head>
<body>
  <div class="bar">
    <span class="pill" id="t-lvl">Nivel 1 / 100</span>
    <span class="pill" id="t-pts">0 / 300</span>
    <div style="display:flex;gap:6px;">
      <button type="button" id="b-pause">Pausa</button>
      <button type="button" id="b-cfg">Ajustes</button>
    </div>
  </div>

  <div id="box">
    <div id="stage"></div>
    <div id="overlay">
      <div id="ov-title">SNAKE SPLIT</div>
      <div id="ov-sub">Toca Jugar - 100 Niveles</div>
    </div>
  </div>

  <div id="cfg-panel">
    <button type="button" id="o-diff">Dificultad: Estandar</button>
    <button type="button" id="o-theme">Pantalla: Clara</button>
    <button type="button" id="o-snd">Sonido: Si</button>
    <div class="rec-tag" id="o-rec">Record: 0 pts - Nivel Max: 1</div>

  <div class="pads">
    <button type="button" id="b-left">Izq</button>
    <button type="button" class="main" id="b-center">Jugar</button>
    <button type="button" id="b-right">Der</button>
  </div>

  <script>
    var MAX_LVL = 100;
    var W = 380, H = 480;
    var box = document.getElementById("box");
    var stage = document.getElementById("stage");
    var tLvl = document.getElementById("t-lvl");
    var tPts = document.getElementById("t-pts");
    var bPause = document.getElementById("b-pause");
    var bCenter = document.getElementById("b-center");
    var cfgPanel = document.getElementById("cfg-panel");
    var overlay = document.getElementById("overlay");
    var ovTitle = document.getElementById("ov-title");
    var ovSub = document.getElementById("ov-sub");
    var oRec = document.getElementById("o-rec");

      { label: "Estandar", spd: 70, skulls: 2, move: 36 },
      { label: "Extrema", spd: 86, skulls: 3, move: 52 }

      best = Number(localStorage.getItem("ss_rec")) || 0;
      bestLvl = Math.min(MAX_LVL, Number(localStorage.getItem("ss_lvl")) || 1);
    } catch (e) {}

      W = box.clientWidth || 380;

      var dx = x1 - x2, dy = y1 - y2;
      return Math.sqrt(dx * dx + dy * dy);

    function getRaiderLevel() {
      return Math.min(25, 1 + Math.floor((lvl - 1) / 4));
    }

    function saveRec() {
      if (tot > best) best = tot;
      if (lvl > bestLvl) bestLvl = Math.min(MAX_LVL, lvl);
      oRec.textContent = "Record: " + best + " pts - Nivel Max: " + bestLvl;
      try {
        localStorage.setItem("ss_rec", String(best));
        localStorage.setItem("ss_lvl", String(bestLvl));
      } catch (e) {}
    }

    function addFx(x, y, txt, col) {
      fxList.push({ x: x, y: y, txt: txt, col: col, life: 0.75 });
    }

      var o = a.createOscillator(), g = a.createGain();

      o.frequency.setValueAtTime(f, t);

      g.gain.setValueAtTime(0.001, t);
      g.gain.linearRampToValueAtTime(v || 0.14, t + 0.012);

      o.connect(g);
      g.connect(a.destination);
      o.start(t);
      o.stop(t + d + 0.02);
    }
