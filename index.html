<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Snake Split Adventure</title>
<style>
* {
  box-sizing: border-box;
  user-select: none;
  -webkit-user-select: none;
  -webkit-tap-highlight-color: transparent;
}
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  min-height: 100%;
  touch-action: manipulation;
}
body {
  background-color: #090d16;
  color: #f8fafc;
  font-family: Arial, Helvetica, sans-serif;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-start;
  gap: 6px;
  padding: 6px;
}
.hud {
  width: 100%;
  max-width: 380px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 4px;
  font-size: 11px;
  font-weight: bold;
}
.tag {
  background-color: #111827;
  color: #4ade80;
  border: 2px solid #22c55e;
  border-radius: 8px;
  padding: 4px 6px;
  white-space: nowrap;
}
.tag.gold {
  color: #facc15;
  border-color: #eab308;
}
.tag.fire {
  color: #fb923c;
  border-color: #f97316;
}
.hud-btn {
  background-color: #1e293b;
  color: #ffffff;
  border: 2px solid #38bdf8;
  border-radius: 8px;
  padding: 4px 7px;
  font-size: 11px;
  font-weight: bold;
  cursor: pointer;
}
#arena-box {
  position: relative;
  width: 300px;
  height: 400px;
  border: 3px solid #22c55e;
  border-radius: 10px;
  background-color: #050811;
  overflow: hidden;
  box-shadow: 0 0 20px rgba(34, 197, 94, 0.25);
}
#cv {
  display: block;
  width: 300px;
  height: 400px;
}
#banner-lvl {
  display: none;
  position: absolute;
  top: 6px;
  left: 8px;
  right: 8px;
  background-color: #eab308;
  color: #090d16;
  font-size: 11px;
  font-weight: bold;
  text-align: center;
  padding: 4px;
  border-radius: 8px;
  z-index: 5;
}
#modal {
  position: absolute;
  top: 64px;
  left: 14px;
  right: 14px;
  background-color: #111827;
  border: 3px solid #f97316;
  border-radius: 12px;
  padding: 14px 10px;
  text-align: center;
  z-index: 10;
}
#m-title {
  font-size: 18px;
  font-weight: bold;
  color: #fb923c;
}
#m-desc {
  margin-top: 6px;
  font-size: 12px;
  line-height: 1.35;
  color: #e2e8f0;
}
#m-btn {
  margin-top: 10px;
  background-color: #22c55e;
  color: #050811;
  border: none;
  border-radius: 8px;
  padding: 9px 22px;
  font-size: 14px;
  font-weight: bold;
  cursor: pointer;
}
.dpad {
  width: 100%;
  max-width: 320px;
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 6px;
  margin-top: 2px;
}
.dpad-btn {
  background-color: #1e293b;
  color: #ffffff;
  border: 2px solid #38bdf8;
  border-radius: 10px;
  padding: 10px 4px;
  font-size: 14px;
  font-weight: bold;
  cursor: pointer;
}
.dpad-btn:active {
  background-color: #0284c7;
}
.dpad-btn.go-btn {
  background-color: #f97316;
  border-color: #fde047;
  color: #090d16;
}
</style>
</head>
<body>
  <div class="hud">
    <span class="tag gold" id="ui-score">0 pts</span>
    <span class="tag" id="ui-lvl">Nv 1</span>
    <span class="tag fire" id="ui-int">2 Intrusas</span>
    <button type="button" class="hud-btn" id="btn-pause">Pausa</button>
    <button type="button" class="hud-btn" id="btn-snd">Audio: Si</button>
  </div>

  <div id="arena-box">
    <canvas id="cv" width="300" height="400"></canvas>
    <div id="banner-lvl">NIVEL COMPLETADO</div>
    <div id="modal">
      <div id="m-title">SNAKE SPLIT ADVENTURE</div>
      <div id="m-desc">
        Come frutas, divide tu serpiente y esquiva las <b>calaveras</b>.<br />
        <b>2 serpientes intrusas</b> disparan bolas de fuego.
      </div>
      <button type="button" id="m-btn">JUGAR</button>
    </div>
  </div>

  <div class="dpad">
    <button type="button" class="dpad-btn go-btn" id="d-start">Jugar</button>
    <button type="button" class="dpad-btn" id="d-up">Arriba</button>
    <button type="button" class="dpad-btn" id="d-down">Abajo</button>
    <button type="button" class="dpad-btn" id="d-left">Izq</button>
    <button type="button" class="dpad-btn" id="d-right">Der</button>
    <button type="button" class="dpad-btn" id="d-p2">Pausa</button>
  </div>

  <script>
  (function () {
    var COLS = 15;
    var ROWS = 20;
    var S = 20;

    var cv = document.getElementById("cv");
    var ctx = cv.getContext("2d");
    var uiScore = document.getElementById("ui-score");
    var uiLvl = document.getElementById("ui-lvl");
    var bannerLvl = document.getElementById("banner-lvl");
    var modal = document.getElementById("modal");
    var mTitle = document.getElementById("m-title");
    var mDesc = document.getElementById("m-desc");
    var mBtn = document.getElementById("m-btn");
    var btnPause = document.getElementById("btn-pause");
    var btnSnd = document.getElementById("btn-snd");

    var sndOn = true;
    var actx = null;

    function getActx() {
      if (!sndOn) return null;
      try {
        var C = window.AudioContext || window.webkitAudioContext;
        if (!C) return null;
        if (!actx) actx = new C();
        if (actx.state === "suspended" && actx.resume) actx.resume();
        return actx;
      } catch (e) { return null; }
    }

    function beep(f, d, type, vol, f2) {
      var a = getActx();
      if (!a) return;
      try {
        var t = a.currentTime;
        var o = a.createOscillator();
        var g = a.createGain();
        o.type = type || "square";
        o.frequency.setValueAtTime(f, t);
        if (f2 && o.frequency.exponentialRampToValueAtTime) {
          o.frequency.exponentialRampToValueAtTime(Math.max(25, f2), t + d);
        }
        g.gain.setValueAtTime(vol || 0.07, t);
        if (g.gain.exponentialRampToValueAtTime) {
          g.gain.exponentialRampToValueAtTime(0.001, t + d);
        }
        o.connect(g); g.connect(a.destination);
        o.start(t); o.stop(t + d + 0.02);
      } catch (e) {}
    }

    function sfxEat() { beep(520, 0.08, "square", 0.07, 880); }
    function sfxSplit() { beep(380, 0.1, "triangle", 0.08, 760); }
    function sfxFire() { beep(260, 0.08, "sawtooth", 0.07, 110); }
    function sfxLevel() {
      beep(587, 0.08, "square", 0.08, 784);
      setTimeout(function () { beep(880, 0.12, "square", 0.08, 1174); }, 75);
    }
    function sfxDie() {
      beep(240, 0.14, "sawtooth", 0.09, 130);
      setTimeout(function () { beep(140, 0.22, "sawtooth", 0.09, 65); }, 120);
    }

    var mode = "idle";
    var score = 0;
    var level = 1;
    var eatenInLevel = 0;
    var bannerTicks = 0;

    var snakes = [];
    var intruders = [];
    var skulls = [];
    var fireballs = [];
    var fruit = { x: 10, y: 10 };
    var moveTick = 0;
    var fireTick = 0;

    function initSkulls() {
      skulls = [
        { x: 5, y: 5 },
        { x: 9, y: 14 },
        { x: 11, y: 5 }
      ];
    }

    function initSnakes() {
      snakes = [
        {
          dir: { x: 1, y: 0 },
          body: [{ x: 4, y: 10 }, { x: 3, y: 10 }, { x: 2, y: 10 }],
          color: "#22c55e",
          headColor: "#86efac"
        }
      ];
    }

    function initIntruders() {
      intruders = [
        {
          id: 1,
          dir: { x: 1, y: 0 },
          body: [{ x: 3, y: 2 }, { x: 2, y: 2 }, { x: 1, y: 2 }],
          color: "#ef4444",
          headColor: "#fca5a5",
          cooldown: 16
        },
        {
          id: 2,
          dir: { x: -1, y: 0 },
          body: [{ x: COLS - 4, y: ROWS - 3 }, { x: COLS - 3, y: ROWS - 3 }, { x: COLS - 2, y: ROWS - 3 }],
          color: "#f97316",
          headColor: "#fdba74",
          cooldown: 26
        }
      ];
    }

    function isOccupied(x, y) {
      for (var i = 0; i < snakes.length; i++) {
        for (var b = 0; b < snakes[i].body.length; b++) {
          if (snakes[i].body[b].x === x && snakes[i].body[b].y === y) return true;
        }
      }
      for (var j = 0; j < intruders.length; j++) {
        for (var ib = 0; ib < intruders[j].body.length; ib++) {
          if (intruders[j].body[ib].x === x && intruders[j].body[ib].y === y) return true;
        }
      }
      for (var k = 0; k < skulls.length; k++) {
        if (skulls[k].x === x && skulls[k].y === y) return true;
      }
      return false;
    }

    function placeFruit() {
      for (var tries = 0; tries < 90; tries++) {
        var fx = Math.floor(Math.random() * COLS);
        var fy = Math.floor(Math.random() * ROWS);
        if (!isOccupied(fx, fy)) {
          fruit = { x: fx, y: fy };
          return;
        }
      }
      fruit = { x: 7, y: 10 };
    }

    function addExtraSkull() {
      if (skulls.length >= 7) return;
      for (var tries = 0; tries < 60; tries++) {
        var sx = Math.floor(Math.random() * COLS);
        var sy = Math.floor(Math.random() * ROWS);
        if (!isOccupied(sx, sy) && !(sx === fruit.x && sy === fruit.y)) {
          skulls.push({ x: sx, y: sy });
          return;
        }
      }
    }

    function gameOver(reason) {
      mode = "over";
      sfxDie();
      mTitle.textContent = "FIN DEL JUEGO";
      mDesc.innerHTML = reason + "<br />Puntaje: <b>" + score + " pts</b>";
      mBtn.textContent = "REINTENTAR";
      modal.style.display = "block";
    }

    function startMatch() {
      getActx();
      score = 0;
      level = 1;
      eatenInLevel = 0;
