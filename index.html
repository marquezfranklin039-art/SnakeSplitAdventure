    <title>Snake Split Arena</title>

        #ui-header {

        }
        #header-info { display: flex; flex-direction: column; align-items: flex-start; }

        #score-val { color: #00ffcc; }
        #target-val { color: #ff00ff; }
        #high-val { color: #ffcc00; }

        }
