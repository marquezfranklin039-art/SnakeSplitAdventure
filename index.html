<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Snake Split Adventure</title>
<style>
* {
  box-sizing: border-box;
  user-select: none;
  -webkit-user-select: none;
  -webkit-tap-highlight-color: transparent;
}
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  min-height: 100%;
  touch-action: manipulation;
}
body {
  background: linear-gradient(180deg, #061428 0%, #0b2545 100%);
  color: #f8fafc;
  font-family: Arial, Helvetica, sans-serif;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-start;
  gap: 6px;
  padding: 6px;
}
.hud {
  width: 100%;
  max-width: 400px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 4px;
  font-size: 11px;
  font-weight: bold;
}
.tag {
  background-color: #0d2a4e;
  color: #7dd3fc;
  border: 2px solid #38bdf8;
  border-radius: 8px;
  padding: 4px 7px;
  white-space: nowrap;
}
.tag.gold {
  color: #fde047;
  border-color: #facc15;
}
.tag.fire {
  color: #fdba74;
  border-color: #f97316;
}
.hud-btn {
  background-color: #163b68;
  color: #ffffff;
  border: 2px solid #7dd3fc;
  border-radius: 8px;
  padding: 4px 8px;
  font-size: 11px;
  font-weight: bold;
  cursor: pointer;
}
#arena-box {
  position: relative;
  width: 340px;
  height: 420px;
  border: 3px solid #38bdf8;
  border-radius: 12px;
  background-color: #091e3a;
  overflow: hidden;
  box-shadow: 0 0 26px rgba(56, 189, 248, 0.35);
}
#cv {
  display: block;
  width: 340px;
  height: 420px;
}
#banner-lvl {
  display: none;
  position: absolute;
  top: 6px;
  left: 8px;
  right: 8px;
  background-color: #38bdf8;
  color: #061428;
  font-size: 11px;
  font-weight: bold;
  text-align: center;
  padding: 4px;
  border-radius: 8px;
  z-index: 5;
}
#modal {
  position: absolute;
  top: 72px;
  left: 16px;
  right: 16px;
  background-color: #0c2544;
  border: 3px solid #38bdf8;
  border-radius: 12px;
  padding: 14px 12px;
  text-align: center;
  z-index: 10;
  box-shadow: 0 10px 24px rgba(0, 0, 0, 0.6);
}
#m-title {
  font-size: 19px;
  font-weight: bold;
  color: #7dd3fc;
}
#m-desc {
  margin-top: 6px;
  font-size: 12px;
  line-height: 1.4;
  color: #e2e8f0;
}
#m-btn {
  margin-top: 10px;
  background-color: #0284c7;
  color: #ffffff;
  border: 2px solid #7dd3fc;
  border-radius: 8px;
  padding: 9px 24px;
  font-size: 14px;
  font-weight: bold;
  cursor: pointer;
}
.dpad {
  width: 100%;
  max-width: 340px;
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 6px;
  margin-top: 2px;
}
.dpad-btn {
  background-color: #0d2a4e;
  color: #ffffff;
  border: 2px solid #38bdf8;
  border-radius: 10px;
  padding: 10px 4px;
  font-size: 14px;
  font-weight: bold;
  cursor: pointer;
}
.dpad-btn:active {
  background-color: #0284c7;
}
.dpad-btn.go-btn {
  background-color: #ea580c;
  border-color: #fde047;
  color: #ffffff;
}
</style>
</head>
<body>
  <div class="hud">
    <span class="tag gold" id="ui-score">0 pts</span>
    <span class="tag" id="ui-lvl">Nv 1</span>
    <span class="tag fire" id="ui-int">2 Intrusas</span>
    <button type="button" class="hud-btn" id="btn-pause">Pausa</button>
    <button type="button" class="hud-btn" id="btn-snd">Audio: Si</button>
  </div>

  <div id="arena-box">
    <canvas id="cv" width="340" height="420"></canvas>
    <div id="banner-lvl">NIVEL COMPLETADO</div>
    <div id="modal">
      <div id="m-title">SNAKE SPLIT ADVENTURE</div>
      <div id="m-desc">
        Tu control mueve tu serpiente; las divididas van solas y suman puntos.<br />
        <b>2 serpientes intrusas</b> disparan bolas de fuego.
      </div>
      <button type="button" id="m-btn">JUGAR</button>
    </div>
  </div>

  <div class="dpad">
    <button type="button" class="dpad-btn go-btn" id="d-start">Jugar</button>
    <button type="button" class="dpad-btn" id="d-up">Arriba</button>
    <button type="button" class="dpad-btn" id="d-down">Abajo</button>
    <button type="button" class="dpad-btn" id="d-left">Izq</button>
    <button type="button" class="dpad-btn" id="d-right">Der</button>
    <button type="button" class="dpad-btn" id="d-p2">Pausa</button>
  </div>

  <script>
  (function () {
    var COLS = 17;
    var ROWS = 21;
    var S = 20;

    var cv = document.getElementById("cv");
    var ctx = cv.getContext("2d");
    var uiScore = document.getElementById("ui-score");
    var uiLvl = document.getElementById("ui-lvl");
    var bannerLvl = document.getElementById("banner-lvl");
    var modal = document.getElementById("modal");
    var mTitle = document.getElementById("m-title");
    var mDesc = document.getElementById("m-desc");
    var mBtn = document.getElementById("m-btn");
    var btnPause = document.getElementById("btn-pause");
    var btnSnd = document.getElementById("btn-snd");

    var sndOn = true;
    var actx = null;

    function getActx() {
      if (!sndOn) return null;
      try {
        var C = window.AudioContext || window.webkitAudioContext;
        if (!C) return null;
        if (!actx) actx = new C();
        if (actx.state === "suspended" && actx.resume) actx.resume();
        return actx;
      } catch (e) { return null; }
    }

    function beep(f, d, type, vol, f2) {
      var a = getActx();
      if (!a) return;
      try {
        var t = a.currentTime;
        var o = a.createOscillator();
        var g = a.createGain();
        o.type = type || "square";
        o.frequency.setValueAtTime(f, t);
        if (f2 && o.frequency.exponentialRampToValueAtTime) {
          o.frequency.exponentialRampToValueAtTime(Math.max(25, f2), t + d);
        }
        g.gain.setValueAtTime(vol || 0.07, t);
        if (g.gain.exponentialRampToValueAtTime) {
          g.gain.exponentialRampToValueAtTime(0.001, t + d);
        }
        o.connect(g); g.connect(a.destination);
        o.start(t); o.stop(t + d + 0.02);
      } catch (e) {}
    }

    function sfxEat() { beep(520, 0.08, "square", 0.07, 880); }
    function sfxSplit() { beep(380, 0.1, "triangle", 0.08, 760); }
    function sfxPortal() { beep(260, 0.14, "sine", 0.09, 980); }
    function sfxFire() { beep(260, 0.08, "sawtooth", 0.07, 110); }
    function sfxLevel() {
      beep(587, 0.08, "square", 0.08, 784);
      setTimeout(function () { beep(880, 0.12, "square", 0.08, 1174); }, 75);
    }
    function sfxDie() {
      beep(240, 0.14, "sawtooth", 0.09, 130);
      setTimeout(function () { beep(140, 0.22, "sawtooth", 0.09, 65); }, 120);
    }

    var mode = "idle";
    var score = 0;
    var level = 1;
    var eatenInLevel = 0;
    var bannerMs = 0;

    var playerSnake = null;
    var splitSnakes = [];
    var intruders = [];
    var barriers = [];
    var blackHoles = [];
    var skulls = [];
    var fireballs = [];
    var fruit = { x: 11, y: 10 };

    var stepAccumulator = 0;
    var stepDuration = 150;
    var fireAccumulator = 0;
    var portalCooldown = 0;
    var animPhase = 0;
    var lastFrame = 0;

    var SPLIT_PALETTES = [
      { color: "#38bdf8", headColor: "#bae6fd", bellyColor: "#0369a1" },
      { color: "#a855f7", headColor: "#e9d5ff", bellyColor: "#6b21a8" },
      { color: "#facc15", headColor: "#fef08a", bellyColor: "#a16207" }
    ];

    function cloneBody(body) {
      var out = [];
      for (var i = 0; i < body.length; i++) {
        out.push({ x: body[i].x, y: body[i].y });
      }
      return out;
    }

    function wrapCoord(v, max) {
      return ((v % max) + max) % max;
    }

    function initBarriers() {
      barriers = [
        { x: 6, y: 6 }, { x: 7, y: 6 },
        { x: 9, y: 14 }, { x: 10, y: 14 }
      ];
    }

    function initBlackHoles() {
      blackHoles = [
        { x: 2, y: 17, angle: 0 },
        { x: 14, y: 3, angle: 1.5 }
      ];
    }

    function initSkulls() {
      skulls = [
        { x: 5, y: 4 },
        { x: 12, y: 16 }
      ];
    }

    function initPlayerSnake() {
      var b = [{ x: 5, y: 10 }, { x: 4, y: 10 }, { x: 3, y: 10 }, { x: 2, y: 10 }];
      playerSnake = {
        dir: { x: 1, y: 0 },
        nextDir: { x: 1, y: 0 },
        body: cloneBody(b),
        prevBody: cloneBody(b),
        color: "#22c55e",
        headColor: "#86efac",
        bellyColor: "#15803d"
      };
    }

    function initIntruders() {
      intruders = [
        {
          id: 1,
          dir: { x: 1, y: 0 },
          body: [{ x: 3, y: 2 }, { x: 2, y: 2 }, { x: 1, y: 2 }],
          prevBody: [{ x: 3, y: 2 }, { x: 2, y: 2 }, { x: 1, y: 2 }],
          color: "#ef4444",
          headColor: "#fca5a5",
          bellyColor: "#991b1b",
          cooldown: 7
        },
        {
          id: 2,
          dir: { x: -1, y: 0 },
          body: [{ x: COLS - 4, y: ROWS - 3 }, { x: COLS - 3, y: ROWS - 3 }, { x: COLS - 2, y: ROWS - 3 }],
          prevBody: [{ x: COLS - 4, y: ROWS - 3 }, { x: COLS - 3, y: ROWS - 3 }, { x: COLS - 2, y: ROWS - 3 }],
          color: "#f97316",
          headColor: "#fdba74",
          bellyColor: "#9a3412",
          cooldown: 11
        }
      ];
    }

    function isOccupied(x, y) {
      if (playerSnake) {
        for (var b = 0; b < playerSnake.body.length; b++) {
          if (playerSnake.body[b].x === x && playerSnake.body[b].y === y) return true;
        }
      }
      for (var sp = 0; sp < splitSnakes.length; sp++) {
        for (var sb = 0; sb < splitSnakes[sp].body.length; sb++) {
          if (splitSnakes[sp].body[sb].x === x && splitSnakes[sp].body[sb].y === y) return true;
        }
      }
      for (var j = 0; j < intruders.length; j++) {
        for (var ib = 0; ib < intruders[j].body.length; ib++) {
          if (intruders[j].body[ib].x === x && intruders[j].body[ib].y === y) return true;
        }
      }
      for (var k = 0; k < skulls.length; k++) {
        if (skulls[k].x === x && skulls[k].y === y) return true;
      }
      for (var w = 0; w < barriers.length; w++) {
        if (barriers[w].x === x && barriers[w].y === y) return true;
      }
      for (var p = 0; p < blackHoles.length; p++) {
        if (blackHoles[p].x === x && blackHoles[p].y === y) return true;
      }
      return false;
    }

    function placeFruit() {
      for (var tries = 0; tries < 120; tries++) {
        var fx = Math.floor(Math.random() * COLS);
        var fy = Math.floor(Math.random() * ROWS);
        if (!isOccupied(fx, fy)) {
          fruit = { x: fx, y: fy };
          return;
        }
      }
      fruit = { x: 8, y: 10 };
    }

    function addExtraHazard() {
      for (var tries = 0; tries < 70; tries++) {
        var sx = Math.floor(Math.random() * COLS);
        var sy = Math.floor(Math.random() * ROWS);
        if (!isOccupied(sx, sy) && !(sx === fruit.x && sy === fruit.y)) {
          if (skulls.length < 5) skulls.push({ x: sx, y: sy });
          else if (barriers.length < 8) barriers.push({ x: sx, y: sy });
          return;
        }
      }
    }

    function registerScore(pts) {
      score += pts;
      eatenInLevel++;
      uiScore.textContent = score + " pts";
      sfxEat();
      if (eatenInLevel === 2 || eatenInLevel === 4) {
        spawnIndependentSplitSnake();
      }
      if (eatenInLevel >= 5) {
        eatenInLevel = 0;
        level++;
        stepDuration = Math.max(95, 150 - (level - 1) * 8);
        uiLvl.textContent = "Nv " + level;
        bannerLvl.textContent = "NIVEL " + level + " COMPLETADO";
        bannerLvl.style.display = "block";
        bannerMs = 1600;
        addExtraHazard();
        sfxLevel();
      }
      placeFruit();
    }

    function gameOver(reason) {
      mode = "over";
      sfxDie();
      mTitle.textContent = "FIN DEL JUEGO";
      mDesc.innerHTML = reason + "<br />Puntaje: <b>" + score + " pts</b>";
      mBtn.textContent = "REINTENTAR";
      modal.style.display = "block";
    }

    function startMatch() {
      getActx();
      score = 0;
      level = 1;
      eatenInLevel = 0;
      bannerMs = 0;
      stepAccumulator = 0;
      fireAccumulator = 0;
      portalCooldown = 0;
      stepDuration = 150;
      splitSnakes = [];
      fireballs = [];
      bannerLvl.style.display = "none";
      uiScore.textContent = "0 pts";
      uiLvl.textContent = "Nv 1";
      btnPause.textContent = "Pausa";
      initBarriers();
      initBlackHoles();
      initSkulls();
      initPlayerSnake();
      initIntruders();
      placeFruit();
      modal.style.display = "none";
      mode = "play";
      sfxSplit();
    }

    function togglePause() {
      if (mode === "play") {
        mode = "pause";
        mTitle.textContent = "PAUSA";
        mDesc.textContent = "Juego pausado.";
        mBtn.textContent = "CONTINUAR";
        modal.style.display = "block";
        btnPause.textContent = "Seguir";
      } else if (mode === "pause") {
        mode = "play";
        modal.style.display = "none";
        btnPause.textContent = "Pausa";
      }
    }

    function spawnIndependentSplitSnake() {
      if (!playerSnake || playerSnake.body.length < 3 || splitSnakes.length >= 3) return;
      var tail = playerSnake.body.pop();
      var pal = SPLIT_PALETTES[splitSnakes.length % SPLIT_PALETTES.length];
      var dirs = [
        { x: 1, y: 0 },
        { x: -1, y: 0 },
        { x: 0, y: 1 },
        { x: 0, y: -1 }
      ];
      var startDir = dirs[(splitSnakes.length + 1) % dirs.length];
      var b = [
        { x: tail.x, y: tail.y },
        { x: wrapCoord(tail.x - startDir.x, COLS), y: wrapCoord(tail.y - startDir.y, ROWS) }
      ];
      splitSnakes.push({
        dir: startDir,
        body: cloneBody(b),
        prevBody: cloneBody(b),
        color: pal.color,
        headColor: pal.headColor,
        bellyColor: pal.bellyColor
      });
      sfxSplit();
    }

    function checkBlackHoleTeleport(nx, ny) {
      if (portalCooldown > 0 || blackHoles.length < 2) return null;
      if (nx === blackHoles[0].x && ny === blackHoles[0].y) {
        portalCooldown = 5;
        sfxPortal();
        return { x: blackHoles[1].x, y: blackHoles[1].y };
      }
      if (nx === blackHoles[1].x && ny === blackHoles[1].y) {
        portalCooldown = 5;
        sfxPortal();
        return { x: blackHoles[0].x, y: blackHoles[0].y };
      }
      return null;
    }

    function isDeadlyCellForPlayer(nx, ny) {
      for (var w = 0; w < barriers.length; w++) {
        if (barriers[w].x === nx && barriers[w].y === ny) return "Chocaste contra una barrera.";
      }
      for (var b = 0; b < playerSnake.body.length; b++) {
        if (playerSnake.body[b].x === nx && playerSnake.body[b].y === ny) return "Chocaste con tu propia cola.";
      }
      for (var k = 0; k < skulls.length; k++) {
        if (skulls[k].x === nx && skulls[k].y === ny) return "Chocaste contra una calavera.";
      }
      for (var j = 0; j < intruders.length; j++) {
        for (var ib = 0; ib < intruders[j].body.length; ib++) {
          if (intruders[j].body[ib].x === nx && intruders[j].body[ib].y === ny) return "Chocaste con una serpiente intrusa.";
        }
      }
      return null;
    }

    function stepPlayerSnake() {
      if (!playerSnake
