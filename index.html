<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Snake Split Adventure</title>
    <style>
        body { margin: 0; padding: 0; background-color: #0d0f17; color: #fff; font-family: sans-serif; overflow: hidden; display: flex; justify-content: center; align-items: center; height: 100vh; }
        #game-container { width: 100vw; height: 100vh; display: flex; justify-content: center; align-items: center; }
        canvas { border: 2px solid #00f0ff; box-shadow: 0 0 20px rgba(0, 240, 255, 0.4); max-width: 100%; max-height: 100%; }
    </style>
</head>
<body>
    <div id="game-container"></div>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
    <script>
        const config = {
            type: Phaser.AUTO,
            width: 800,
            height: 600,
            parent: 'game-container',
            scene: { preload: preload, create: create, update: update }
        };

        let snakeSegments = [];
        let food;
        let direction = 'RIGHT';
        let moveTime = 0;
        const gridSize = 25;
        let sceneRef;

        const game = new Phaser.Game(config);

        function preload() {}

        function create() {
            sceneRef = this;
            this.add.text(400, 35, 'SNAKE SPLIT ADVENTURE', { fontSize: '26px', fill: '#00f0ff', fontStyle: 'bold' }).setOrigin(0.5);

            snakeSegments = [];
            // Crear la serpiente con círculos suaves
            for (let i = 0; i < 5; i++) {
                let color = (i === 0) ? 0x00ffcc : 0x00bfff;
                let circle = this.add.circle(300 - (i * gridSize), 300, gridSize / 2 - 2, color);
                snakeSegments.push({ obj: circle, x: 300 - (i * gridSize), y: 300 });
            }

            // Comida redonda y brillante
            food = this.add.circle(500, 300, gridSize / 2 - 2, 0xff00ff);

            // Controles táctiles
            this.input.on('pointerdown', (pointer) => {
                if (pointer.x < 400) {
                    if (direction === 'RIGHT') direction = 'UP';
                    else if (direction === 'UP') direction = 'LEFT';
                    else if (direction === 'LEFT') direction = 'DOWN';
                    else if (direction === 'DOWN') direction = 'RIGHT';
                } else {
                    if (direction === 'RIGHT') direction = 'DOWN';
                    else if (direction === 'DOWN') direction = 'LEFT';
                    else if (direction === 'LEFT') direction = 'UP';
                    else if (direction === 'UP') direction = 'RIGHT';
                }
            });
        }

        function update(time) {
            if (time < moveTime) return;
            moveTime = time + 160;

            let headX = snakeSegments[0].x;
            let headY = snakeSegments[0].y;

            if (direction === 'RIGHT') headX += gridSize;
            else if (direction === 'LEFT') headX -= gridSize;
            else if (direction === 'UP') headY -= gridSize;
            else if (direction === 'DOWN') headY += gridSize;

            if (headX >= 800) headX = 0;
            if (headX < 0) headX = 775;
            if (headY >= 600) headY = 90;
            if (headY < 90) headY = 575;

            let ateFood = (Math.abs(headX - food.x) < 5 && Math.abs(headY - food.y) < 5);
            let tail = snakeSegments[snakeSegments.length - 1];

            for (let i = snakeSegments.length - 1; i > 0; i--) {
                snakeSegments[i].x = snakeSegments[i - 1].x;
                snakeSegments[i].y = snakeSegments[i - 1].y;
                snakeSegments[i].obj.setPosition(snakeSegments[i].x, snakeSegments[i].y);
            }

            snakeSegments[0].x = headX;
            snakeSegments[0].y = headY;
            snakeSegments[0].obj.setPosition(headX, headY);

            if (ateFood) {
                let newCircle = sceneRef.add.circle(tail.x, tail.y, gridSize / 2 - 2, 0x00bfff);
                snakeSegments.push({ obj: newCircle, x: tail.x, y: tail.y });

                let rx = Math.floor(Math.random() * 28) * gridSize + 20;
                let ry = Math.floor(Math.random() * 16 + 4) * gridSize;
                food.setPosition(rx, ry);
            }
        }
    </script>
</body>
</html>
