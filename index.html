<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Snake Split Arena - Pro Game</title>
    <style>
        * { box-sizing: border-box; touch-action: none; -webkit-tap-highlight-color: transparent; }
        body, html { 
            margin: 0; padding: 0; 
            background-color: #050508; color: #fff; 
            font-family: Arial, sans-serif; 
            overflow: hidden; width: 100vw; height: 100vh; 
        }
        #ui-header {
            position: fixed; top: 0; left: 0;
            width: 100%; height: 50px; display: flex; flex-direction: column; 
            justify-content: center; align-items: center; background: #0a0a12;
            border-bottom: 2px solid #ff0055; z-index: 10;
        }
        #title { font-size: 14px; font-weight: bold; color: #ff0055; margin: 0; }
        #scores { font-size: 12px; font-weight: bold; margin-top: 2px; display: flex; gap: 15px; }
        #score-val { color: #00ffcc; }
        #target-val { color: #ff00ff; }
        #high-val { color: #ffcc00; }

        /* CANCHA GRANDE Y CENTRADA */
        #gameCanvas { 
            position: fixed;
            left: 50%;
            top: 60px;
            transform: translateX(-50%);
            border: 3px solid #ff0055; 
            box-shadow: 0 0 18px rgba(255, 0, 85, 0.5); 
            border-radius: 8px;
            background: #000005;
            z-index: 5;
        }

        /* VENTANA DE VICTORIA */
        #victory-modal {
            display: none;
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(5, 5, 8, 0.85); backdrop-filter: blur(5px);
            z-index: 100; flex-direction: column; justify-content: center; align-items: center;
        }
        #victory-card {
            background: #0a0a12; border: 2px solid #00ffcc; border-radius: 12px;
            padding: 25px; text-align: center; box-shadow: 0 0 25px rgba(0, 255, 204, 0.4);
            max-width: 85%;
        }
        #victory-card h2 { color: #00ffcc; margin: 0 0 10px 0; font-size: 22px; }
        #victory-card p { color: #fff; margin: 0 0 20px 0; font-size: 15px; }
        #next-btn {
            background: #ff0055; color: #fff; border: none; padding: 12px 24px;
            font-size: 16px; font-weight: bold; border-radius: 8px;
            box-shadow: 0 0 10px rgba(255, 0, 85, 0.5); cursor: pointer;
        }
        #next-btn:active { background: #e0004c; }

        /* CONTROL D-PAD LEVANTADO DE LA BARRA INFERIOR */
        #dpad-container {
            position: fixed;
            bottom: 85px;
            left: 50%;
            transform: translateX(-50%);
            width: 160px; height: 160px; 
            display: grid; 
            grid-template-columns: repeat(3, 1fr); 
            grid-template-rows: repeat(3, 1fr);
            z-index: 20;
        }
        .d-btn {
            background: rgba(0, 240, 255, 0.3); border: 2px solid #00f0ff; border-radius: 12px;
            display: flex; justify-content: center; align-items: center; color: #00f0ff; font-size: 26px;
            user-select: none;
        }
        .d-btn:active { background: rgba(0, 240, 255, 0.7); }
        #btn-up { grid-column: 2; grid-row: 1; }
        #btn-left { grid-column: 1; grid-row: 2; }
        #btn-right { grid-column: 3; grid-row: 2; }
        #btn-down { grid-column: 2; grid-row: 3; }
    </style>
</head>
<body>
    <div id="ui-header">
        <div id="title">SNAKE SPLIT: BATTLE ARENA - ÁREA 1</div>
        <div id="scores">
            <span id="score-val">PUNTOS: 0</span>
            <span id="target-val">META: 300</span>
            <span id="high-val">RÉCORD: 0</span>
        </div>
    </div>

    <canvas id="gameCanvas"></canvas>

    <div id="victory-modal">
        <div id="victory-card">
            <h2>¡ÁREA 1 COMPLETADA!</h2>
            <p>¡Llegaste a los 300 puntos con éxito!</p>
            <button id="next-btn">SIGUIENTE ÁREA</button>
        </div>
    </div>

    <div id="dpad-container">
        <div id="btn-up" class="d-btn">&#9650;</div>
        <div id="btn-left" class="d-btn">&#9668;</div>
        <div id="btn-right" class="d-btn">&#9658;</div>
        <div id="btn-down" class="d-btn">&#9660;</div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        const GRID_SIZE = 20;
        const TARGET_SCORE = 300;
        let COLS = 16;
        let ROWS = 20;
        
        let snake = [];

        let currentLevel = 1;
        let isLevelComplete = false;

            const availW = window.innerWidth * 0.94;
            const availH = window.innerHeight - 60 - 240; // Espacio optimizado

            COLS = Math.floor(availW / GRID_SIZE);
            ROWS = Math.floor(availH / GRID_SIZE);

            if (COLS < 12) COLS = 12;
            if (ROWS < 14) ROWS = 14;

            canvas.width = COLS * GRID_SIZE;
            canvas.height = ROWS * GRID_SIZE;
        }

            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }

                    osc.frequency.setValueAtTime(600, audioCtx.currentTime);

                    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);

                    osc.start(); osc.stop(audioCtx.currentTime + 0.2);
