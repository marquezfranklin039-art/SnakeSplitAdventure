<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Snake Split</title>
<style>
* { box-sizing: border-box; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
body {
  margin: 0;
  min-height: 100vh;
  padding: 12px;
  background: #eef2f6;
  color: #0f172a;
  font-family: system-ui, -apple-system, sans-serif;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  touch-action: manipulation;
}
body.dark { background: #0e1116; color: #f8fafc; }
.bar {
  width: 100%;
  max-width: 360px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 6px;
  margin-bottom: 8px;
  font-size: 13px;
  font-weight: 700;
}
.bar-right { display: flex; gap: 6px; align-items: center; }
.pill {
  background: #ffffff;
  color: #0f172a;
  border: 1px solid #cbd5e1;
  border-radius: 999px;
  padding: 6px 10px;
}
body.dark .pill { background: #1b222c; color: #f8fafc; border-color: #2e3948; }
#box {
  position: relative;
  width: 100%;
  max-width: 360px;
  aspect-ratio: 300 / 340;
  border-radius: 16px;
  overflow: hidden;
  border: 2px solid #94a3b8;
  background: radial-gradient(circle at 50% 35%, #ffffff 0%, #e2e8f0 100%);
}
body.dark #box {
  background: radial-gradient(circle at 50% 35%, #19222f 0%, #10151d 100%);
  border-color: #334155;
}
canvas { width: 100%; height: 100%; display: block; }
.layer {
  position: absolute;
  inset: 0;
  background: rgba(241, 245, 249, 0.96);
  display: none;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 10px;
  padding: 16px;
  text-align: center;
  z-index: 10;
}
body.dark .layer { background: rgba(14, 17, 22, 0.96); }
.layer.on { display: flex; }
.pads {
  width: 100%;
  max-width: 360px;
  margin-top: 10px;
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
}
button {
  border: 1px solid #cbd5e1;
  background: #ffffff;
  color: #0f172a;
  border-radius: 10px;
  padding: 10px;
  font-weight: 700;
  font-size: 13px;
  cursor: pointer;
  touch-action: manipulation;
}
body.dark button { background: #1b222c; color: #f8fafc; border-color: #2e3948; }
.main { background: #0284c7; color: #ffffff; border-color: #0369a1; }
#dbg {
  display: none;
  width: 100%;
  max-width: 360px;
  margin-top: 8px;
  padding: 6px 10px;
  border-radius: 8px;
  background: #fee2e2;
  color: #991b1b;
  font-size: 11px;
  font-weight: 700;
  text-align: center;
}
</style>
</head>
<body>
  <div class="bar">
    <span class="pill" id="t-lvl">Nivel 1</span>
    <span class="pill" id="t-pts">Puntos: 0 / 300</span>
    <div class="bar-right">
      <button type="button" id="b-pause" onclick="togglePause()">Pausa</button>
      <button type="button" onclick="openCfg()">Ajustes</button>
    </div>
  </div>

  <div id="box">
    <canvas id="c" width="300" height="340"></canvas>

    <div class="layer on" id="m-start">
      <div style="font-size:11px;font-weight:800;color:#0284c7;">EDICIÓN ARCADE</div>
      <h2 style="margin:0;">SNAKE SPLIT</h2>
      <div class="pill" id="t-rec">Récord: 0 pts · Nivel 1</div>
      <div style="display:flex;gap:8px;">
        <button type="button" class="main" id="b-play" onclick="iniciarAhora()">Jugar</button>
        <button type="button" id="b-cfg" onclick="openCfg()">Ajustes</button>
      </div>
    </div>

    <div class="layer" id="m-pause">
      <div style="font-size:11px;font-weight:800;color:#0284c7;">EN PAUSA</div>
      <h2 style="margin:0;">Juego pausado</h2>
      <p style="margin:0;font-size:13px;">Toca continuar para seguir jugando.</p>
      <button type="button" class="main" id="b-resume" onclick="togglePause()">Continuar</button>
    </div>

    <div class="layer" id="m-cfg">
      <h3 style="margin:0;">Configuración</h3>
      <div style="display:flex;gap:6px;flex-wrap:wrap;justify-content:center;">
        <button type="button" id="o-diff" onclick="cycleDiff()">Dificultad: Estándar</button>
        <button type="button" id="o-theme" onclick="cycleTheme()">Pantalla: Clara</button>
