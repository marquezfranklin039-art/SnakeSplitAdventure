<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Snake Split</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      margin: 0;
      min-height: 100vh;
      padding: 12px;
      background: #eef2f6;
      color: #0f172a;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      touch-action: manipulation;
    }
    body.dark {
      background: #0e1116;
      color: #f8fafc;
    }
    .bar {
      width: 100%;
      max-width: 360px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 6px;
      margin-bottom: 8px;
      font-size: 13px;
      font-weight: 700;
    }
    .bar-right {
      display: flex;
      gap: 6px;
      align-items: center;
    }
    .pill {
      background: #ffffff;
      color: #0f172a;
      border: 1px solid #cbd5e1;
      border-radius: 999px;
      padding: 6px 10px;
    }
    body.dark .pill {
      background: #1b222c;
      color: #f8fafc;
      border-color: #2e3948;
    }
    #box {
      position: relative;
      width: 100%;
      max-width: 360px;
      aspect-ratio: 300 / 340;
      border-radius: 16px;
      overflow: hidden;
      border: 2px solid #94a3b8;
      background: radial-gradient(circle at 50% 35%, #ffffff 0%, #e2e8f0 100%);
    }
    body.dark #box {
      background: radial-gradient(circle at 50% 35%, #19222f 0%, #10151d 100%);
      border-color: #334155;
    }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }
    .layer {
      position: absolute;
      inset: 0;
      background: rgba(241, 245, 249, 0.96);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 16px;
      text-align: center;
      z-index: 5;
    }
    body.dark .layer {
      background: rgba(14, 17, 22, 0.96);
    }
    .layer.on {
      display: flex;
    }
    .pads {
      width: 100%;
      max-width: 360px;
      margin-top: 10px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }
    button {
      border: 1px solid #cbd5e1;
      background: #ffffff;
      color: #0f172a;
      border-radius: 10px;
      padding: 10px;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
      touch-action: manipulation;
    }
    body.dark button {
      background: #1b222c;
      color: #f8fafc;
      border-color: #2e3948;
    }
    .main {
      background: #0284c7;
      color: #ffffff;
      border-color: #0369a1;
    }
  </style>
</head>
<body>
  <div class="bar">
    <span class="pill" id="t-lvl">Nivel 1</span>
    <span class="pill" id="t-pts">Puntos: 0 / 300</span>
    <div class="bar-right">
      <button type="button" id="b-pause" onclick="togglePause()">Pausa</button>
      <button type="button" id="b-cfg-top" onclick="openCfg()">Ajustes</button>
    </div>
  </div>

  <div id="box">
    <canvas id="c" width="300" height="340"></canvas>

    <div class="layer on" id="m-start">
      <div style="font-size:11px;font-weight:800;color:#0284c7;">EDICION ARCADE</div>
      <h2 style="margin:0;">SNAKE SPLIT</h2>
      <div class="pill" id="t-rec">Record: 0 pts · Nivel 1</div>
      <div style="display:flex;gap:8px;">
        <button type="button" class="main" id="b-play" onclick="startGame()">Jugar</button>
        <button type="button" id="b-cfg" onclick="openCfg()">Ajustes</button>
      </div>
    </div>

    <div class="layer" id="m-pause">
      <div style="font-size:11px;font-weight:800;color:#0284c7;">EN PAUSA</div>
      <h2 style="margin:0;">Juego pausado</h2>
      <p style="margin:0;font-size:13px;">Toca continuar para seguir jugando.</p>
      <button type="button" class="main" id="b-resume" onclick="togglePause()">Continuar</button>
    </div>

    <div class="layer" id="m-cfg">
      <h3 style="margin:0;">Configuracion</h3>
      <div style="display:flex;gap:6px;flex-wrap:wrap;justify-content:center;">
        <button type="button" id="o-diff" onclick="cycleDiff()">Dificultad: Estandar</button>
        <button type="button" id="o-theme" onclick="cycleTheme()">Pantalla: Clara</button>
        <button type="button" id="o-snd" onclick="cycleSound()">Sonido: Si</button>
      </div>
      <button type="button" class="main" id="b-done" onclick="closeCfg()">Listo</button>
    </div>

    <div class="layer" id="m-lvl">
      <div style="font-size:11px;font-weight:800;color:#16a34a;">OBJETIVO CUMPLIDO</div>
      <h2 style="margin:0;" id="t-lvl-done">Terminaste el nivel!</h2>
      <p style="margin:0;font-size:13px;" id="t-lvl-sub">Listo para comenzar el otro nivel.</p>
      <button type="button" class="main" id="b-next-lvl" onclick="nextLevel()">Comenzar el otro nivel</button>
    </div>
  </div>

  <div class="pads">
    <button type="button" id="b-left">Izq</button>
    <button type="button" class="main" id="b-split" onclick="splitSnakes()">Dividir</button>
    <button type="button" id="b-right">Der</button>
  </div>

  <script>
    const c = document.getElementById("c");
    const ctx = c.getContext("2d");
    const W = 300;
    const H = 340;

    const mStart = document.getElementById("m-start");
    const mPause = document.getElementById("m-pause");
    const mCfg = document.getElementById("m-cfg");
    const mLvl = document.getElementById("m-lvl");
    const tLvl = document.getElementById("t-lvl");
    const tPts = document.getElementById("t-pts");
    const tRec = document.getElementById("t-rec");
    const tLvlDone = document.getElementById("t-lvl-done");
    const tLvlSub = document.getElementById("t-lvl-sub");
    const bPause = document.getElementById("b-pause");

    const diffs = [
      { label: "Tranquila", spd: 52, skulls: 1, move: 24 },
      { label: "Estandar", spd: 68, skulls: 2, move: 36 },
      { label: "Extrema", spd: 84, skulls: 3, move: 52 }
    ];

    let dIdx = 1;
    let snd = true;
    let best = 0;
    let bestLvl = 1;

    try {
      best = Number(localStorage.getItem("ss_rec") || 0) || 0;
      bestLvl = Number(localStorage.getItem("ss_lvl") || 1) || 1;
    } catch (_) {}

    let state = "menu";
    let lvl = 1;
    let pts = 0;
    let tot = 0;
    let snakes = [];
    let walls = [];
    let skulls = [];
    let foods = [];
    let turn = 0;
    let prevT = 0;
    let audio = null;

    function showRec() {
      tRec.textContent = "Record: " + best + " pts · Nivel " + bestLvl;
    }

    function saveRec() {
      if (tot > best) best = tot;
      if (lvl > bestLvl) bestLvl = lvl;
      try {
        localStorage.setItem("ss_rec", String(best));
        localStorage.setItem("ss_lvl", String(bestLvl));
      } catch (_) {}
      showRec();
    }

    function ensureAudio() {
      if (!snd) return null;
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return null;
        if (!audio) audio = new AudioCtx();
        if (audio.state === "suspended") audio.resume();
        return audio;
      } catch (_) {
        return null;
      }
    }

    function tone(ctxAud, startTime, freq, dur, wave, vol, endFreq) {
      const osc = ctxAud.createOscillator();
      const gain = ctxAud.createGain();
      osc.type = wave || "triangle";
      osc.frequency.setValueAtTime(freq, startTime);
      if (endFreq) osc.frequency.exponentialRampToValueAtTime(endFreq, startTime + dur);
      gain.gain.setValueAtTime(0.001, startTime);
      gain.gain.linearRampToValueAtTime(vol || 0.14, startTime + 0.012);
      gain.gain.exponentialRampToValueAtTime(0.001, startTime + dur);
      osc.connect(gain);
      gain.connect(ctxAud.destination);
      osc.start(startTime);
      osc.stop(startTime + dur + 0.02);
    }

    function playSound(kind) {
      if (!snd) return;
      const ctxAud = ensureAudio();
      if (!ctxAud) return;
      try {
        const t = ctxAud.currentTime;
        if (kind === "eat") {
          tone(ctxAud, t, 523.25, 0.07, "triangle", 0.14, 659.25);
          tone(ctxAud, t + 0.055, 783.99, 0.08, "sine", 0.13, 1046.5);
        } else if (kind === "star") {
          tone(ctxAud, t, 587.33, 0.07, "triangle", 0.15, 783.99);
          tone(ctxAud, t + 0.055, 880, 0.07, "triangle", 0.15, 1046.5);
          tone(ctxAud, t + 0.11, 1174.66, 0.11, "sine", 0.14, 1567.98);
        } else if (kind === "split") {
          tone(ctxAud, t, 330, 0.08, "triangle", 0.14, 554.37);
          tone(ctxAud, t + 0.06, 440, 0.1, "sine", 0.13, 659.25);
        } else if (kind === "start") {
          tone(ctxAud, t, 392, 0.08, "triangle", 0.14, 523.25);
          tone(ctxAud, t + 0.07, 523.25, 0.11, "triangle", 0.14, 783.99);
        } else if (kind === "level") {
          tone(ctxAud, t, 523.25, 0.09, "triangle", 0.15, 523.25);
          tone(ctxAud, t + 0.08, 659.25, 0.09, "triangle", 0.15, 659.25);
          tone(ctxAud, t + 0.16, 783.99, 0.1, "triangle", 0.15, 783.99);
          tone(ctxAud, t + 0.25, 1046.5, 0.18, "sine", 0.16, 1318.5);
        } else if (kind === "hit") {
          tone(ctxAud, t, 220, 0.14, "sawtooth", 0.15, 98);
          tone(ctxAud, t + 0.1, 130.81, 0.2, "triangle", 0.15, 65.41);
        } else if (kind === "click") {
          tone(ctxAud, t, 660, 0.05, "sine", 0.1, 784);
        }
      } catch (_) {}
    }

    function makeSnake(x, y, ang, len, hue, isPlayer) {
      const segs = [];
      for (let i = 0; i < len; i++) {
        segs.push({
          x: x - Math.cos(ang) * i * 4.5,
          y: y - Math.sin(ang) * i * 4.5
        });
      }
      return { segs: segs, ang: ang, hue: hue, player: isPlayer, r: 6.8 };
    }

    function hitWall(x, y, r) {
      for (let i = 0; i < walls.length; i++) {
        const w = walls[i];
        const nx = Math.max(w.x, Math.min(x, w.x + w.w));
        const ny = Math.max(w.y, Math.min(y, w.y + w.h));
        const dx = x - nx;
        const dy = y - ny;
        if (dx * dx + dy * dy < r * r) return true;
      }
      return false;
    }

    function safeSpot(x, y, sweep) {
      const sp = sweep || 0;
      if (Math.hypot(x - W / 2, y - H * 0.8) < 55) return false;
      for (let s = -1; s <= 1; s++) {
        if (hitWall(x, y + s * sp, 14)) return false;
      }
      for (let i = 0; i < skulls.length; i++) {
        if (Math.hypot(x - skulls[i].x, y - skulls[i].y) < 32) return false;
      }
      return true;
    }

    function addFood() {
      const roll = Math.random();
      const kind = roll < 0.6 ? "berry" : (roll < 0.88 ? "citrus" : "star");
      let x = W / 2;
      let y = H * 0.42;
      for (let i = 0; i < 45; i++) {
        const tx = 26 + Math.random() * (W - 52);
        const ty = 26 + Math.random() * (H - 52);
        if (safeSpot(tx, ty, 0)) {
          x = tx;
          y = ty;
          break;
        }
      }
      const val = kind === "star" ? 40 : (kind === "citrus" ? 20 : 10);
      const grow = kind === "star" ? 3 : 2;
      const rad = kind === "star" ? 6.8 : 5.8;
      foods.push({ x: x, y: y, kind: kind, val: val, grow: grow, rad: rad });
    }

    function initLvl(n, resetTot) {
      lvl = n;
      pts = 0;
      if (resetTot) tot = 0;
      turn = 0;
      mLvl.classList.remove("on");
      mPause.classList.remove("on");
      bPause.textContent = "Pausa";
      snakes = [makeSnake(W / 2, H * 0.8, -Math.PI / 2, 12, 152, true)];
      walls = lvl > 1 ? [
        { x: 38, y: 120, w: 68, h: 12 },
        { x: W - 106, y: 205, w: 68, h: 12 }
      ] : [];
      skulls = [];

      const cnt = Math.min(5, diffs[dIdx].skulls + Math.floor((lvl - 1) / 2));
      const mov = lvl >= 4;
      const sweep = mov ? 36 : 0;
      let tries = 0;

      while (skulls.length < cnt && tries < 140) {
        tries++;
        const sx = 34 + Math.random() * (W - 68);
        const sy = 44 + sweep + Math.random() * Math.max(20, H - 88 - sweep * 2);
        if (safeSpot(sx, sy, sweep)) {
          skulls.push({
            x: sx,
            y: sy,
            minY: Math.max(24, sy - sweep),
            maxY: Math.min(H - 24, sy + sweep),
            dir: Math.random() < 0.5 ? -1 : 1,
            mov: mov,
            r: 8.5
          });
        }
      }

      foods = [];
      for (let i = 0; i < 5; i++) addFood();

      saveRec();
      tLvl.textContent = "Nivel " + lvl;
      tPts.textContent = "Puntos: " + pts + " / 300";
    }

    function startGame() {
      ensureAudio();
      mStart.classList.remove("on");
      mCfg.classList.remove("on");
      mLvl.classList.remove("on");
      mPause.classList.remove("on");
      bPause.textContent = "Pausa";
      state = "play";
      initLvl(1, true);
      playSound("start");
    }

    function togglePause() {
      ensureAudio();
      if (state === "play") {
        state = "paused";
        turn = 0;
        mPause.classList.add("on");
        bPause.textContent = "Seguir";
        playSound("click");
      } else if (state === "paused") {
        mPause.classList.remove("on");
        bPause.textContent = "Pausa";
        state = "play";
        playSound("click");
      }
    }

    function openLevelClear() {
      state = "levelclear";
      saveRec();
      tLvlDone.textContent = "Terminaste el nivel " + lvl + "!";
      tLvlSub.textContent = "Listo para comenzar el otro nivel (Nivel " + (lvl + 1) + ").";
      mLvl.classList.add("on");
      playSound("level");
    }

    function nextLevel() {
      ensureAudio();
      mLvl.classList.remove("on");
      state = "play";
      initLvl(lvl + 1, false);
      playSound("start");
    }

    function openCfg() {
      ensureAudio();
      mStart.classList.remove("on");
      mLvl.classList.remove("on");
      mPause.classList.remove("on");
      bPause.textContent = "Pausa";
      mCfg.classList.add("on");
      state = "cfg";
      playSound("click");
    }

    function closeCfg() {
      mCfg.classList.remove("on");
      if (tot === 0 && pts === 0) {
        mStart.classList.add("on");
        state = "menu";
      } else {
        state = "play";
      }
    }

    function cycleDiff() {
      dIdx = (dIdx + 1) % diffs.length;
      document.getElementById("o-diff").textContent = "Dificultad: " + diffs[dIdx].label;
      initLvl(lvl, false);
    }

    function cycleTheme() {
      const dark = document.body.classList.toggle("dark");
      document.getElementById("o-theme").textContent = "Pantalla: " + (dark ? "Oscura" : "Clara");
    }

    function cycleSound() {
      snd = !snd;
      document.getElementById("o-snd").textContent = "Sonido: " + (snd ? "Si" : "No");
      if (snd) playSound("click");
    }

    function normalizeAngle(a) {
      while (a > Math.PI) a -= Math.PI * 2;
      while (a < -Math.PI) a += Math.PI * 2;
      return a;
    }

    function isAngleSafe(x, y, ang, r, lookDist) {
      for (let stepD = 10; stepD <= lookDist; stepD += 8) {
        const px = x + Math.cos(ang) * stepD;
        const py = y + Math.sin(ang) * stepD;
        if (px < r + 14 || px > W - r - 14 || py < r + 14 || py > H - r - 14) {
          return false;
        }
        if (hitWall(px, py, r + 7)) return false;
        for (let i = 0; i < skulls.length; i++) {
          const sk = skulls[i];
          if (Math.hypot(px - sk.x, py - sk.y) < sk.r + r + 13) return false;
        }
      }
      return true;
    }

    function pickLaunchAngle(x, y, preferredAng, r) {
      const candidates = [
        preferredAng,
        Math.atan2(H * 0.5 - y, W * 0.5 - x),
        0,
        Math.PI,
        -Math.PI * 0.5,
        Math.PI * 0.5,
        0.5,
        -0.5,
        2.6,
        -2.6
      ];
      for (let i = 0; i < candidates.length; i++) {
        const a = normalizeAngle(candidates[i]);
        if (isAngleSafe(x, y, a, r, 42)) return a;
      }
      return normalizeAngle(preferredAng);
    }

    function splitSnakes() {
      ensureAudio();
      if (state === "over") {
        startGame();
        return;
      }
      if (state === "levelclear") {
        nextLevel();
        return;
      }
      if (state !== "play") return;
      const next = [];
      let splitOk = false;
      for (let i = 0; i < snakes.length; i++) {
        const s = snakes[i];
        if (s.segs.length >= 8 && next.length + snakes.length <= 4) {
          const half = Math.floor(s.segs.length / 2);
          const part = s.segs.splice(half);
          next.push(s);
          const headX = part[0].x;
          const headY = part[0].y;
          const childAng = pickLaunchAngle(headX, headY, s.ang + Math.PI * 0.5, s.r);
          next.push(makeSnake(headX, headY, childAng, part.length, (s.hue + 65) % 360, false));
          splitOk = true;
        } else {
          next.push(s);
        }
      }
      if (splitOk) {
        snakes = next;
        playSound("split");
      }
    }

    function getAiTurn(s) {
      const head = s.segs[0];
      let target = null;
      let bestScore = Infinity;
      for (let i = 0; i < foods.length; i++) {
        const f = foods[i];
        const d = Math.hypot(f.x - head.x, f.y - head.y);
        const weight = f.kind === "star" ? 0.65 : (f.kind === "citrus" ? 0.85 : 1);
        const score = d * weight;
        if (score < bestScore) {
          bestScore = score;
          target = f;
        }
      }

      let desired = target
        ? Math.atan2(target.y - head.y, target.x - head.x)
        : Math.atan2(H * 0.5 - head.y, W * 0.5 - head.x);

      if (!isAngleSafe(head.x, head.y, desired, s.r, 34)) {
        let found = false;
        for (let offset = 0.35; offset <= Math.PI; offset += 0.35) {
          const leftA = normalizeAngle(desired - offset);
          const rightA = normalizeAngle(desired + offset);
          if (isAngleSafe(head.x, head.y, leftA, s.r, 34)) {
            desired = leftA;
            found = true;
            break;
          }
          if (isAngleSafe(head.x, head.y, rightA, s.r, 34)) {
            desired = rightA;
            found = true;
            break;
          }
        }
        if (!found) {
          desired = Math.atan2(H * 0.5 - head.y, W * 0.5 - head.x);
        }
      }

      const diff = normalizeAngle(desired - s.ang);
      if (Math.abs(diff) < 0.06) return 0;
      return diff > 0 ? 1 : -1;
    }

    const bLeft = document.getElementById("b-left");
    const bRight = document.getElementById("b-right");
    bLeft.addEventListener("pointerdown", function () { ensureAudio(); turn = -1; });
    bLeft.addEventListener("pointerup", function () { turn = 0; });
    bLeft.addEventListener("pointerleave", function () { turn = 0; });
    bLeft.addEventListener("pointercancel", function () { turn = 0; });

    bRight.addEventListener("pointerdown", function () { ensureAudio(); turn = 1; });
    bRight.addEventListener("pointerup", function () { turn = 0; });
    bRight.addEventListener("pointerleave", function () { turn = 0; });
    bRight.addEventListener("pointercancel", function () { turn = 0; });

    c.addEventListener("click", function () {
      if (state === "over") startGame();
      else if (state === "levelclear") nextLevel();
    });

    function step(dt) {
      if (state !== "play") return;
      const cfg = diffs[dIdx];
      const spd = cfg.spd + (lvl - 1) * 4;

      for (let i = 0; i < skulls.length; i++) {
        const sk = skulls[i];
        if (sk.mov) {
          sk.y += sk.dir * cfg.move * dt;
          if (sk.y <= sk.minY) { sk.y = sk.minY; sk.dir = 1; }
          if (sk.y >= sk.maxY) { sk.y = sk.maxY; sk.dir = -1; }
        }
      }

      const alive = [];
      for (let i = 0; i < snakes.length; i++) {
        const s = snakes[i];
        const turnRate = s.player ? 3.1 : 4.2;
        const dir = s.player ? turn : getAiTurn(s);
        s.ang = normalizeAngle(s.ang + dir * turnRate * dt);
        const nx = s.segs[0].x + Math.cos(s.ang) * spd * dt;
        const ny = s.segs[0].y + Math.sin(s.ang) * spd * dt;

        const hitSk = skulls.some(function (sk) {
          return Math.hypot(nx - sk.x, ny - sk.y) < s.r + sk.r - 1;
        });

        if (nx < s.r || nx > W - s.r || ny < s.r || ny > H - s.r || hitWall(nx, ny, s.r) || hitSk) {
          if (s.player) {
            state = "over";
            saveRec();
            playSound("hit");
            return;
          }
          continue;
        }

        s.segs.unshift({ x: nx, y: ny });
        s.segs.pop();

        for (let fIdx = foods.length - 1; fIdx >= 0; fIdx--) {
          const f = foods[fIdx];
          if (Math.hypot(nx - f.x, ny - f.y) < s.r + f.rad + 2) {
            foods.splice(fIdx, 1);
            addFood();
            pts += f.val;
            tot += f.val;
            saveRec();
            playSound(f.kind === "star" ? "star" : "eat");
            const tail = s.segs[s.segs.length - 1];
            for (let g = 0; g < f.grow; g++) s.segs.push({ x: tail.x, y: tail.y });
            tPts.textContent = "Puntos: " + pts + " / 300";
            if (pts >= 300) {
              openLevelClear();
              return;
            }
          }
        }
        alive.push(s);
      }
      snakes = alive;
    }

    function drawSkull(sk) {
      ctx.save();
      ctx.translate(sk.x, sk.y);

      ctx.strokeStyle = "rgba(239, 68, 68, 0.45)";
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.arc(0, 0, sk.r + 2.5, 0, Math.PI * 2);
      ctx.stroke();

      ctx.fillStyle = "#ffffff";
      ctx.strokeStyle = "#0f172a";
      ctx.lineWidth = 1.6;
      ctx.beginPath();
      ctx.arc(0, -1, sk.r * 0.85, Math.PI * 0.85, Math.PI * 2.15);
      ctx.lineTo(sk.r * 0.45, sk.r * 0.85);
      ctx.lineTo(-sk.r * 0.45, sk.r * 0.85);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = "#0f172a";
      ctx.beginPath();
      ctx.arc(-3, -1.5, 1.8, 0, Math.PI * 2);
      ctx.arc(3, -1.5, 1.8, 0, Math.PI * 2);
      ctx.fill();

      ctx.beginPath();
      ctx.moveTo(-2.5, 3.2);
      ctx.lineTo(-2.5, 5.5);
      ctx.moveTo(0, 3.2);
      ctx.lineTo(0, 5.5);
      ctx.moveTo(2.5, 3.2);
      ctx.lineTo(2.5, 5.5);
      ctx.stroke();
      ctx.restore();
    }

    function drawFood(f) {
      ctx.save();
      ctx.translate(f.x, f.y);
      if (f.kind === "star") {
        ctx.fillStyle = "#f59e0b";
        ctx.strokeStyle = "#78350f";
        ctx.lineWidth = 1.2;
        ctx.beginPath();
        for (let i = 0; i < 10; i++) {
          const rad = i % 2 === 0 ? f.rad + 1.5 : f.rad * 0.48;
          const a = (i * Math.PI) / 5 - Math.PI / 2;
          if (i === 0) ctx.moveTo(Math.cos(a) * rad, Math.sin(a) * rad);
          else ctx.lineTo(Math.cos(a) * rad, Math.sin(a) * rad);
        }
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
      } else {
        ctx.fillStyle = f.kind === "citrus" ? "#fb923c" : "#ef4444";
        ctx.strokeStyle = "#0f172a";
        ctx.lineWidth = 1.2;
        ctx.beginPath();
        ctx.arc(0, 0, f.rad, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();

        ctx.fillStyle = "#16a34a";
        ctx.fillRect(-1.1, -f.rad - 2.8, 2.2, 3.2);
      }
      ctx.restore();
    }

    function drawSnake(s) {
      const segs = s.segs;
      if (!segs || segs.length === 0) return;

      for (let i = segs.length - 1; i >= 1; i--) {
        const p = segs[i];
        const ratio = i / segs.length;
        const rad = Math.max(2.3, s.r * (1.02 - ratio * 0.68));
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.fillStyle = "hsl(" + s.hue + ", 78%, " + (44 + ratio * 12) + "%)";
        ctx.strokeStyle = "hsl(" + s.hue + ", 85%, 22%)";
        ctx.lineWidth = 1.2;
        ctx.beginPath();
        ctx.arc(0, 0, rad, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();

        if (i % 2 === 1 && rad > 3.2) {
          ctx.fillStyle = "hsl(" + ((s.hue + 24) % 360) + ", 85%, 32%)";
          ctx.beginPath();
          ctx.arc(0, 0, rad * 0.45, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.restore();
      }

      const head = segs[0];
      ctx.save();
      ctx.translate(head.x, head.y);
      ctx.rotate(s.ang);

      const tongueOut = Math.sin(performance.now() * 0.012) > 0.15 ? 4.5 : 1.5;
      ctx.strokeStyle = "#ef4444";
      ctx.lineWidth = 1.4;
      ctx.beginPath();
      ctx.moveTo(s.r * 0.85, 0);
      ctx.lineTo(s.r * 0.85 + tongueOut, 0);
      ctx.lineTo(s.r * 0.85 + tongueOut + 2, -1.8);
      ctx.moveTo(s.r * 0.85 + tongueOut, 0);
      ctx.lineTo(s.r * 0.85 + tongueOut + 2, 1.8);
      ctx.stroke();

      ctx.fillStyle = "hsl(" + s.hue + ", 82%, 38%)";
      ctx.strokeStyle = "hsl(" + s.hue + ", 88%, 18%)";
      ctx.lineWidth = 1.4;
      ctx.beginPath();
      ctx.ellipse(0.5, 0, s.r * 1.18, s.r * 0.96, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = "#fef08a";
      ctx.beginPath();
      ctx.arc(s.r * 0.35, -s.r * 0.48, 2.2, 0, Math.PI * 2);
      ctx.arc(s.r * 0.35, s.r * 0.48, 2.2, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = "#0f172a";
      ctx.beginPath();
      ctx.arc(s.r * 0.45, -s.r * 0.48, 1.15, 0, Math.PI * 2);
      ctx.arc(s.r * 0.45, s.r * 0.48, 1.15, 0, Math.PI * 2);
      ctx.fill();

      ctx.restore();
    }

    function render() {
      ctx.clearRect(0, 0, W, H);
      const dark = document.body.classList.contains("dark");

      ctx.fillStyle = dark ? "#475569" : "#64748b";
      for (let i = 0; i < walls.length; i++) {
        const w = walls[i];
        ctx.fillRect(w.x, w.y, w.w, w.h);
      }

      for (let i = 0; i < foods.length; i++) drawFood(foods[i]);
      for (let i = 0; i < skulls.length; i++) drawSkull(skulls[i]);
      for (let i = 0; i < snakes.length; i++) drawSnake(snakes[i]);

      if (state === "over") {
        ctx.fillStyle = dark ? "rgba(14,17,22,0.85)" : "rgba(241,245,249,0.88)";
        ctx.fillRect(0, 0, W, H);
        ctx.fillStyle = dark ? "#f8fafc" : "#0f172a";
        ctx.font = "bold 19px system-ui, sans-serif";
        ctx.textAlign = "center";
        ctx.fillText("Chocaste!", W / 2, H / 2 - 10);
        ctx.font = "13px system-ui, sans-serif";
        ctx.fillText("Toca aqui o en Dividir para reiniciar", W / 2, H / 2 + 16);
      }
    }

    function loop(t) {
      try {
        const dt = Math.min((t - prevT) / 1000 || 0.016, 0.05);
        prevT = t;
        step(dt);
        render();
      } catch (_) {}
      requestAnimationFrame(loop);
    }

    showRec();
    initLvl(1, true);
    requestAnimationFrame(loop);
  </script>
</body>
</html>
