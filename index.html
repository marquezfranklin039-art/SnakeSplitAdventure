<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Snake Split</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      margin: 0;
      min-height: 100vh;
      padding: 12px;
      background: #eef2f6;
      color: #0f172a;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      touch-action: manipulation;
    }
    body.dark {
      background: #0e1116;
      color: #f8fafc;
    }
    .bar {
      width: 100%;
      max-width: 360px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 6px;
      margin-bottom: 8px;
      font-size: 13px;
      font-weight: 700;
    }
    .pill {
      background: #ffffff;
      color: #0f172a;
      border: 1px solid #cbd5e1;
      border-radius: 999px;
      padding: 6px 10px;
    }
    body.dark .pill {
      background: #1b222c;
      color: #f8fafc;
      border-color: #2e3948;
    }
    #box {
      position: relative;
      width: 100%;
      max-width: 360px;
      aspect-ratio: 300 / 340;
      border-radius: 16px;
      overflow: hidden;
      border: 2px solid #94a3b8;
      background: radial-gradient(circle at 50% 35%, #ffffff 0%, #e2e8f0 100%);
    }
    body.dark #box {
      background: radial-gradient(circle at 50% 35%, #19222f 0%, #10151d 100%);
      border-color: #334155;
    }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }
    .layer {
      position: absolute;
      inset: 0;
      background: rgba(241, 245, 249, 0.96);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 16px;
      text-align: center;
      z-index: 5;
    }
    body.dark .layer {
      background: rgba(14, 17, 22, 0.96);
    }
    .layer.on {
      display: flex;
    }
    .pads {
      width: 100%;
      max-width: 360px;
      margin-top: 10px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }
    button {
      border: 1px solid #cbd5e1;
      background: #ffffff;
      color: #0f172a;
      border-radius: 10px;
      padding: 10px;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
      touch-action: manipulation;
    }
    body.dark button {
      background: #1b222c;
      color: #f8fafc;
      border-color: #2e3948;
    }
    .main {
      background: #0284c7;
      color: #ffffff;
      border-color: #0369a1;
    }
  </style>
</head>
<body>
  <div class="bar">
    <span class="pill" id="t-lvl">Nivel 1</span>
    <span class="pill" id="t-pts">Puntos: 0 / 300</span>
    <button type="button" id="b-cfg-top">⚙️</button>
  </div>

  <div id="box">
    <canvas id="c" width="300" height="340"></canvas>

    <div class="layer on" id="m-start">
      <div style="font-size:11px;font-weight:800;color:#0284c7;">EDICIÓN ARCADE</div>
      <h2 style="margin:0;">SNAKE SPLIT</h2>
      <div class="pill" id="t-rec">Récord: 0 pts · Nivel 1</div>
      <div style="display:flex;gap:8px;">
        <button type="button" class="main" id="b-play">▶ Jugar</button>
        <button type="button" id="b-cfg">⚙️ Ajustes</button>
      </div>
    </div>

    <div class="layer" id="m-cfg">
      <h3 style="margin:0;">Configuración</h3>
      <div style="display:flex;gap:6px;flex-wrap:wrap;justify-content:center;">
        <button type="button" id="o-diff">Dificultad: Estándar</button>
        <button type="button" id="o-theme">Pantalla: Clara</button>
        <button type="button" id="o-snd">Sonido: Sí</button>
      </div>
      <button type="button" class="main" id="b-done">Listo</button>
    </div>

    <div class="layer" id="m-lvl">
      <div style="font-size:11px;font-weight:800;color:#16a34a;">OBJETIVO CUMPLIDO</div>
      <h2 style="margin:0;" id="t-lvl-done">¡Terminaste el nivel!</h2>
      <p style="margin:0;font-size:13px;" id="t-lvl-sub">Listo para comenzar el otro nivel.</p>
      <button type="button" class="main" id="b-next-lvl">▶ Comenzar el otro nivel</button>
    </div>
  </div>

  <div class="pads">
    <button type="button" id="b-left">◀ Izq</button>
    <button type="button" class="main" id="b-split">✂ Dividir</button>
    <button type="button" id="b-right">Der ▶</button>
  </div>

  <script>
    window.addEventListener("error", function (ev) {
      alert("Error en juego: " + (ev.message || "desconocido"));
    });

    function readStore(key, fallback) {
      try {
        const v = localStorage.getItem(key);
        return v === null ? fallback : v;
      } catch (_) {
        return fallback;
      }
    }

    function writeStore(key, val) {
      try {
        localStorage.setItem(key, String(val));
      } catch (_) {}
    }

    const c = document.getElementById("c");
    const ctx = c.getContext("2d");
    const W = 300;
    const H = 340;

    const mStart = document.getElementById("m-start");
    const mCfg = document.getElementById("m-cfg");
    const mLvl = document.getElementById("m-lvl");
    const tLvl = document.getElementById("t-lvl");
    const tPts = document.getElementById("t-pts");
    const tRec = document.getElementById("t-rec");
    const tLvlDone = document.getElementById("t-lvl-done");
    const tLvlSub = document.getElementById("t-lvl-sub");

    const diffs = [
      { label: "Tranquila", spd: 52, skulls: 1, move: 24 },
      { label: "Estándar", spd: 68, skulls: 2, move: 36 },
      { label: "Extrema", spd: 84, skulls: 3, move: 52 }
    ];

    let dIdx = 1;
    let snd = true;
    let best = Number(readStore("ss_rec", 0)) || 0;
    let bestLvl = Number(readStore("ss_lvl", 1)) || 1;

    let state = "menu";
    let lvl = 1;
    let pts = 0;
    let tot = 0;
    let snakes = [];
    let walls = [];
    let skulls = [];
    let foods = [];
    let turn = 0;
    let prevT = 0;
    let audio = null;

    function showRec() {
      tRec.textContent = "Récord: " + best + " pts · Nivel " + bestLvl;
    }

    function saveRec() {
      if (tot > best) best = tot;
      if (lvl > bestLvl) bestLvl = lvl;
      writeStore("ss_rec", best);
      writeStore("ss_lvl", bestLvl);
      showRec();
    }

    function ensureAudio() {
      if (!snd) return null;
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return null;
        if (!audio) audio = new AudioCtx();
        if (audio.state === "suspended") audio.resume();
        return audio;
      } catch (_) {
        return null;
      }
    }

    function tone(ctxAud, startTime, freq, dur, wave, vol, endFreq) {
      const osc = ctxAud.createOscillator();
      const gain = ctxAud.createGain();
      osc.type = wave || "triangle";
      osc.frequency.setValueAtTime(freq, startTime);
      if (endFreq) osc.frequency.exponentialRampToValueAtTime(endFreq, startTime + dur);
      gain.gain.setValueAtTime(0.001, startTime);
      gain.gain.linearRampToValueAtTime(vol || 0.14, startTime + 0.012);
      gain.gain.exponentialRampToValueAtTime(0.001, startTime + dur);
      osc.connect(gain);
      gain.connect(ctxAud.destination);
      osc.start(startTime);
      osc.stop(startTime + dur + 0.02);
    }

    function playSound(kind) {
      if (!snd) return;
      const ctxAud = ensureAudio();
      if (!ctxAud) return;
      try {
        const t = ctxAud.currentTime;
        if (kind === "eat") {
          tone(ctxAud, t, 523.25, 0.07, "triangle", 0.14, 659.25);
          tone(ctxAud, t + 0.055, 783.99, 0.08, "sine", 0.13, 1046.5);
        } else if (kind === "star") {
          tone(ctxAud, t, 587.33, 0.07, "triangle", 0.15, 783.99);
          tone(ctxAud, t + 0.055, 880, 0.07, "triangle", 0.15, 1046.5);
          tone(ctxAud, t + 0.11, 1174.66, 0.11, "sine", 0.14, 1567.98);
        } else if (kind === "split") {
          tone(ctxAud, t, 330, 0.08, "triangle", 0.14, 554.37);
          tone(ctxAud, t + 0.06, 440, 0.1, "sine", 0.13, 659.25);
        } else if (kind === "start") {
          tone(ctxAud, t, 392, 0.08, "triangle", 0.14, 523.25);
          tone(ctxAud, t + 0.07, 523.25, 0.11, "triangle", 0.14, 783.99);
        } else if (kind === "level") {
          tone(ctxAud, t, 523.25, 0.09, "triangle", 0.15, 523.25);
          tone(ctxAud, t + 0.08, 659.25, 0.09, "triangle", 0.15, 659.25);
          tone(ctxAud, t + 0.16, 783.99, 0.1, "triangle", 0.15, 783.99);
          tone(ctxAud, t + 0.25, 1046.5, 0.18, "sine", 0.16, 1318.5);
        } else if (kind === "hit") {
          tone(ctxAud, t, 220, 0.14, "sawtooth", 0.15, 98);
          tone(ctxAud, t + 0.1, 130.81, 0.2, "triangle", 0.15, 65.41);
        } else if (kind === "click") {
          tone(ctxAud, t, 660, 0.05, "sine", 0.1, 784);
        }
      } catch (_) {}
    }

    function makeSnake(x, y, ang, len, hue, isPlayer) {
      const segs = [];
      for (let i = 0; i < len; i++) {
        segs.push({
          x: x - Math.cos(ang) * i * 5,
          y: y - Math.sin(ang) * i * 5
        });
      }
      return { segs: segs, ang: ang, hue: hue, player: isPlayer, r: 6.5 };
    }

    function hitWall(x, y, r) {
      for (let i = 0; i < walls.length; i++) {
        const w = walls[i];
        const nx = Math.max(w.x, Math.min(x, w.x + w.w));
        const ny = Math.max(w.y, Math.min(y, w.y + w.h));
        const dx = x - nx;
        const dy = y - ny;
        if (dx * dx + dy * dy < r * r) return true;
      }
      return false;
    }

    function safeSpot(x, y, sweep) {
      const sp = sweep || 0;
      if (Math.hypot(x - W / 2, y - H * 0.8) < 55) return false;
      for (let s = -1; s <= 1; s++) {
        if (hitWall(x, y + s * sp, 14)) return false;
      }
      for (let i = 0; i < skulls.length; i++) {
        if (Math.hypot(x - skulls[i].x, y - skulls[i].y) < 32) return false;
      }
      return true;
    }

    function addFood() {
      const roll = Math.random();
      const kind = roll < 0.6 ? "berry" : (roll < 0.88 ? "citrus" : "star");
      let x = W / 2;
      let y = H * 0.42;
      for (let i = 0; i < 45; i++) {
        const tx = 26 + Math.random() * (W - 52);
        const ty = 26 + Math.random() * (H - 52);
        if (safeSpot(tx, ty, 0)) {
          x = tx;
          y = ty;
          break;
        }
      }
      const val = kind === "star" ? 40 : (kind === "citrus" ? 20 : 10);
      const grow = kind === "star" ? 3 : 2;
      const rad = kind === "star" ? 6.8 : 5.8;
      foods.push({ x: x, y: y, kind: kind, val: val, grow: grow, rad: rad });
    }

    function initLvl(n, resetTot) {
      lvl = n;
      pts = 0;
      if (resetTot) tot = 0;
      turn = 0;
      mLvl.classList.remove("on");
      snakes = [makeSnake(W / 2, H * 0.8, -Math.PI / 2, 12, 152, true)];
      walls = lvl > 1 ? [
        { x: 38, y: 120, w: 68, h: 12 },
        { x: W - 106, y: 205, w: 68, h: 12 }
      ] : [];
      skulls = [];

      const cnt = Math.min(5, diffs[dIdx].skulls + Math.floor((lvl - 1) / 2));
      const mov = lvl >= 4;
      const sweep = mov ? 36 : 0;
      let tries = 0;

      while (skulls.length < cnt && tries < 140) {
        tries++;
        const sx = 34 + Math.random() * (W - 68);
        const sy = 44 + sweep + Math.random() * Math.max(20, H - 88 - sweep * 2);
        if (safeSpot(sx, sy, sweep)) {
          skulls.push({
            x: sx,
            y: sy,
            minY: Math.max(24, sy - sweep),
            maxY: Math.min(H - 24, sy + sweep),
            dir: Math.random() < 0.5 ? -1 : 1,
            mov: mov,
            r: 8.5
          });
        }
      }

      foods = [];
      for (let i = 0; i < 5; i++) addFood();

      saveRec();
      tLvl.textContent = "Nivel " + lvl;
      tPts.textContent = "Puntos: " + pts + " / 300";
    }

    function startGame() {
      ensureAudio();
      try {
        mStart.classList.remove("on");
        mCfg.classList.remove("on");
        mLvl.classList.remove("on");
        state = "play";
        initLvl(1, true);
        playSound("start");
      } catch (err) {
        alert("No se pudo iniciar: " + err.message);
      }
    }

    function openLevelClear() {
      state = "levelclear";
      saveRec();
      tLvlDone.textContent = "¡Terminaste el nivel " + lvl + "!";
      tLvlSub.textContent = "Presiona para comenzar el otro nivel (Nivel " + (lvl + 1) + ").";
      mLvl.classList.add("on");
      playSound("level");
    }

    function nextLevel() {
      ensureAudio();
      mLvl.classList.remove("on");
      state = "play";
      initLvl(lvl + 1, false);
      playSound("start");
    }

    function openCfg() {
      ensureAudio();
      try {
        mStart.classList.remove("on");
        mLvl.classList.remove("on");
        mCfg.classList.add("on");
        state = "cfg";
        playSound("click");
      } catch (err) {
        alert("No se pudo abrir ajustes: " + err.message);
      }
    }

    function closeCfg() {
      mCfg.classList.remove("on");
      if (tot === 0 && pts === 0) {
        mStart.classList.add("on");
        state = "menu";
      } else {
        state = "play";
      }
    }

    function normalizeAngle(a) {
      while (a > Math.PI) a -= Math.PI * 2;
      while (a < -Math.PI) a += Math.PI * 2;
      return a;
    }

    function isAngleSafe(x, y, ang, r, lookDist) {
      for (let stepD = 10; stepD <= lookDist;
