<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Snake Split Arena</title>
    <style>
        * { box-sizing: border-box; touch-action: none; -webkit-tap-highlight-color: transparent; }
        body, html { 
            margin: 0; padding: 0; 
            background-color: #050508; color: #fff; 
            font-family: Arial, sans-serif; 
            overflow: hidden; width: 100vw; height: 100vh; 
            display: flex; flex-direction: column; align-items: center;
        }
        
        /* ENCABEZADO */
        #ui-header {
            width: 100%; height: 50px; display: flex; 
            justify-content: space-between; align-items: center; background: #0a0a12;
            border-bottom: 2px solid #ff0055; padding: 0 12px; flex-shrink: 0; z-index: 20;
        }
        #header-info { display: flex; flex-direction: column; align-items: flex-start; }
        #title { font-size: 12px; font-weight: bold; color: #ff0055; margin: 0; }
        #scores { font-size: 11px; font-weight: bold; margin-top: 2px; display: flex; gap: 8px; }
        #score-val { color: #00ffcc; }
        #target-val { color: #ff00ff; }
        #high-val { color: #ffcc00; }

        #pause-btn {
            background: #ff0055; border: none; color: #fff; border-radius: 6px; 
            font-size: 12px; font-weight: bold; padding: 5px 10px; cursor: pointer;
            box-shadow: 0 0 8px rgba(255, 0, 85, 0.5);
        }

        /* ÁREA DE JUEGO SEGURA */
        #canvas-area {
            width: 100%; flex-grow: 1; display: flex; 
            justify-content: center; align-items: center;
            padding-bottom: 120px;
        }
        canvas { 
            border: 3px solid #ff0055; 
            box-shadow: 0 0 15px rgba(255, 0, 85, 0.5); 
            border-radius: 8px;
            background: #000005;
            display: block;
        }

        /* MODALES */
        .modal {
            display: none;
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(5, 5, 8, 0.9); backdrop-filter: blur(5px);
            z-index: 100; flex-direction: column; justify-content: center; align-items: center;
        }
        .modal-card {
            background: #0a0a12; border: 2px solid #00ffcc; border-radius: 12px;
            padding: 25px; text-align: center; box-shadow: 0 0 25px rgba(0, 255, 204, 0.4);
            max-width: 85%; width: 280px;
        }
        .modal-card h2 { color: #00ffcc; margin: 0 0 15px 0; font-size: 20px; }
        .menu-btn {
            width: 100%; background: #ff0055; color: #fff; border: none; padding: 12px;
            font-size: 14px; font-weight: bold; border-radius: 8px; margin-top: 10px;
            box-shadow: 0 0 10px rgba(255, 0, 85, 0.4); cursor: pointer;
        }
        .menu-btn.secondary { background: #00f0ff; color: #000; }

        /* CONTROL D-PAD COMPACTO Y FUERA DEL CUADRO */
        #dpad-container {
            position: fixed;
            bottom: 50px;
            left: 50%;
            transform: translateX(-50%);
            width: 115px; height: 115px; 
            display: grid; 
            grid-template-columns: repeat(3, 1fr); 
            grid-template-rows: repeat(3, 1fr);
            z-index: 50;
        }
        .d-btn {
            background: rgba(0, 240, 255, 0.3); border: 2px solid #00f0ff; border-radius: 8px;
            display: flex; justify-content: center; align-items: center; color: #00f0ff; font-size: 18px;
            user-select: none;
        }
        .d-btn:active { background: rgba(0, 240, 255, 0.7); }
        #btn-up { grid-column: 2; grid-row: 1; }
        #btn-left { grid-column: 1; grid-row: 2; }
        #btn-right { grid-column: 3; grid-row: 2; }
        #btn-down { grid-column: 2; grid-row: 3; }
    </style>
</head>
<body>
    <div id="ui-header">
        <div id="header-info">
            <div id="title">SNAKE SPLIT - ÁREA 1</div>
            <div id="scores">
                <span id="score-val">PTS: 0</span>
                <span id="target-val">META: 300</span>
                <span id="high-val">RÉCORD: 0</span>
            </div>
        </div>
        <button id="pause-btn">PAUSA</button>
    </div>

    <div id="canvas-area">
        <canvas id="gameCanvas" width="280" height="320"></canvas>
    </div>

    <div id="pause-modal" class="modal">
        <div class="modal-card">
            <h2>JUEGO EN PAUSA</h2>
            <button id="resume-btn" class="menu-btn secondary">CONTINUAR</button>
            <button id="restart-btn" class="menu-btn">REINICIAR ÁREA</button>
        </div>
    </div>

    <div id="victory-modal" class="modal">
        <div class="modal-card">
            <h2>¡ÁREA COMPLETADA!</h2>
            <p>¡Lograste los 300 puntos!</p>
            <button id="next-btn" class="menu-btn">SIGUIENTE ÁREA</button>
        </div>
    </div>
