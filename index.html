
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Snake Split Adventure</title>
    <style>
        body { margin: 0; padding: 0; background-color: #0d0f17; color: #fff; font-family: sans-serif; overflow: hidden; display: flex; justify-content: center; align-items: center; height: 100vh; }
        #game-container { width: 100vw; height: 100vh; display: flex; justify-content: center; align-items: center; }
        canvas { border: 2px solid #00f0ff; box-shadow: 0 0 20px rgba(0, 240, 255, 0.4); max-width: 100%; max-height: 100%; }
    </style>
</head>
<body>
    <div id="game-container"></div>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
    <script>
        const config = {
            type: Phaser.AUTO,
            width: 800,
            height: 600,
            parent: 'game-container',
            physics: { default: 'arcade', arcade: { debug: false } },
            scene: { preload: preload, create: create, update: update }
        };

        let snake = [];
        let food;
        let direction = 'RIGHT';
        let moveTime = 0;
        const gridsize = 20;

        const game = new Phaser.Game(config);

        function preload() {}

        function create() {
            this.add.text(400, 30, 'SNAKE SPLIT ADVENTURE', { fontSize: '24px', fill: '#00f0ff' }).setOrigin(0.5);
            
            // Crear la serpiente con posiciones bien separadas
            snake = [];
            for (let i = 0; i < 5; i++) {
                let part = this.add.rectangle(400 - (i * gridsize), 300, gridsize - 2, gridsize - 2, 0x00f0ff);
                snake.push(part);
            }

            // Comida
            food = this.add.rectangle(600, 300, gridsize - 2, gridsize - 2, 0xff00ff);

            // Controles táctiles sencillos dividiendo la pantalla en dos (izquierda / derecha)
            this.input.on('pointerdown', (pointer) => {
                if (pointer.x < 400) {
                    // Girar sentido antihorario o cambiar dirección
                    if (direction === 'RIGHT') direction = 'UP';
                    else if (direction === 'UP') direction = 'LEFT';
                    else if (direction === 'LEFT') direction = 'DOWN';
                    else if (direction === 'DOWN') direction = 'RIGHT';
                } else {
                    // Girar sentido horario
                    if (direction === 'RIGHT') direction = 'DOWN';
                    else if (direction === 'DOWN') direction = 'LEFT';
                    else if (direction === 'LEFT') direction = 'UP';
                    else if (direction === 'UP') direction = 'RIGHT';
                }
            });
        }

        function update(time) {
            if (time < moveTime) return;
            moveTime = time + 150; // Velocidad de movimiento

            // Calcular nueva posición de la cabeza
            let head = snake[0];
            let x = head.x;
            let y = head.y;

            if (direction === 'RIGHT') x += gridsize;
            else if (direction === 'LEFT') x -= gridsize;
            else if (direction === 'UP') y -= gridsize;
            else if (direction === 'DOWN') y += gridsize;

            // Rebotar o reaparecer en los bordes
            if (x >= 800) x = 0;
            if (x < 0) x = 780;
            if (y >= 600) y = 60; // Deja espacio para el título
            if (y < 60) y = 580;

            // Mover el cuerpo de la serpiente
            let tail = snake.pop();
            tail.setPosition(x, y);
            snake.unshift(tail);
        }
    </script>
</body>
</html>
