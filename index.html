<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Snake Split</title>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            touch-action: none;
        }
        #game-container {
            width: 300px;
            height: 340px;
            background: #1e1e1e;
            border: 2px solid #333;
            position: relative;
            box-shadow: 0 4px 15px rgba(0,0,0,0.6);
            border-radius: 12px;
            overflow: hidden;
        }
        canvas {
            display: block;
            background: radial-gradient(circle, #1a1a1a 0%, #0a0a0a 100%);
        }
    </style>
</head>
<body>
    <div id="game-container">
        <canvas id="gameCanvas" width="300" height="340"></canvas>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        // Renderizado inicial de prueba con fondo degradado
        function initGame() {
            ctx.fillStyle = "#0d0d0d";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Texto de estado
            ctx.fillStyle = "#00ffcc";
            ctx.font = "bold 14px sans-serif";
            ctx.textAlign = "center";
            ctx.fillText("SNAKE SPLIT - 300x340", canvas.width / 2, 40);
            
            ctx.fillStyle = "#888";
            ctx.font = "12px sans-serif";
            ctx.fillText("Listo para aplicar motor visual orgánico", canvas.width / 2, 170);
        }

        initGame();
    </script>
</body>
</html>
