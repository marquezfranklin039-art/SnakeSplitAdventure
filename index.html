<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Snake Split</title>
  <style>
    * { box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }
    body {
      background-color: #eef2f6;
      color: #0f172a;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 12px;
      overflow: hidden;
      touch-action: none;
    }
    .hud {
      width: 100%;
      max-width: 360px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      font-weight: 700;
      font-size: 15px;
    }
    .badge {
      background: #ffffff;
      color: #0f172a;
      border: 1px solid #cbd5e1;
      padding: 6px 12px;
      border-radius: 999px;
      box-shadow: 0 2px 6px rgba(15, 23, 42, 0.06);
    }
    #game-wrap {
      position: relative;
      width: 100%;
      max-width: 360px;
      aspect-ratio: 300 / 340;
      border-radius: 16px;
      overflow: hidden;
      border: 2px solid #94a3b8;
      box-shadow: 0 10px 24px rgba(15, 23, 42, 0.12);
      background: radial-gradient(circle at 50% 35%, #ffffff 0%, #e2e8f0 100%);
    }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }
    .controls {
      width: 100%;
      max-width: 360px;
      margin-top: 12px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }
    button {
      background: #ffffff;
      color: #0f172a;
      border: 1px solid #cbd5e1;
      border-radius: 12px;
      padding: 12px 8px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(15, 23, 42, 0.06);
    }
    button:active {
      background: #e2e8f0;
      transform: scale(0.98);
    }
    .split-btn {
      background: #0284c7;
      color: #ffffff;
      border-color: #0369a1;
    }
    .split-btn:active {
      background: #0369a1;
    }
  </style>
</head>
<body>
  <div class="hud">
    <div class="badge" id="score-ui">Puntos: 0</div>
    <div class="badge" id="snakes-ui">Culebras: 1</div>
  </div>

  <div id="game-wrap">
    <canvas id="game" width="300" height="340"></canvas>
  </div>

  <div class="controls">
    <button id="btn-left">◀ Izq</button>
    <button class="split-btn" id="btn-split">✂ Dividir</button>
    <button id="btn-right">Der ▶</button>
  </div>

  <script>
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");
    const scoreUi = document.getElementById("score-ui");
    const snakesUi = document.getElementById("snakes-ui");

    const W = canvas.width;
    const H = canvas.height;
    let score = 0;
    let gameOver = false;
    let lastTime = 0;
    let touchStartX = null;

    function createSnake(x, y, angle, length = 12, hue = 152, isPlayer = true) {
      const segments = [];
      for (let i = 0; i < length; i++) {
        segments.push({
          x: x - Math.cos(angle) * i * 5,
          y: y - Math.sin(angle) * i * 5
        });
      }
      return {
        segments,
        angle,
        turnDir: 0,
        hue,
        radius: 6.5,
        isPlayer,
        aiTimer: 0.4 + Math.random() * 0.7,
        aiTurn: (Math.random() < 0.5 ? -1 : 1)
      };
    }

    let snakes = [createSnake(W / 2, H * 0.65, -Math.PI / 2, 12, 152, true)];
    let foods = [];

    function spawnFood() {
      foods.push({
        x: 24 + Math.random() * (W - 48),
        y: 24 + Math.random() * (H - 48),
        r: 5.5,
        pulse: Math.random() * Math.PI * 2
      });
    }

    for (let i = 0; i < 6; i++) spawnFood();

    function resetGame() {
      score = 0;
      gameOver = false;
      snakes = [createSnake(W / 2, H * 0.65, -Math.PI / 2, 12, 152, true)];
      foods = [];
      for (let i = 0; i < 6; i++) spawnFood();
      updateHud();
    }

    function updateHud() {
      scoreUi.textContent = `Puntos: ${score}`;
      snakesUi.textContent = `Culebras: ${snakes.length}`;
    }

    function normalizeAngle(a) {
      while (a > Math.PI) a -= Math.PI * 2;
      while (a < -Math.PI) a += Math.PI * 2;
      return a;
    }

    function chooseAutonomousDirection(s) {
      const head = s.segments[0];
      const margin = 34;

      // Evitar bordes con prioridad
      if (head.x < margin) {
        const diff = normalizeAngle(0 - s.angle);
        return diff >= 0 ? 1 : -1;
      }
      if (head.x > W - margin) {
        const diff = normalizeAngle(Math.PI - s.angle);
        return diff >= 0 ? 1 : -1;
      }
      if (head.y < margin) {
        const diff = normalizeAngle(Math.PI / 2 - s.angle);
        return diff >= 0 ? 1 : -1;
      }
      if (head.y > H - margin) {
        const diff = normalizeAngle(-Math.PI / 2 - s.angle);
        return diff >= 0 ? 1 : -1;
      }

      // Buscar comida cercana si existe
      if (foods.length > 0) {
        let nearest = foods[0];
        let bestDist = Math.hypot(head.x - nearest.x, head.y - nearest.y);
        for (let i = 1; i < foods.length; i++) {
          const d = Math.hypot(head.x - foods[i].x, head.y - foods[i].y);
          if (d < bestDist) {
            bestDist = d;
            nearest = foods[i];
          }
        }
        const targetAngle = Math.atan2(nearest.y - head.y, nearest.x - head.x);
        const diff = normalizeAngle(targetAngle - s.angle);
        if (Math.abs(diff) < 0.14) return 0;
        return diff > 0 ? 1 : -1;
      }

      return s.aiTurn;
    }

    function splitSnakes() {
      if (gameOver) {
        resetGame();
        return;
      }
      const nextSnakes = [];
      for (const s of snakes) {
        if (s.segments.length >= 8 && nextSnakes.length + snakes.length <= 4) {
          const mid = Math.floor(s.segments.length / 2);
          const secondPart = s.segments.splice(mid);
          s.segments.push({ ...s.segments[s.segments.length - 1] });
          const angleB = normalizeAngle(s.angle + (s.isPlayer ? 0.85 : 0.65));
          nextSnakes.push(s);
          nextSnakes.push({
            segments: secondPart,
            angle: angleB,
            turnDir: 0,
            hue: (s.hue + 55) % 360,
            radius: s.radius,
            isPlayer: false,
            aiTimer: 0.45 + Math.random() * 0.6,
            aiTurn: Math.random() < 0.5 ? -1 : 1
          });
        } else {
          nextSnakes.push(s);
        }
      }
      snakes = nextSnakes;
      updateHud();
    }

    function setPlayerTurn(dir) {
      for (const s of snakes) {
        if (s.isPlayer) {
          s.turnDir = dir;
        }
      }
    }

    document.getElementById("btn-left").addEventListener("pointerdown", () => setPlayerTurn(-1));
    document.getElementById("btn-left").addEventListener("pointerup", () => setPlayerTurn(0));
    document.getElementById("btn-left").addEventListener("pointerleave", () => setPlayerTurn(0));

    document.getElementById("btn-right").addEventListener("pointerdown", () => setPlayerTurn(1));
    document.getElementById("btn-right").addEventListener("pointerup", () => setPlayerTurn(0));
    document.getElementById("btn-right").addEventListener("pointerleave", () => setPlayerTurn(0));

    document.getElementById("btn-split").addEventListener("click", splitSnakes);

    canvas.addEventListener("pointerdown", (e) => {
      if (gameOver) {
        resetGame();
        return;
      }
      touchStartX = e.clientX;
    });

    canvas.addEventListener("pointermove", (e) => {
      if (touchStartX === null) return;
      const dx = e.clientX - touchStartX;
      if (dx < -14) setPlayerTurn(-1);
      else if (dx > 14) setPlayerTurn(1);
    });

    canvas.addEventListener("pointerup", () => {
      touchStartX = null;
      setPlayerTurn(0);
    });

    window.addEventListener("keydown", (e) => {
      if (e.key === "ArrowLeft" || e.key === "a") setPlayerTurn(-1);
      if (e.key === "ArrowRight" || e.key === "d") setPlayerTurn(1);
      if (e.key === " " || e.key === "Enter") splitSnakes();
    });

    window.addEventListener("keyup", (e) => {
      if (["ArrowLeft", "a", "ArrowRight", "d"].includes(e.key)) setPlayerTurn(0);
    });

    function update(dt) {
      if (gameOver) return;
      const speed = 62; // Velocidad más suave y controlable
      const turnSpeed = 3.0;
      const survivingSnakes = [];

      for (const s of snakes) {
        if (!s.isPlayer) {
          s.aiTimer -= dt;
          if (s.aiTimer <= 0) {
            s.aiTimer = 0.35 + Math.random() * 0.65;
            s.aiTurn = chooseAutonomousDirection(s);
          }
          s.turnDir = chooseAutonomousDirection(s);
        }

        s.angle = normalizeAngle(s.angle + s.turnDir * turnSpeed * dt);
        const head = s.segments[0];
        const nx = head.x + Math.cos(s.angle) * speed * dt;
        const ny = head.y + Math.sin(s.angle) * speed * dt;

        const hitWall = nx < s.radius || nx > W - s.radius || ny < s.radius || ny > H - s.radius;
        if (hitWall) {
          if (s.isPlayer) {
            gameOver = true;
            return;
          } else {
            // La culebra dividida desaparece sola sin terminar tu partida
            continue;
          }
        }

        s.segments.unshift({ x: nx, y: ny });
        s.segments.pop();

        for (let i = foods.length - 1; i >= 0; i--) {
          const f = foods[i];
          const dist = Math.hypot(nx - f.x, ny - f.y);
          if (dist < s.radius + f.r + 2) {
            foods.splice(i, 1);
            spawnFood();
            score += 10;
            const tail = s.segments[s.segments.length - 1];
            s.segments.push({ ...tail }, { ...tail });
            updateHud();
          }
        }

        survivingSnakes.push(s);
      }

      if (survivingSnakes.length !== snakes.length) {
        snakes = survivingSnakes;
        updateHud();
      }

      for (const f of foods) {
        f.pulse += dt * 5;
      }
    }

    function draw() {
      ctx.clearRect(0, 0, W, H);

      // Comida brillante sobre fondo claro
      for (const f of foods) {
        const glowRadius = f.r + Math.sin(f.pulse) * 1.5;
        const grad = ctx.createRadialGradient(f.x, f.y, 1, f.x, f.y, glowRadius * 2.2);
        grad.addColorStop(0, "#f59e0b");
        grad.addColorStop(0.6, "rgba(245, 158, 11, 0.35)");
        grad.addColorStop(1, "rgba(245, 158, 11, 0)");
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(f.x, f.y, glowRadius * 2.2, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = "#fbbf24";
        ctx.beginPath();
        ctx.arc(f.x, f.y, f.r, 0, Math.PI * 2);
        ctx.fill();
      }

      // Culebras con volumen suave
      for (const s of snakes) {
        for (let i = s.segments.length - 1; i >= 0; i--) {
          const seg = s.segments[i];
          const ratio = 1 - (i / Math.max(s.segments.length, 1)) * 0.45;
          const r = s.radius * ratio;

          const bodyGrad = ctx.createRadialGradient(
            seg.x - r * 0.35,
            seg.y - r * 0.35,
            r * 0.15,
            seg.x,
            seg.y,
            r
          );
          bodyGrad.addColorStop(0, `hsla(${s.hue}, 88%, 62%, 1)`);
          bodyGrad.addColorStop(1, `hsla(${s.hue}, 78%, 32%, 1)`);

          ctx.fillStyle = bodyGrad;
          ctx.beginPath();
          ctx.arc(seg.x, seg.y, r, 0, Math.PI * 2);
          ctx.fill();
        }

        // Pequeño indicador en la cabeza de la culebra que tú manejas
        if (s.isPlayer && s.segments.length > 0) {
          const h = s.segments[0];
          ctx.fillStyle = "#ffffff";
          ctx.beginPath();
          ctx.arc(h.x, h.y, 2.2, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      if (gameOver) {
        ctx.fillStyle = "rgba(241, 245, 249, 0.88)";
        ctx.fillRect(0, 0, W, H);
        ctx.fillStyle = "#0f172a";
        ctx.font = "bold 22px system-ui, sans-serif";
        ctx.textAlign = "center";
        ctx.fillText("¡Chocaste!", W / 2, H / 2 - 10);
        ctx.font = "14px system-ui, sans-serif";
        ctx.fillStyle = "#334155";
        ctx.fillText("Toca aquí o en Dividir para jugar de nuevo", W / 2, H / 2 + 18);
      }
    }

    function loop(timestamp) {
      const dt = Math.min((timestamp - lastTime) / 1000 || 0.016, 0.05);
      lastTime = timestamp;
      update(dt);
      draw();
      requestAnimationFrame(loop);
    }

    requestAnimationFrame(loop);
  </script>
</body>
</html>
