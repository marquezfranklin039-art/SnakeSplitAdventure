<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Snake Split Arena</title>
    <style>
        * { box-sizing: border-box; touch-action: none; -webkit-tap-highlight-color: transparent; }
        body, html { 
            margin: 0; padding: 0; 
            background-color: #050508; color: #fff; 
            font-family: Arial, sans-serif; 
            overflow: hidden; width: 100vw; height: 100vh; 
            display: flex; flex-direction: column; align-items: center;
        }
        #ui-header {
            width: 100%; height: 50px; display: flex; flex-direction: column; 
            justify-content: center; align-items: center; background: #0a0a12;
            border-bottom: 2px solid #ff0055; flex-shrink: 0; z-index: 10;
        }
        #title { font-size: 14px; font-weight: bold; color: #ff0055; margin: 0; }
        #scores { font-size: 12px; font-weight: bold; margin-top: 2px; display: flex; gap: 12px; }
        #score-val { color: #00ffcc; }
        #target-val { color: #ff00ff; }
        #high-val { color: #ffcc00; }

        /* CANCHA CENTRADA Y FIJA */
        #canvas-area {
            width: 100%; flex-grow: 1; display: flex; 
            justify-content: center; align-items: center;
            position: relative; padding-bottom: 90px;
        }
        canvas { 
            border: 3px solid #ff0055; 
            box-shadow: 0 0 18px rgba(255, 0, 85, 0.5); 
            border-radius: 8px;
            background: #000005;
            display: block;
            width: 90vw;
            max-width: 360px;
            height: auto;
        }

        /* MODAL DE VICTORIA */
        #victory-modal {
            display: none;
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(5, 5, 8, 0.85); backdrop-filter: blur(5px);
            z-index: 100; flex-direction: column; justify-content: center; align-items: center;
        }
        #victory-card {
            background: #0a0a12; border: 2px solid #00ffcc; border-radius: 12px;
            padding: 25px; text-align: center; box-shadow: 0 0 25px rgba(0, 255, 204, 0.4);
            max-width: 85%;
        }
        #victory-card h2 { color: #00ffcc; margin: 0 0 10px 0; font-size: 20px; }
        #victory-card p { color: #fff; margin: 0 0 20px 0; font-size: 14px; }
        #next-btn {
            background: #ff0055; color: #fff; border: none; padding: 12px 24px;
            font-size: 15px; font-weight: bold; border-radius: 8px;
            box-shadow: 0 0 10px rgba(255, 0, 85, 0.5); cursor: pointer;
        }

        /* CONTROL LEVANTADO CÓMODO SOBRE LA BARRA INFERIOR */
        #dpad-container {
            position: fixed;
            bottom: 85px;
            left: 50%;
            transform: translateX(-50%);
            width: 150px; height: 150px; 
            display: grid; 
            grid-template-columns: repeat(3, 1fr); 
            grid-template-rows: repeat(3, 1fr);
            z-index: 20;
        }
        .d-btn {
            background: rgba(0, 240, 255, 0.3); border: 2px solid #00f0ff; border-radius: 12px;
            display: flex; justify-content: center; align-items: center; color: #00f0ff; font-size: 26px;
            user-select: none;
        }
        .d-btn:active { background: rgba(0, 240, 255, 0.7); }
        #btn-up { grid-column: 2; grid-row: 1; }
        #btn-left { grid-column: 1; grid-row: 2; }
        #btn-right { grid-column: 3; grid-row: 2; }
        #btn-down { grid-column: 2; grid-row: 3; }
    </style>
</head>
<body>
    <div id="ui-header">
        <div id="title">SNAKE SPLIT: BATTLE ARENA - ÁREA 1</div>
        <div id="scores">
            <span id="score-val">PUNTOS: 0</span>
            <span id="target-val">META: 300</span>
            <span id="high-val">RÉCORD: 0</span>
        </div>
    </div>

    <div id="canvas-area">
        <canvas id="gameCanvas" width="300" height="380"></canvas>
    </div>

    <div id="victory-modal">
        <div id="victory-card">
            <h2>¡ÁREA COMPLETADA!</h2>
            <p>¡Lograste los 300 puntos!</p>
            <button id="next-btn">SIGUIENTE ÁREA</button>
        </div>
    </div>

    <div id="dpad-container">
        <div id="btn-up" class="d-btn">&#9650;</div>
        <div id="btn-left" class="d-btn">&#9668;</div>
        <div id="btn-right" class="d-btn">&#9658;</div>
        <div id="btn-down" class="d-btn">&#9660;</div>
    </div>
