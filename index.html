<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<title>Snake Split</title>
<style>
*{box-sizing:border-box;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
body{margin:0;min-height:100vh;padding:12px;background:#eef2f6;color:#0f172a;font-family:system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;touch-action:manipulation}
body.dark{background:#0e1116;color:#f8fafc}
.bar{width:100%;max-width:360px;display:flex;justify-content:space-between;align-items:center;gap:6px;margin-bottom:8px;font-size:13px;font-weight:700}
.pill{background:#fff;color:#0f172a;border:1px solid #cbd5e1;border-radius:999px;padding:6px 10px}
body.dark .pill{background:#1b222c;color:#f8fafc;border-color:#2e3948}
#box{position:relative;width:100%;max-width:360px;aspect-ratio:300/340;border-radius:16px;overflow:hidden;border:2px solid #94a3b8;background:radial-gradient(circle at 50% 35%,#fff 0%,#e2e8f0 100%)}
body.dark #box{background:radial-gradient(circle at 50% 35%,#19222f 0%,#10151d 100%);border-color:#334155}
canvas{width:100%;height:100%;display:block}
.layer{position:absolute;inset:0;background:rgba(241,245,249,.96);display:none;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:16px;text-align:center;z-index:5}
body.dark .layer{background:rgba(14,17,22,.96)}
.layer.on{display:flex}
.pads{width:100%;max-width:360px;margin-top:10px;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
button{border:1px solid #cbd5e1;background:#fff;color:#0f172a;border-radius:10px;padding:10px;font-weight:700;font-size:13px;cursor:pointer;touch-action:manipulation}
body.dark button{background:#1b222c;color:#f8fafc;border-color:#2e3948}
.main{background:#0284c7;color:#fff;border-color:#0369a1}
</style>
</head>
<body>
<div class="bar">
  <span class="pill" id="t-lvl">Nivel 1</span>
  <span class="pill" id="t-pts">Puntos: 0 / 300</span>
  <div style="display:flex;gap:6px">
    <button type="button" id="b-pause" onclick="togglePause()">Pausa</button>
    <button type="button" onclick="openCfg()">Ajustes</button>
  </div>
</div>

<div id="box">
  <canvas id="c" width="300" height="340"></canvas>
  <div class="layer on" id="m-start">
    <div style="font-size:11px;font-weight:800;color:#0284c7">EDICION ARCADE</div>
    <h2 style="margin:0">SNAKE SPLIT</h2>
    <div class="pill" id="t-rec">Record: 0 pts · Nivel 1</div>
    <div style="display:flex;gap:8px">
      <button type="button" class="main" onclick="startGame()">Jugar</button>
      <button type="button" onclick="openCfg()">Ajustes</button>
    </div>
  </div>
  <div class="layer" id="m-pause">
    <div style="font-size:11px;font-weight:800;color:#0284c7">EN PAUSA</div>
    <h2 style="margin:0">Juego pausado</h2>
    <p style="margin:0;font-size:13px">Toca continuar para seguir jugando.</p>
    <button type="button" class="main" onclick="togglePause()">Continuar</button>
  </div>
  <div class="layer" id="m-cfg">
    <h3 style="margin:0">Configuracion</h3>
    <div style="display:flex;gap:6px;flex-wrap:wrap;justify-content:center">
      <button type="button" id="o-diff" onclick="cycleDiff()">Dificultad: Estandar</button>
      <button type="button" id="o-theme" onclick="cycleTheme()">Pantalla: Clara</button>
      <button type="button" id="o-snd" onclick="cycleSound()">Sonido: Si</button>
    </div>
    <button type="button" class="main" onclick="closeCfg()">Listo</button>
  </div>
  <div class="layer" id="m-lvl">
    <div style="font-size:11px;font-weight:800;color:#16a34a">OBJETIVO CUMPLIDO</div>
    <h2 style="margin:0" id="t-lvl-done">Terminaste el nivel!</h2>
    <p style="margin:0;font-size:13px" id="t-lvl-sub">Listo para comenzar el otro nivel.</p>
    <button type="button" class="main" onclick="nextLevel()">Comenzar el otro nivel</button>
  </div>
</div>

<div class="pads">
  <button type="button" id="b-left">Izq</button>
  <button type="button" class="main" onclick="splitSnakes()">Dividir</button>
  <button type="button" id="b-right">Der</button>
</div>

<script>
const c=document.getElementById("c"),ctx=c.getContext("2d"),W=300,H=340;
const mStart=document.getElementById("m-start"),mPause=document.getElementById("m-pause"),mCfg=document.getElementById("m-cfg"),mLvl=document.getElementById("m-lvl");
const tLvl=document.getElementById("t-lvl"),tPts=document.getElementById("t-pts"),tRec=document.getElementById("t-rec"),tLvlDone=document.getElementById("t-lvl-done"),tLvlSub=document.getElementById("t-lvl-sub"),bPause=document.getElementById("b-pause");
const diffs=[{label:"Tranquila",spd:52,skulls:1,move:24},{label:"Estandar",spd:68,skulls:2,move:36},{label:"Extrema",spd:84,skulls:3,move:52}];
let dIdx=1,snd=true,best=0,bestLvl=1,state="menu",lvl=1,pts=0,tot=0,snakes=[],walls=[],skulls=[],foods=[],turn=0,prevT=0,audio=null,raider=null,raiderCd=7;
try{best=Number(localStorage.getItem("ss_rec")||0)||0;bestLvl=Number(localStorage.getItem("ss_lvl")||1)||1}catch(_){}

function showRec(){tRec.textContent="Record: "+best+" pts · Nivel "+bestLvl}
function saveRec(){if(tot>best)best=tot;if(lvl>bestLvl)bestLvl=lvl;try{localStorage.setItem("ss_rec",best);localStorage.setItem("ss_lvl",bestLvl)}catch(_){}showRec()}
function ensureAudio(){if(!snd)return null;try{const A=window.AudioContext||window.webkitAudioContext;
