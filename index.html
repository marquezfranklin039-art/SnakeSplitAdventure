<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Snake Split</title>
  <style>
    * { box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0;
      min-height: 100vh;
      padding: 12px;
      background: #eef2f6;
      color: #0f172a;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      touch-action: none;
    }
    body.dark { background: #0e1116; color: #f8fafc; }
    .bar {
      width: 100%;
      max-width: 360px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 6px;
      margin-bottom: 8px;
      font-size: 13px;
      font-weight: 700;
    }
    .pill {
      background: #ffffff;
      color: #0f172a;
      border: 1px solid #cbd5e1;
      border-radius: 999px;
      padding: 6px 10px;
    }
    body.dark .pill { background: #1b222c; color: #f8fafc; border-color: #2e3948; }
    #box {
      position: relative;
      width: 100%;
      max-width: 360px;
      aspect-ratio: 300 / 340;
      border-radius: 16px;
      overflow: hidden;
      border: 2px solid #94a3b8;
      background: #ffffff;
    }
    body.dark #box { background: #141a23; border-color: #334155; }
    canvas { width: 100%; height: 100%; display: block; }
    .layer {
      position: absolute;
      inset: 0;
      background: rgba(241, 245, 249, 0.96);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 16px;
      text-align: center;
    }
    body.dark .layer { background: rgba(14, 17, 22, 0.95); }
    .layer.on { display: flex; }
    .pads {
      width: 100%;
      max-width: 360px;
      margin-top: 10px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }
    button {
      border: 1px solid #cbd5e1;
      background: #ffffff;
      color: #0f172a;
      border-radius: 10px;
      padding: 10px;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
    }
    body.dark button { background: #1b222c; color: #f8fafc; border-color: #2e3948; }
    .main { background: #0284c7; color: #ffffff; border-color: #0369a1; }
  </style>
</head>
<body>
  <div class="bar">
    <span class="pill" id="t-lvl">Nivel 1</span>
    <span class="pill" id="t-pts">Puntos: 0 / 300</span>
    <button id="b-cfg-top">⚙️</button>
  </div>

  <div id="box">
    <canvas id="c" width="300" height="340"></canvas>

    <div class="layer on" id="m-start">
      <h2 style="margin:0;">SNAKE SPLIT</h2>
      <div class="pill" id="t-rec">Récord: 0 pts · Nivel 1</div>
      <div style="display:flex;gap:8px;">
        <button class="main" id="b-play">▶ Jugar</button>
        <button id="b-cfg">⚙️ Ajustes</button>
      </div>
    </div>

    <div class="layer" id="m-cfg">
      <h3 style="margin:0;">Configuración</h3>
      <div style="display:flex;gap:6px;flex-wrap:wrap;justify-content:center;">
        <button id="o-diff">Dificultad: Estándar</button>
        <button id="o-theme">Pantalla: Clara</button>
        <button id="o-snd">Sonido: Sí</button>
      </div>
      <button class="main" id="b-done">Listo</button>
    </div>
  </div>

  <div class="pads">
    <button id="b-left">◀ Izq</button>
    <button class="main" id="b-split">✂ Dividir</button>
    <button id="b-right">Der ▶</button>
  </div>

  <script>
    const c = document.getElementById("c");
    const ctx = c.getContext("2d");
    const W = 300, H = 340;

    const mStart = document.getElementById("m-start");
    const mCfg = document.getElementById("m-cfg");
    const tLvl = document.getElementById("t-lvl");
    const tPts = document.getElementById("t-pts");
    const tRec = document.getElementById("t-rec");

    const diffs = [
      { label: "Tranquila", spd: 50, skulls: 0, move: 25 },
      { label: "Estándar", spd: 65, skulls: 1, move: 36 },
      { label: "Extrema", spd: 82, skulls: 2, move: 52 }
    ];
    let dIdx = 1;
    let snd = true;
    let best = Number(localStorage.getItem("ss_rec") || 0);
    let bestLvl = Number(localStorage.getItem("ss_lvl") || 1);

    let state = "menu";
    let lvl = 1, pts = 0, tot = 0;
    let snakes = [];
    let walls = [];
    let skulls = [];
    let food = { x: 150, y: 120 };
    let turn = 0;
    let prevT = 0;
    let audio = null;

    function showRec() {
      tRec.textContent = "Récord: " + best + " pts · Nivel " + bestLvl;
    }
    showRec();

    function saveRec() {
      if (tot > best) best = tot;
      if (lvl > bestLvl) bestLvl = lvl;
      localStorage.setItem("ss_rec", String(best));
      localStorage.setItem("ss_lvl", String(bestLvl));
      showRec();
    }

    function playFx(f, d = 0.09, type = "sine", f2 = null) {
      if (!snd) return;
      try {
        const Ctx = window.AudioContext || window.webkitAudioContext;
        if (!Ctx) return;
        if (!audio) audio = new Ctx();
        if (audio.state === "suspended") audio.resume();
        const t = audio.currentTime;
        const o = audio.createOscillator();
        const g = audio.createGain();
        o.type = type;
        o.frequency.setValueAtTime(f, t);
        if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + d);
        g.gain.setValueAtTime(0.07, t);
        g.gain.exponentialRampToValueAtTime(0.001, t + d);
        o.connect(g);
        g.connect(audio.destination);
        o.start(t);
        o.stop(t + d + 0.02);
      } catch (_) {}
    }

    function makeSnake(x, y, ang, n, hue, player) {
      const segs = [];
      for (let i = 0; i < n; i++) {
        segs.push({ x: x - Math.cos(ang) * i * 5, y: y - Math.sin(ang) * i * 5 });
      }
      return { segs, ang, hue, player, r: 6.5, aiT: 0.4, aiD: 1 };
    }

    function hitW(x, y, r) {
      for (const w of walls) {
        const nx = Math.max(w.x, Math.min(x, w.x + w.w));
        const ny = Math.max(w.y, Math.min(y, w.y + w.h));
        if ((x - nx) ** 2 + (y - ny) ** 2 < r * r) return true;
      }
      return false;
    }

    function initLvl(n, resetTot) {
      lvl = n;
      pts = 0;
      if (resetTot) tot = 0;
      turn = 0;
      snakes = [makeSnake(W / 2, H * 0.8, -Math.PI / 2, 12, 152, true)];
      walls = lvl > 1 ? [
        { x: 38, y: 120, w: 68, h: 12 },
        { x: W - 106, y: 205, w: 68, h: 12 }
      ] : [];
      skulls = [];
      const cnt = diffs[dIdx].skulls + Math.min(3, lvl - 1);
      for (let i = 0; i < cnt; i++) {
        const sx = 45 + ((i * 80) % (W - 90));
        const sy = 75 + i * 55;
        skulls.push({ x: sx, y: sy, minY: Math.max(24, sy - 35), maxY: Math.min(H - 24, sy + 35), dir: i % 2 ? -1 : 1, mov: lvl >= 4, r: 8.5 });
      }
      food.x = 30 + Math.random() * (W - 60);
      food.y = 30 + Math.random() * (H - 60);
      saveRec();
      tLvl.textContent = "Nivel " + lvl;
      tPts.textContent = "Puntos: " + pts + " / 300";
    }

    function goPlay() {
      mStart.classList.remove("on");
      mCfg.classList.remove("on");
      state = "play";
      playFx(440, 0.1, "triangle", 660);
      initLvl(1, true);
    }

    function goCfg() {
      mStart.classList.remove("on");
      mCfg.classList.add("on");
      state = "cfg";
      playFx(620, 0.05);
    }
alert("Funciona");
    document.getElementById("b-play").onclick = goPlay;
    document.getElementById("b-cfg").onclick = goCfg;
    document.getElementById("b-cfg-top").onclick = goCfg;
    document.getElementById("b-done").onclick = () => {
      mCfg.classList.remove("on");
      if (tot === 0 && pts === 0) {
        mStart.classList.add("on");
        state = "menu";
      } else {
        state = "play";
      }
    };

    document.getElementById("o-diff").onclick = (e) => {
      dIdx = (dIdx + 1) % diffs.length;
      e.target.textContent = "Dificultad: " + diffs[dIdx].label;
      initLvl(lvl, false);
    };
    document.getElementById("o-theme").onclick = (e) => {
      const dark = document.body.classList.toggle("dark");
      e.target.textContent = "Pantalla: " + (dark ? "Oscura" : "Clara");
    };
    document.getElementById("o-snd").onclick = (e) => {
      snd = !snd;
      e.target.textContent = "Sonido: " + (snd ? "Sí" : "No");
      if (snd) playFx(740, 0.07);
    };

    document.getElementById("b-left").onpointerdown = () => (turn = -1);
    document.getElementById("b-left").onpointerup = () => (turn = 0);
    document.getElementById("b-right").onpointerdown = () => (turn = 1);
    document.getElementById("b-right").onpointerup = () => (turn = 0);
    document.getElementById("b-split").onclick = () => {
      if (state === "over") { goPlay(); return; }
      if (state !== "play") return;
      const next = [];
      let splitOk = false;
      for (const s of snakes) {
        if (s.segs.length >= 8 && next.length + snakes.length <= 4) {
          const half = Math.floor(s.segs.length / 2);
          const part = s.segs.splice(half);
          next.push(s);
          next.push(makeSnake(part[0].x, part[0].y, s.ang + 0.7, part.length, (s.hue + 60) % 360, false));
          splitOk = true;
        } else next.push(s);
      }
      if (splitOk) { snakes = next; playFx(360, 0.11, "triangle", 720); }
    };

    c.onclick = () => { if (state === "over") goPlay(); };

    function step(dt) {
      if (state !== "play") return;
      const cfg = diffs[dIdx];
      const spd = cfg.spd + (lvl - 1) * 4;

      for (const sk of skulls) {
        if (sk.mov) {
          sk.y += sk.dir * cfg.move * dt;
          if (sk.y <= sk.minY) { sk.y = sk.minY; sk.dir = 1; }
          if (sk.y >= sk.maxY) { sk.y = sk.maxY; sk.dir = -1; }
        }
      }

      const alive = [];
      for (const s of snakes) {
        let dir = turn;
        if (!s.player) {
          s.aiT -= dt;
          if (s.aiT <= 0) { s.aiT = 0.45; s.aiD = Math.random() < 0.5 ? -1 : 1; }
          dir = s.aiD;
        }
        s.ang += dir * 3.0 * dt;
        const nx = s.segs[0].x + Math.cos(s.ang) * spd * dt;
        const ny = s.segs[0].y + Math.sin(s.ang) * spd * dt;

        const hitSk = skulls.some(sk => Math.hypot(nx - sk.x, ny - sk.y) < s.r + sk.r - 1);
        if (nx < s.r || nx > W - s.r || ny < s.r || ny > H - s.r || hitW(nx, ny, s.r) || hitSk) {
          if (s.player) {
            state = "over";
            saveRec();
            playFx(200, 0.22, "sawtooth", 65);
            return;
          }
          continue;
        }

        s.segs.unshift({ x: nx, y: ny });
        s.segs.pop();

        if (Math.hypot(nx - food.x, ny - food.y) < s.r + 7) {
          pts += 10;
          tot += 10;
          saveRec();
          playFx(587, 0.08, "sine", 880);
          const tail = s.segs[s.segs.length - 1];
          s.segs.push({ ...tail }, { ...tail });
          food.x = 28 + Math.random() * (W - 56);
          food.y = 28 + Math.random() * (H - 56);
          if (pts >= 300) {
            playFx(784, 0.16, "triangle");
            initLvl(lvl + 1, false);
            return;
          }
          tPts.textContent = "Puntos: " + pts + " / 300";
        }
        alive.push(s);
      }
      snakes = alive;
    }

    function render() {
      ctx.clearRect(0, 0, W, H);
      const dark = document.body.classList.contains("dark");

      ctx.fillStyle = dark ? "#475569" : "#64748b";
      for (const w of walls) ctx.fillRect(w.x, w.y, w.w, w.h);

      ctx.fillStyle = "#f59e0b";
      ctx.beginPath();
      ctx.arc(food.x, food.y, 6, 0, Math.PI * 2);
      ctx.fill();

      for (const sk of skulls) {
        ctx.fillStyle = "#ef4444";
        ctx.beginPath();
        ctx.arc(sk.x, sk.y, sk.r, 0, Math.PI * 2);
        ctx.fill();
      }

      for (const s of snakes) {
        for (let i = 0; i < s.segs.length; i++) {
          ctx.fillStyle = `hsl(${s.hue}, 82%, ${i === 0 ? 40 : 52}%)`;
          ctx.beginPath();
          ctx.arc(s.segs[i].x, s.segs[i].y, s.r * (1 - i / (s.segs.length * 2.4)), 0, Math.PI * 2);
          ctx.fill();
        }
      }

      if (state === "over") {
        ctx.fillStyle = dark ? "rgba(14,17,22,0.85)" : "rgba(241,245,249,0.88)";
        ctx.fillRect(0, 0, W, H);
        ctx.fillStyle = dark ? "#f8fafc" : "#0f172a";
        ctx.font = "bold 19px system-ui, sans-serif";
        ctx.textAlign = "center";
        ctx.fillText("¡Chocaste!", W / 2, H / 2 - 10);
        ctx.font = "13px system-ui, sans-serif";
        ctx.fillText("Toca aquí o en Dividir para reiniciar", W / 2, H / 2 + 16);
      }
    }

    function loop(t) {
      const dt = Math.min((t - prevT) / 1000 || 0.016, 0.05);
      prevT = t;
      step(dt);
      render();
      requestAnimationFrame(loop);
    }

    initLvl(1, true);
    requestAnimationFrame(loop);
  </script>
</body>
</html>
