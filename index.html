<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Snake Split</title>
<style>
* { box-sizing: border-box; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
body {
  margin: 0;
  min-height: 100vh;
  padding: 8px;
  background: linear-gradient(160deg, #dbeafe 0%, #f1f5f9 55%, #e2e8f0 100%);
  color: #0f172a;
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  touch-action: manipulation;
}
body.dark {
  background: linear-gradient(160deg, #090d16 0%, #111827 60%, #0b1120 100%);
  color: #f8fafc;
}
.bar {
  width: 100%;
  max-width: 440px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 6px;
  margin-bottom: 8px;
  font-size: 13.5px;
  font-weight: 800;
}
.pill {
  background: #ffffff;
  color: #0369a1;
  border: 2px solid #0284c7;
  border-radius: 999px;
  padding: 6px 12px;
  box-shadow: 0 3px 0 rgba(2, 132, 199, 0.22);
}
body.dark .pill {
  background: #172033;
  color: #38bdf8;
  border-color: #38bdf8;
}
#box {
  position: relative;
  width: 100%;
  max-width: 440px;
  height: 410px;
  border-radius: 18px;
  overflow: hidden;
  border: 3px solid #0284c7;
  background-color: #f0f9ff;
  background-image:
    linear-gradient(to right, rgba(2, 132, 199, 0.11) 1px, transparent 1px),
    linear-gradient(to bottom, rgba(2, 132, 199, 0.11) 1px, transparent 1px);
  background-size: 22px 22px;
  box-shadow: 0 10px 24px rgba(15, 23, 42, 0.18);
}
body.dark #box {
  background-color: #0b1120;
  background-image:
    linear-gradient(to right, rgba(56, 189, 248, 0.11) 1px, transparent 1px),
    linear-gradient(to bottom, rgba(56, 189, 248, 0.11) 1px, transparent 1px);
  background-size: 22px 22px;
  border-color: #38bdf8;
}
#stage {
  position: relative;
  width: 100%;
  height: 100%;
}
.ent {
  position: absolute;
  transform: translate(-50%, -50%);
  pointer-events: none;
}
.seg {
  border-radius: 50%;
  border: 1.5px solid #064e3b;
}
.head {
  border-radius: 50%;
  border: 2px solid #064e3b;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 8.5px;
  font-weight: 900;
  color: #0f172a;
}
.food {
  border-radius: 50%;
  border: 1.5px solid #0f172a;
}
.skull {
  border-radius: 50%;
  background: #ffffff;
  border: 2px solid #ef4444;
  color: #0f172a;
  font-size: 11.5px;
  font-weight: 900;
  display: flex;
  align-items: center;
  justify-content: center;
}
.wall {
  position: absolute;
  background: #334155;
  border: 1.5px solid #0f172a;
  border-radius: 4px;
  pointer-events: none;
}
body.dark .wall {
  background: #475569;
  border-color: #94a3b8;
}
.portal {
  border-radius: 50%;
  border: 2.5px dashed #a855f7;
  background: rgba(15, 23, 42, 0.85);
  box-shadow: 0 0 8px rgba(168, 85, 247, 0.7);
}
.fire {
  border-radius: 50%;
  background: radial-gradient(circle, #fef08a 15%, #f97316 55%, #ef4444 100%);
  box-shadow: 0 0 8px #ef4444;
}
#overlay {
  position: absolute;
  left: 16px;
  right: 16px;
  top: 18px;
  padding: 10px 14px;
  border-radius: 14px;
  text-align: center;
  background: rgba(255, 255, 255, 0.84);
  border: 2px solid #0284c7;
  z-index: 5;
  cursor: pointer;
}
body.dark #overlay {
  background: rgba(15, 23, 42, 0.84);
  border-color: #38bdf8;
}
#ov-title {
  font-size: 20px;
  font-weight: 900;
  color: #0369a1;
}
body.dark #ov-title { color: #38bdf8; }
#ov-sub {
  margin-top: 2px;
  font-size: 12.5px;
  font-weight: 800;
  color: #0f172a;
}
body.dark #ov-sub { color: #e2e8f0; }
#cfg-panel {
  display: none;
  width: 100%;
  max-width: 440px;
  margin-top: 8px;
  padding: 10px;
  border-radius: 14px;
  background: #ffffff;
  border: 2px solid #cbd5e1;
  gap: 6px;
  flex-wrap: wrap;
  justify-content: center;
}
body.dark #cfg-panel { background: #172033; border-color: #334155; }
#cfg-panel.open { display: flex; }
.pads {
  width: 100%;
  max-width: 440px;
  margin-top: 10px;
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
}
button {
  border: 2px solid #94a3b8;
  background: #ffffff;
  color: #0f172a;
  border-radius: 12px;
  padding: 11px;
  font-weight: 800;
  font-size: 13.5px;
  cursor: pointer;
  touch-action: manipulation;
  box-shadow: 0 3px 0 #cbd5e1;
}
button:active { transform: translateY(2px); }
body.dark button {
  background: #172033;
  color: #f8fafc;
  border-color: #334155;
  box-shadow: 0 3px 0 #0f172a;
}
.main {
  background: linear-gradient(180deg, #0ea5e9 0%, #0284c7 100%);
  color: #ffffff;
  border-color: #0369a1;
  box-shadow: 0 3px 0 #0369a1;
}
</style>
</head>
<body>
  <div class="bar">
    <span class="pill" id="t-lvl">Nivel 1 / 100</span>
    <span class="pill" id="t-pts">0 / 300</span>
    <div style="display:flex;gap:6px;">
      <button type="button" id="b-pause">Pausa</button>
      <button type="button" id="b-cfg">Ajustes</button>
    </div>
  </div>

  <div id="box">
    <div id="stage"></div>
    <div id="overlay">
      <div id="ov-title">SNAKE SPLIT</div>
      <div id="ov-sub">Toca Jugar · 100 Niveles</div>
    </div>
  </div>

  <div id="cfg-panel">
    <button type="button" id="o-diff">Dificultad: Estándar</button>
    <button type="button" id="o-theme">Pantalla: Clara</button>
    <button type="button" id="o-snd">Sonido: Sí</button>
  </div>

  <div class="pads">
    <button type="button" id="b-left">◀ Izq</button>
    <button type="button" class="main" id="b-center">▶ Jugar</button>
    <button type="button" id="b-right">Der ▶</button>
  </div>

  <script>
    var MAX_LVL = 100;
    var W = 360, H = 410;
    var box = document.getElementById("box");
    var stage = document.getElementById("stage");
    var tLvl = document.getElementById("t-lvl");
    var tPts = document.getElementById("t-pts");
    var bPause = document.getElementById("b-pause");
    var bCenter = document.getElementById("b-center");
    var cfgPanel = document.getElementById("cfg-panel");
    var overlay = document.getElementById("overlay");
    var ovTitle = document.getElementById("ov-title");
    var ovSub = document.getElementById("ov-sub");

    var diffs = [
      { label: "Tranquila", spd: 54, skulls: 1, move: 24 },
      { label: "Estándar", spd: 70, skulls: 2, move: 36 },
      { label: "Extrema", spd: 86, skulls: 3, move: 52 }
    ];

    var dIdx = 1, snd = true, best = 0, bestLvl = 1;
    try {
      best = Number(localStorage.getItem("ss_rec")) || 0;
      bestLvl = Math.min(MAX_LVL, Number(localStorage.getItem("ss_lvl")) || 1);
    } catch (e) {}

    var mode = "demo";
    var lvl = 1, pts = 0, tot = 0;
    var snakes = [], walls = [], skulls = [], foods = [], fireballs = [], portals = [];
    var turn = 0, audio = null, raider = null, raiderCd = 6.5, portalCd = 3.5;

    function syncStageSize() {
      W = box.clientWidth || 360;
      H = box.clientHeight || 410;
    }

    function dist(x1, y1, x2, y2) {
      var dx = x1 - x2, dy = y1 - y2;
      return Math.sqrt(dx * dx + dy * dy);
    }

    function getRaiderLevel() {
      return Math.min(25, 1 + Math.floor((lvl - 1) / 4));
    }

    function saveRec() {
      if (tot > best) best = tot;
      if (lvl > bestLvl) bestLvl = Math.min(MAX_LVL, lvl);
      try {
        localStorage.setItem("ss_rec", String(best));
        localStorage.setItem("ss_lvl", String(bestLvl));
      } catch (e) {}
    }

    function ensureAudio() {
      if (!snd) return null;
      try {
        var A = window.AudioContext || window.webkitAudioContext;
        if (!A) return null;
        if (!audio) audio = new A();
        if (audio.state === "suspended") audio.resume();
        return audio;
      } catch (e) { return null; }
    }

    function tone(a, t, f, d, w, v, e) {
      var o = a.createOscillator(), g = a.createGain();
      o.type = w || "triangle";
      o.frequency.setValueAtTime(f, t);
      if (e) o.frequency.exponentialRampToValueAtTime(e, t + d);
      g.gain.setValueAtTime(0.001, t);
      g.gain.linearRampToValueAtTime(v || 0.14, t + 0.012);
      g.gain.exponentialRampToValueAtTime(0.001, t + d);
      o.connect(g);
      g.connect(a.destination);
      o.start(t);
      o.stop(t + d + 0.02);
    }

    function playSound(k, rLvl) {
      if (!snd) return;
      var a = ensureAudio();
      if (!a) return;
      try {
        var t = a.currentTime;
        if (k === "eat") {
          tone(a, t, 523.25, 0.07, "triangle", 0.14, 659.25);
          tone(a, t + 0.055, 783.99, 0.08, "sine", 0.13, 1046.5);
        } else if (k === "star") {
          tone(a, t, 587.33, 0.07, "triangle", 0.15, 783.99);
          tone(a, t + 0.055, 880, 0.07, "triangle", 0.15, 1046.5);
          tone(a, t + 0.11, 1174.66, 0.11, "sine", 0.14, 1567.98);
        } else if (k === "split") {
          tone(a, t, 330, 0.08, "triangle", 0.14, 554.37);
          tone(a, t + 0.06, 440, 0.1, "sine", 0.13, 659.25);
        } else if (k === "start") {
          tone(a, t, 392, 0.08, "triangle", 0.14, 523.25);
          tone(a, t + 0.07, 523.25, 0.11, "triangle", 0.14, 783.99);
        } else if (k === "level") {
          tone(a, t, 523.25, 0.09, "triangle", 0.15, 523.25);
          tone(a, t + 0.08, 659.25, 0.09, "triangle", 0.15, 659.25);
          tone(a, t + 0.16, 783.99, 0.1, "triangle", 0.15, 783.99);
          tone(a, t + 0.25, 1046.5, 0.18, "sine", 0.16, 1318.5);
        } else if (k === "alert") {
          var boost = Math.min(240, ((rLvl || 1) - 1) * 14);
          tone(a, t, 440 + boost, 0.06, "sawtooth", 0.1, 587 + boost);
          tone(a, t + 0.08, 440 + boost, 0.06, "sawtooth", 0.1, 587 + boost);
        } else if (k === "fire") {
          tone(a, t, 360, 0.08, "sawtooth", 0.1, 140);
        } else if (k === "warp") {
          tone(a, t, 240, 0.11, "sine", 0.14, 720);
          tone(a, t + 0.05, 480, 0.11, "triangle", 0.12, 960);
        } else if (k === "hit") {
          tone(a, t, 220, 0.14, "sawtooth", 0.15, 98);
          tone(a, t + 0.1, 130.81, 0.2, "triangle", 0.15, 65.41);
        } else if (k === "click") {
          tone(a, t, 660, 0.05, "sine", 0.1, 784);
        }
      } catch (e) {}
    }

    function makeSnake(x, y, ang, len, color, player) {
      var segs = [];
      for (var i = 0; i < len; i++) {
        segs.push({ x: x - Math.cos(ang) * i * 5, y: y - Math.sin(ang) * i * 5 });
      }
      return { segs: segs, ang: ang, color: color, player: player, r: 7.5, warpCd: 0 };
    }

    function hitWall(x, y, r) {
      for (var i = 0; i < walls.length; i++) {
        var w = walls[i];
        var nx = Math.max(w.x, Math.min(x, w.x + w.w));
        var ny = Math.max(w.y, Math.min(y, w.y + w.h));
        if (dist(x, y, nx, ny) < r) return true;
      }
      return false;
    }

    function safeSpot(x, y, sw) {
      if (dist(x, y, W * 0.5, H * 0.72) < 55) return false;
      for (var s = -1; s <= 1; s++) {
        if (hitWall(x, y + s * (sw || 0), 15)) return false;
      }
      for (var i = 0; i < skulls.length; i++) {
        if (dist(x, y, skulls[i].x, skulls[i].y) < 34) return false;
      }
      return true;
    }

    function pickPortalSpot(other) {
      for (var i = 0; i < 45; i++) {
        var x = 36 + Math.random() * Math.max(40, W - 72);
        var y = 75 + Math.random() * Math.max(40, H - 110);
        if (!safeSpot(x, y, 0)) continue;
        if (other && dist(x, y, other.x, other.y) < 115) continue;
        return { x: x, y: y };
      }
      return { x: other ? W - 45 : 45, y: H * 0.55 };
    }

    function spawnPortals() {
      var a = pickPortalSpot(null);
      var b = pickPortalSpot(a);
      portals = [
        { x: a.x, y: a.y, r: 13.5, life: 9.5, color: "#a855f7" },
        { x: b.x, y: b.y, r: 13.5, life: 9.5, color: "#06b6d4" }
      ];
      if (mode === "play") playSound("warp");
    }

    function updatePortals(dt) {
      if (portals.length < 2) {
        portalCd -= dt;
        if (portalCd <= 0) spawnPortals();
        return;
      }
      portals[0].life -= dt;
      portals[1].life -= dt;
      if (portals[0].life <= 0) {
        portals = [];
        portalCd = Math.max(4.5, 8.5 - lvl * 0.04);
      }
    }

    function addFood() {
      var r = Math.random();
      var kind = r < 0.6 ? "berry" : (r < 0.88 ? "citrus" : "star");
      var x = W * 0.5, y = H * 0.45;
      for (var i = 0; i < 40; i++) {
        var tx = 28 + Math.random() * Math.max(40, W - 56);
        var ty = 72 + Math.random() * Math.max(40, H - 102);
        if (safeSpot(tx, ty, 0)) { x = tx; y = ty; break; }
      }
      foods.push({
        x: x, y: y, kind: kind,
        val: kind === "star" ? 40 : (kind === "citrus" ? 20 : 10),
        grow: kind === "star" ? 3 : 2,
        rad: kind === "star" ? 7.5 : 6.5
      });
    }

    function spawnRaider() {
      var rLvl = getRaiderLevel();
      var fromL = Math.random() < 0.5;
      var sx = fromL ? -14 : W + 14;
      var sy = 95 + Math.random() * Math.max(40, H - 150);
      var ang = fromL ? 0 : Math.PI;
      var segs = [];
      for (var i = 0; i < 12; i++) {
        segs.push({ x: sx - Math.cos(ang) * i * 5, y: sy });
      }
      raider = {
        segs: segs, ang: ang, color: "#f43f5e", r: 7.5,
        rLvl: rLvl, warn: 1.0, dir: fromL ? 1 : -1,
        laneY: sy, phase: "in",
        shotCd: Math.max(0.55, 1.35 - (rLvl - 1) * 0.045)
      };
      playSound("alert", rLvl);
    }

    function shootFireball(x, y, ang, spd, rLvl) {
      var ballSpeed = spd * (1.85 + Math.min(1.1, (rLvl - 1) * 0.06));
      fireballs.push({
        x: x + Math.cos(ang) * 11,
        y: y + Math.sin(ang) * 11,
        vx: Math.cos(ang) * ballSpeed,
        vy: Math.sin(ang) * ballSpeed,
        r: 5.5
      });
      if (mode === "play") playSound("fire");
    }

    function syncOverlay() {
      if (mode === "play") {
        overlay.style.display = "none";
      } else {
        overlay.style.display = "block";
        if (mode === "demo") {
          ovTitle.textContent = "SNAKE SPLIT";
          ovSub.textContent = "Récord: " + best + " pts · Toca Jugar";
        } else if (mode === "pause") {
          ovTitle.textContent = "EN PAUSA";
          ovSub.textContent = "Toca Seguir para continuar";
        } else if (mode === "clear") {
          ovTitle.textContent = "¡NIVEL " + lvl + " LISTO!";
          ovSub.textContent = "Toca Otro Nivel para continuar";
        } else if (mode === "win") {
          ovTitle.textContent = "¡CAMPEÓN 100/100!";
          ovSub.textContent = "Récord: " + best + " pts · Toca Reiniciar";
        } else {
          ovTitle.textContent = "¡CHOCASTE!";
          ovSub.textContent = "Toca Reiniciar para jugar de nuevo";
        }
      }
      if (mode === "demo") bCenter.textContent = "▶ Jugar";
      else if (mode === "play") bCenter.textContent = "✂ Dividir";
      else if (mode === "pause") bCenter.textContent = "▶ Seguir";
      else if (mode === "clear") bCenter.textContent = "▶ Otro Nivel";
      else bCenter.textContent = "↻ Reiniciar";
    }

    function initLvl(n, resetTot) {
      syncStageSize();
      lvl = Math.min(MAX_LVL, n);
      pts = 0;
      if (resetTot) tot = 0;
      turn = 0;
      raider = null;
      fireballs = [];
      portals = [];
      portalCd = 3.5;
      raiderCd = Math.max(3.5, 8.5 - getRaiderLevel() * 0.25);
      bPause.textContent = "Pausa";
      snakes = [makeSnake(W * 0.5, H * 0.72, -Math.PI * 0.5, 12, "#10b981", true)];
      walls = lvl > 1 ? [
        { x: 40, y: 145, w: 80, h: 13 },
        { x: Math.max(40, W - 120), y: 250, w: 80, h: 13 }
      ] : [];
      skulls = [];
      var cnt = Math.min(5, diffs[dIdx].skulls + Math.floor((lvl - 1) / 2));
      var mov = lvl >= 4;
      var sw = mov ? 38 : 0;
      var tr = 0;
      while (skulls.length < cnt && tr < 140) {
        tr++;
        var sx = 36 + Math.random() * Math.max(40, W - 72);
        var sy = 80 + sw + Math.random() * Math.max(20, H - 125 - sw * 2);
        if (safeSpot(sx, sy, sw)) {
          skulls.push({
            x: sx, y: sy,
            minY: Math.max(74, sy - sw),
            maxY: Math.min(H - 28, sy + sw),
            dir: Math.random() < 0.5 ? -1 : 1,
            mov: mov, r: 9.5
          });
        }
      }
      foods = [];
      for (var i = 0; i < 5; i++) addFood();
      saveRec();
      tLvl.textContent = "Nivel " + lvl + " / " + MAX_LVL;
      tPts.textContent = pts + " / 300";
      syncOverlay();
    }

    function startGame() {
      ensureAudio();
      cfgPanel.classList.remove("open");
      mode = "play";
      initLvl(1, true);
      playSound("start");
    }

    function togglePause() {
      ensureAudio();
      if (mode === "play") {
        mode = "pause";
        turn = 0;
        bPause.textContent = "Seguir";
        syncOverlay();
        playSound("click");
      } else if (mode === "pause") {
        mode = "play";
        bPause.textContent = "Pausa";
        syncOverlay();
        playSound("click");
      }
    }

    function norm(a) {
      while (a > Math.PI) a -= Math.PI * 2;
      while (a < -Math.PI) a += Math.PI * 2;
      return a;
    }

    function safeAng(x, y, a, r, dMax) {
      for (var d = 10; d <= dMax; d += 8) {
        var px = x + Math.cos(a) * d;
        var py = y + Math.sin(a) * d;
        if (px < r + 14 || px > W - r - 14 || py < r + 14 || py > H - r - 14 || hitWall(px, py, r + 7)) return false;
        for (var i = 0; i < skulls.length; i++) {
          if (dist(px, py, skulls[i].x, skulls[i].y) < skulls[i].r + r + 13) return false;
        }
      }
      return true;
    }

    function pickAng(x, y, pref, r) {
      var list = [pref, Math.atan2(H * 0.5 - y, W * 0.5 - x), 0, Math.PI, -Math.PI * 0.5, Math.PI * 0.5, 0.5, -0.5, 2.6, -2.6];
      for (var i = 0; i < list.length; i++) {
        var a = norm(list[i]);
        if (safeAng(x, y, a, r, 42)) return a;
      }
      return norm(pref);
    }

    function splitSnakes() {
      var next = [];
      var ok = false;
      var extraCols = ["#38bdf8", "#f59e0b", "#a855f7"];
      for (var i = 0; i < snakes.length; i++) {
        var s = snakes[i];
        if (s.segs.length >= 8 && next.length + snakes.length <= 4) {
          var part = s.segs.splice(Math.floor(s.segs.length / 2));
          next.push(s);
          next.push(makeSnake(part[0].x, part[0].y, pickAng(part[0].x, part[0].y, s.ang + Math.PI * 0.5, s.r), part.length, extraCols[next.length % extraCols.length], false));
          ok = true;
        } else {
          next.push(s);
        }
      }
      if (ok) { snakes = next; playSound("split"); }
    }

    function handleCenterAction() {
      ensureAudio();
      if (mode === "demo" || mode === "over" || mode === "win") {
        startGame();
      } else if (mode === "pause") {
        togglePause();
      } else if (mode === "clear") {
        mode = "play";
        initLvl(lvl + 1, false);
        playSound("start");
      } else if (mode === "play") {
        splitSnakes();
      }
    }

    function aiTurn(s) {
      var h = s.segs[0];
      var tg = null, bs = 999999;
      for (var i = 0; i < foods.length; i++) {
        var f = foods[i];
        var sc = dist(f.x, f.y, h.x, h.y) * (f.kind === "star" ? 0.65 : (f.kind === "citrus" ? 0.85 : 1));
        if (sc < bs) { bs = sc; tg = f; }
      }
      var des = tg ? Math.atan2(tg.y - h.y, tg.x - h.x) : Math.atan2(H * 0.5 - h.y, W * 0.5 - h.x);
      if (!safeAng(h.x, h.y, des, s.r, 34)) {
        var ok = false;
        for (var o = 0.35; o <= Math.PI; o += 0.35) {
          var l = norm(des - o), r = norm(des + o);
          if (safeAng(h.x, h.y, l, s.r, 34)) { des = l; ok = true; break; }
          if (safeAng(h.x, h.y, r, s.r, 34)) { des = r; ok = true; break; }
        }
        if (!ok) des = Math.atan2(H * 0.5 - h.y, W * 0.5 - h.x);
      }
      var df = norm(des - s.ang);
      return Math.abs(df) < 0.06 ? 0 : (df > 0 ? 1 : -1);
    }

    function killPlayer() {
      mode = "over";
      saveRec();
      syncOverlay();
      playSound("hit");
    }

    function updateFireballs(dt) {
      var next = [];
      for (var i = 0; i < fireballs.length; i++) {
        var b = fireballs[i];
        b.x += b.vx * dt;
        b.y += b.vy * dt;
        if (b.x < -12 || b.x > W + 12 || b.y < -12 || b.y > H + 12 || hitWall(b.x, b.y, b.r)) continue;
        var hit = false;
        for (var si = 0; si < snakes.length; si++) {
          var s = snakes[si];
          if (!s.player) continue;
          for (var ki = 0; ki < s.segs.length; ki++) {
            if (dist(b.x, b.y, s.segs[ki].x, s.segs[ki].y) < b.r + s.r - 1.5) {
              hit = true;
              break;
            }
          }
          if (hit) break;
        }
        if (hit) { killPlayer(); return true; }
        next.push(b);
      }
      fireballs = next;
      return false;
    }

    function updateRaider(dt, spd) {
      if (!raider) { raiderCd -= dt; if (raiderCd <= 0) spawnRaider(); return false; }
      if (raider.warn > 0) { raider.warn -= dt; return false; }
      var rLvl = raider.rLvl || 1;
      var rs = spd * (1.22 + Math.min(0.65, (rLvl - 1) * 0.035));
      var h = raider.segs[0];
      var nx = h.x, ny = h.y;
      if (raider.phase === "in") {
        raider.ang = raider.dir > 0 ? 0 : Math.PI;
        nx = h.x + raider.dir * rs * dt;
        if ((raider.dir > 0 && nx >= W - 28) || (raider.dir < 0 && nx <= 28)) {
          raider.phase = "loop";
          raider.rad = Math.max(42, 58 - (rLvl - 1) * 0.7);
          raider.cx = Math.min(W - 78, Math.max(78, nx - raider.dir * raider.rad));
          raider.cy = Math.min(H - 78, Math.max(95, ny));
          raider.la = Math.atan2(ny - raider.cy, nx - raider.cx);
          raider.sa = raider.la;
        }
      } else if (raider.phase === "loop") {
        raider.la += (rs / raider.rad) * raider.dir * dt;
        nx = raider.cx + Math.cos(raider.la) * raider.rad;
        ny = raider.cy + Math.sin(raider.la) * raider.rad;
        raider.ang = norm(raider.la + (raider.dir > 0 ? Math.PI * 0.5 : -Math.PI * 0.5));
        if (Math.abs(raider.la - raider.sa) >= Math.PI * 4) {
          raider.phase = "out";
          raider.ang = raider.dir > 0 ? 0 : Math.PI;
        }
      } else {
        raider.ang = raider.dir > 0 ? 0 : Math.PI;
        nx = h.x + raider.dir * rs * dt;
        if (nx < -36 || nx > W + 36) {
          raider = null;
          raiderCd = Math.max(3.5, 8.5 - getRaiderLevel() * 0.25);
          return false;
        }
      }
      raider.segs.unshift({ x: nx, y: ny });
      raider.segs.pop();

      if (nx > 12 && nx < W - 12 && ny > 12 && ny < H - 12) {
        raider.shotCd -= dt;
        if (raider.shotCd <= 0) {
          raider.shotCd = Math.max(0.55, 1.35 - (rLvl - 1) * 0.045);
          shootFireball(nx, ny, raider.ang, spd, rLvl);
        }
      }

      for (var si = 0; si < snakes.length; si++) {
        var s = snakes[si];
        if (!s.player) continue;
        var ph = s.segs[0];
        for (var k = 0; k < raider.segs.length; k++) {
          if (dist(ph.x, ph.y, raider.segs[k].x, raider.segs[k].y) < s.r + (k === 0 ? raider.r : raider.r * 0.82) - 1) {
            killPlayer();
            return true;
          }
        }
      }
      return false;
    }

    function step(dt) {
      if (mode !== "play" && mode !== "demo") return;
      syncStageSize();
      var cfg = diffs[dIdx], spd = cfg.spd + (lvl - 1) * 4;
      updatePortals(dt);
      if (mode === "play" && (updateRaider(dt, spd) || updateFireballs(dt))) return;
      for (var ski = 0; ski < skulls.length; ski++) {
        var sk = skulls[ski];
        if (sk.mov) {
          sk.y += sk.dir * cfg.move * dt;
          if (sk.y <= sk.minY) { sk.y = sk.minY; sk.dir = 1; }
          if (sk.y >= sk.maxY) { sk.y = sk.maxY; sk.dir = -1; }
        }
      }
      var alive = [];
      for (var si = 0; si < snakes.length; si++) {
        var s = snakes[si];
        if (s.warpCd > 0) s.warpCd -= dt;
        var isAuto = mode === "demo" || !s.player;
        var dir = isAuto ? aiTurn(s) : turn;
        s.ang = norm(s.ang + dir * (isAuto ? 4.2 : 3.1) * dt);
        var nx = s.segs[0].x + Math.cos(s.ang) * spd * dt;
        var ny = s.segs[0].y + Math.sin(s.ang) * spd * dt;

        if (portals.length === 2 && (!s.warpCd || s.warpCd <= 0)) {
          for (var pi = 0; pi < 2; pi++) {
            var p = portals[pi];
            if (dist(nx, ny, p.x, p.y) < s.r + p.r - 2) {
              var out = portals[1 - pi];
              var dx = out.x - nx, dy = out.y - ny;
              nx = out.x + Math.cos(s.ang) * (out.r + s.r + 3);
              ny = out.y + Math.sin(s.ang) * (out.r + s.r + 3);
              for (var k = 1; k < s.segs.length; k++) {
                s.segs[k].x += dx;
                s.segs[k].y += dy;
              }
              s.warpCd = 1.1;
              if (mode === "play") playSound("warp");
              break;
            }
          }
        }

        var hitSk = false;
        for (var j = 0; j < skulls.length; j++) {
          if (dist(nx, ny, skulls[j].x, skulls[j].y) < s.r + skulls[j].r - 1) {
            hitSk = true;
            break;
          }
        }
        if (nx < s.r || nx > W - s.r || ny < s.r || ny > H - s.r || hitWall(nx, ny, s.r) || hitSk) {
          if (mode === "demo") { initLvl(1, true); return; }
          if (s.player) { killPlayer(); return; }
          continue;
        }
        s.segs.unshift({ x: nx, y: ny });
        s.segs.pop();
        for (var fi = foods.length - 1; fi >= 0; fi--) {
          var f = foods[fi];
          if (dist(nx, ny, f.x, f.y) < s.r + f.rad + 2) {
            foods.splice(fi, 1);
            addFood();
            if (mode === "play") {
              pts += f.val;
              tot += f.val;
              saveRec();
              playSound(f.kind === "star" ? "star" : "eat");
              var tl = s.segs[s.segs.length - 1];
              for (var g = 0; g < f.grow; g++) s.segs.push({ x: tl.x, y: tl.y });
              tPts.textContent = pts + " / 300";
              if (pts >= 300) {
                saveRec();
                playSound("level");
                mode = lvl >= MAX_LVL ? "win" : "clear";
                syncOverlay();
                return;
              }
            }
          }
        }
        alive.push(s);
      }
      snakes = alive;
    }

    function addEl(cls, x, y, w, h, bg, borderCol, txt) {
      var d = document.createElement("div");
      d.className = cls;
      d.style.left = x + "px";
      d.style.top = y + "px";
      if (w) d.style.width = w + "px";
      if (h) d.style.height = h + "px";
      if (bg) d.style.background = bg;
      if (borderCol) d.style.borderColor = borderCol;
      if (txt) d.textContent = txt;
      stage.appendChild(d);
    }

    function renderSnakeDOM(s) {
      if (!s || !s.segs || !s.segs.length) return;
      for (var i = s.segs.length - 1; i >= 1; i--) {
        var p = s.segs[i];
        var rt = i / s.segs.length;
        var sz = Math.max(6.5, Math.round(s.r * 2 * (1.02 - rt * 0.65)));
        addEl("ent seg", p.x, p.y, sz, sz, s.color, "", "");
      }
      var h = s.segs[0];
      var hsz = Math.round(s.r * 2.2);
      addEl("ent head", h.x, h.y, hsz, hsz, s.color, "", "••");
      if (s.rLvl) {
        addEl("ent", h.x, h.y - 16, 0, 0, "", "", "Nv." + s.rLvl);
      }
    }

    function render() {
      stage.innerHTML = "";
      for (var wi = 0; wi < walls.length; wi++) {
        var w = walls[wi];
        addEl("wall", w.x, w.y, w.w, w.h, "", "", "");
      }
      for (var pi = 0; pi < portals.length; pi++) {
        var p = portals[pi];
        addEl("ent portal", p.x, p.y, p.r * 2, p.r * 2, "", p.color, "");
      }
      for (var fi = 0; fi < foods.length; fi++) {
        var f = foods[fi];
        var col = f.kind === "star" ? "#f59e0b" : (f.kind === "citrus" ? "#fb923c" : "#ef4444");
        var sz = f.rad * 2;
        addEl("ent food", f.x, f.y, sz, sz, col, "", "");
      }
      for (var ski = 0; ski < skulls.length; ski++) {
        var sk = skulls[ski];
        addEl("ent skull", sk.x, sk.y, sk.r * 2, sk.r * 2, "", "", "☠");
      }
      for (var si = 0; si < snakes.length; si++) renderSnakeDOM(snakes[si]);
      for (var bi = 0; bi < fireballs.length; bi++) {
        var b = fireballs[bi];
        addEl("ent fire", b.x, b.y, b.r * 2, b.r * 2, "", "", "");
      }
      if (raider) {
        if (raider.warn > 0) {
          var wx = raider.dir > 0 ? 16 : W - 16;
          addEl("ent skull", wx, raider.laneY, 21, 21, "#ef4444", "#0f172a", "!");
        } else {
          renderSnakeDOM(raider);
        }
      }
    }

    function onTap(el, fn) {
      var lock = 0;
      var fire = function () {
        var now = Date.now();
        if (now - lock < 220) return;
        lock = now;
        fn();
      };
      el.addEventListener("touchstart", fire, { passive: true });
      el.addEventListener("click", fire);
    }

    onTap(bCenter, handleCenterAction);
    onTap(bPause, togglePause);
    onTap(overlay, function () { if (mode !== "play") handleCenterAction(); });
    onTap(document.getElementById("b-cfg"), function () {
      ensureAudio();
      cfgPanel.classList.toggle("open");
      playSound("click");
    });
    onTap(document.getElementById("o-diff"), function () {
      dIdx = (dIdx + 1) % diffs.length;
      document.getElementById("o-diff").textContent = "Dificultad: " + diffs[dIdx].label;
      if (mode === "play") initLvl(lvl, false);
    });
    onTap(document.getElementById("o-theme"), function () {
      var d = document.body.classList.toggle("dark");
      document.getElementById("o-theme").textContent = "Pantalla: " + (d ? "Oscura" : "Clara");
    });
    onTap(document.getElementById("o-snd"), function () {
      snd = !snd;
      document.getElementById("o-snd").textContent = "Sonido: " + (snd ? "Sí" : "No");
      if (snd) playSound("click");
    });

    var bL = document.getElementById("b-left");
    var bR = document.getElementById("b-right");
    bL.addEventListener("touchstart", function () { ensureAudio(); turn = -1; }, { passive: true });
    bL.addEventListener("touchend", function () { turn = 0; }, { passive: true });
    bL.addEventListener("mousedown", function () { ensureAudio(); turn = -1; });
    bL.addEventListener("mouseup", function () { turn = 0; });

    bR.addEventListener("touchstart", function () { ensureAudio(); turn = 1; }, { passive: true });
    bR.addEventListener("touchend", function () { turn = 0; }, { passive: true });
    bR.addEventListener("mousedown", function () { ensureAudio(); turn = 1; });
    bR.addEventListener("mouseup", function () { turn = 0; });

    initLvl(1, true);
    render();
    setInterval(function () {
      step(0.03);
      render();
    }, 30);
  </script>
</body>
</html>
