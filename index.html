<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Snake Split Arena</title>
    <style>
        * { box-sizing: border-box; touch-action: none; -webkit-tap-highlight-color: transparent; }
        body, html { 
            margin: 0; padding: 0; 
            background-color: #050508; color: #fff; 
            font-family: Arial, sans-serif; 
            overflow: hidden; width: 100vw; height: 100vh; 
            display: flex; flex-direction: column; align-items: center; justify-content: space-between;
        }
        
        /* ENCABEZADO CON PAUSA Y PUNTOS */
        #ui-header {
            width: 100%; height: 55px; display: flex; 
            justify-content: space-between; align-items: center; background: #0a0a12;
            border-bottom: 2px solid #ff0055; flex-shrink: 0; padding: 0 15px; z-index: 10;
        }
        #header-info { display: flex; flex-direction: column; align-items: flex-start; }
        #title { font-size: 13px; font-weight: bold; color: #ff0055; margin: 0; }
        #scores { font-size: 11px; font-weight: bold; margin-top: 2px; display: flex; gap: 10px; }
        #score-val { color: #00ffcc; }
        #target-val { color: #ff00ff; }
        #high-val { color: #ffcc00; }

        /* BOTÓN DE PAUSA */
        #pause-btn {
            background: rgba(255, 0, 85, 0.2); border: 2px solid #ff0055;
            color: #ff0055; border-radius: 8px; font-size: 18px; font-weight: bold;
            padding: 6px 14px; cursor: pointer;
        }
        #pause-btn:active { background: rgba(255, 0, 85, 0.6); color: #fff; }

        /* CANCHA LIMITADA EN ALTURA PARA DEJAR ESPACIO LIBRE ABAJO */
        #canvas-area {
            width: 100%; flex-grow: 1; display: flex; 
            justify-content: center; align-items: center;
            padding: 5px; max-height: calc(100vh - 220px);
        }
        canvas { 
            border: 3px solid #ff0055; 
            box-shadow: 0 0 15px rgba(255, 0, 85, 0.5); 
            border-radius: 8px;
            background: #000005;
            display: block;
        }

        /* VENTANA DE PAUSA / CONFIGURACIÓN */
        .modal {
            display: none;
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(5, 5, 8, 0.9); backdrop-filter: blur(5px);
            z-index: 100; flex-direction: column; justify-content: center; align-items: center;
        }
        .modal-card {
            background: #0a0a12; border: 2px solid #00ffcc; border-radius: 12px;
            padding: 25px; text-align: center; box-shadow: 0 0 25px rgba(0, 255, 204, 0.4);
            max-width: 85%; width: 280px;
        }
        .modal-card h2 { color: #00ffcc; margin: 0 0 15px 0; font-size: 20px; }
        .menu-btn {
            width: 100%; background: #ff0055; color: #fff; border: none; padding: 12px;
            font-size: 14px; font-weight: bold; border-radius: 8px; margin-top: 10px;
            box-shadow: 0 0 10px rgba(255, 0, 85, 0.4); cursor: pointer;
        }
        .menu-btn.secondary { background: #00f0ff; color: #000; }

        /* BLOQUE INFERIOR DE CONTROLES BIEN SEPARADO */
        #dpad-container {
            width: 100%; height: 165px; display: flex; 
            justify-content: center; align-items: center; 
            background: #050508; flex-shrink: 0; padding-bottom: 25px;
        }
        #dpad {
            width: 135px; height: 135px; display: grid; 
            grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr);
        }
        .d-btn {
            background: rgba(0, 240, 255, 0.3); border: 2px solid #00f0ff; border-radius: 10px;
            display: flex; justify-content: center; align-items: center; color: #00f0ff; font-size: 22px;
            user-select: none;
        }
        .d-btn:active { background: rgba(0, 240, 255, 0.7); }
        #btn-up { grid-column: 2; grid-row: 1; }
        #btn-left { grid-column: 1; grid-row: 2; }
        #btn-right { grid-column: 3; grid-row: 2; }
        #btn-down { grid-column: 2; grid-row: 3; }
    </style>
</head>
<body>
    <div id="ui-header">
        <div id="header-info">
            <div id="title">SNAKE SPLIT - ÁREA 1</div>
            <div id="scores">
                <span id="score-val">PTS: 0</span>
                <span id="target-val">META: 300</span>
                <span id="high-val">RÉCORD: 0</span>
            </div>
        </div>
        <button id="pause-btn">⏸ PAUSA</button>
    </div>

    <div id="canvas-area">
        <canvas id="gameCanvas"></canvas>
    </div>

    <!-- MODAL DE PAUSA -->
    <div id="pause-modal" class="modal">
        <div class="modal-card">
            <h2>JUEGO EN PAUSA</h2>
            <button id="resume-btn" class="menu-btn secondary">CONTINUAR</button>
            <button id="restart-btn" class="menu-btn">REINICIAR ÁREA</button>
        </div>
    </div>

    <!-- MODAL DE VICTORIA -->
    <div id="victory-modal" class="modal">
        <div class="modal-card">
            <h2>¡ÁREA COMPLETADA!</h2>
            <p>¡Lograste los 300 puntos!</p>
            <button id="next-btn" class="menu-btn">SIGUIENTE ÁREA</button>
        </div>
    </div>

    <div id="dpad-container">
        <div id="dpad">
            <div id="btn-up" class="d-btn">&#9650;</div>
            <div id="btn-left" class="d-btn">&#9668;</div>
            <div id="btn-right" class="d-btn">&#9658;</div>
            <div id="btn-down" class="d-btn">&#9660;</div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        const GRID_SIZE = 20;
        const TARGET_SCORE = 300;
        let COLS = 14;
        let ROWS = 15;
        
        let snake = [];
        let splitSnakes = [];
        let food = { x: 3, y: 3 };
        let splitItem = { x: 8, y: 8 };
        let direction = 'RIGHT';
        let nextDirection = 'RIGHT';
        let score = 0;
        let currentLevel = 1;
        let isPaused = false;
        let isLevelComplete = false;
        let highScore = parseInt(localStorage.getItem('snake_highscore')) || 0;
        let audioCtx = null;

        function setupCanvasSize() {
            const area = document.getElementById('canvas-area');
            const maxW = area.clientWidth - 16;
            const maxH = area.clientHeight - 16;

            COLS = Math.floor(maxW / GRID_SIZE);
            ROWS = Math.floor(maxH / GRID_SIZE);

            if (COLS < 10) COLS = 10;
            if (ROWS < 10) ROWS = 10;

            canvas.width = COLS * GRID_SIZE;
            canvas.height = ROWS * GRID_SIZE;
        }

        function initAudio() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }

        function playSound(type) {
            try {
                initAudio();
                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);

                if (type === 'eat') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(600, audioCtx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.1);
                    gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
                    osc.start(); osc.stop(audioCtx.currentTime + 0.1);
                } else if (type === 'split') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(400, audioCtx.currentTime);
