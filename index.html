<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Snake Split</title>
  <style>
    * { box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0;
      min-height: 100vh;
      padding: 10px 12px;
      background: #eef2f6;
      color: #0f172a;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      touch-action: none;
    }
    body.dark { background: #0e1116; color: #f8fafc; }
    .hud, .top {
      width: 100%;
      max-width: 360px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 6px;
      margin-bottom: 8px;
      font-size: 13px;
      font-weight: 700;
    }
    .badge {
      background: #ffffff;
      color: #0f172a;
      border: 1px solid #cbd5e1;
      border-radius: 999px;
      padding: 6px 10px;
    }
    body.dark .badge { background: #1b222c; color: #f8fafc; border-color: #2e3948; }
    #wrap {
      position: relative;
      width: 100%;
      max-width: 360px;
      aspect-ratio: 300 / 340;
      border-radius: 16px;
      overflow: hidden;
      border: 2px solid #94a3b8;
      background: radial-gradient(circle at 50% 35%, #ffffff 0%, #e2e8f0 100%);
    }
    body.dark #wrap {
      background: radial-gradient(circle at 50% 35%, #19222f 0%, #10151d 100%);
      border-color: #334155;
    }
    canvas { width: 100%; height: 100%; display: block; }
    .panel {
      position: absolute;
      inset: 0;
      background: rgba(241, 245, 249, 0.95);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 16px;
      text-align: center;
      z-index: 5;
    }
    body.dark .panel { background: rgba(14, 17, 22, 0.95); }
    .panel.show { display: flex; }
    .controls {
      width: 100%;
      max-width: 360px;
      margin-top: 10px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }
    button {
      border: 1px solid #cbd5e1;
      background: #ffffff;
      color: #0f172a;
      border-radius: 10px;
      padding: 10px 8px;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
    }
    body.dark button { background: #1b222c; color: #f8fafc; border-color: #2e3948; }
    .primary { background: #0284c7; color: #ffffff; border-color: #0369a1; }
    .row { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }
  </style>
</head>
<body>
  <div class="top">
    <span class="badge" id="ui-lvl">Nivel 1</span>
    <div class="row">
      <button id="btn-pause">⏸ Pausa</button>
      <button id="btn-top-cfg">⚙️</button>
    </div>
  </div>
  <div class="hud">
    <span class="badge" id="ui-pts">Puntos: 0 / 300</span>
    <span class="badge" id="ui-snakes">Culebras: 1</span>
  </div>

  <div id="wrap">
    <canvas id="cv" width="300" height="340"></canvas>

    <div class="panel show" id="panel-start">
      <div style="font-size:11px;font-weight:800;color:#0284c7;">EDICIÓN ARCADE</div>
      <h2 style="margin:0;">SNAKE SPLIT</h2>
      <div class="badge" id="ui-best">Récord: 0 pts · Nivel 1</div>
      <div class="row">
        <button class="primary" id="btn-play">▶ Jugar</button>
        <button id="btn-cfg">⚙️ Ajustes</button>
      </div>
    </div>

    <div class="panel" id="panel-pause">
      <h3 style="margin:0;">Pausa</h3>
      <p style="margin:0;font-size:13px;" id="ui-pause-info">Nivel 1 · 0 / 300 pts</p>
      <div class="row">
        <button class="primary" id="btn-resume">▶ Continuar</button>
        <button id="btn-restart">↻ Reiniciar</button>
      </div>
    </div>

    <div class="panel" id="panel-cfg">
      <h3 style="margin:0;">Ajustes</h3>
      <div class="row">
        <button id="cfg-diff">Dificultad: Estándar</button>
        <button id="cfg-theme">Pantalla: Clara</button>
        <button id="cfg-snd">Sonido: Sí</button>
      </div>
      <button class="primary" id="btn-cfg-done">Listo</button>
    </div>
  </div>

  <div class="controls">
    <button id="btn-l">◀ Izq</button>
    <button class="primary" id="btn-s">✂ Dividir</button>
    <button id="btn-r">Der ▶</button>
  </div>

  <script>
    const cv = document.getElementById("cv");
    const ctx = cv.getContext("2d");
    const W = cv.width, H = cv.height;

    const panelStart = document.getElementById("panel-start");
    const panelPause = document.getElementById("panel-pause");
    const panelCfg = document.getElementById("panel-cfg");
    const uiLvl = document.getElementById("ui-lvl");
    const uiPts = document.getElementById("ui-pts");
    const uiSnakes = document.getElementById("ui-snakes");
    const uiBest = document.getElementById("ui-best");
    const uiPauseInfo = document.getElementById("ui-pause-info");

    const diffs = [
      { name: "Tranquila", spd: 50, skullBonus: -1, moveSpd: 26 },
      { name: "Estándar", spd: 64, skullBonus: 0, moveSpd: 36 },
      { name: "Extrema", spd: 82, skullBonus: 1, moveSpd: 52 }
    ];
    let diffIdx = 1;
    let soundOn = true;

    let bestScore = Number(localStorage.getItem("ss_best_score") || 0);
    let bestLevel = Number(localStorage.getItem("ss_best_level") || 1);

    let mode = "menu"; // menu | play | pause | cfg | over
    let level = 1, pts = 0, totalPts = 0;
    let snakes = [];
    let walls = [];
    let skulls = [];
    let items = [];
    let turn = 0;
    let lastT = 0;
    let ac = null;

    function refreshRecordText() {
      uiBest.textContent = "Récord: " + bestScore + " pts · Nivel " + bestLevel;
    }
    refreshRecordText();

    function saveRecord() {
      if (totalPts > bestScore) bestScore = totalPts;
      if (level > bestLevel) bestLevel = level;
      localStorage.setItem("ss_best_score", String(bestScore));
      localStorage.setItem("ss_best_level", String(bestLevel));
      refreshRecordText();
    }

    function tone(freq, dur, delay = 0, type = "sine", endFreq = null) {
      if (!soundOn) return;
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        if (!ac) ac = new AudioCtx();
        if (ac.state === "suspended") ac.resume();
        const t0 = ac.currentTime + delay;
        const osc = ac.createOscillator();
        const gain = ac.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, t0);
        if (endFreq) osc.frequency.exponentialRampToValueAtTime(endFreq, t0 + dur);
        gain.gain.setValueAtTime(0.001, t0);
        gain.gain.linearRampToValueAtTime(0.08, t0 + 0.015);
        gain.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
        osc.connect(gain);
        gain.connect(ac.destination);
        osc.start(t0);
        osc.stop(t0 + dur + 0.02);
      } catch (_) {}
    }

    const sfx = {
      start() { tone(440, 0.1, 0, "triangle", 587); tone(587, 0.14, 0.08, "sine"); },
      eat(star) {
        if (star) { tone(587, 0.09, 0, "sine"); tone(880, 0.15, 0.07, "triangle"); }
        else { tone(520, 0.08, 0, "sine", 680); }
      },
      split() { tone(360, 0.11, 0, "triangle", 660); },
      lvlUp() { tone(523, 0.1, 0, "triangle"); tone(659, 0.1, 0.09, "triangle"); tone(784, 0.18, 0.18, "sine"); },
      crash() { tone(210, 0.22, 0, "sawtooth", 70); }
    };

    function makeSnake(x, y, ang, len, hue, isPlayer) {
      const segs = [];
      for (let i = 0; i < len; i++) {
        segs.push({ x: x - Math.cos(ang) * i * 5, y: y - Math.sin(ang) * i * 5 });
      }
      return { segs, ang, hue, isPlayer, r: 6.5, aiTimer: 0.4, aiDir: 1 };
    }

    function hitWall(x, y, r) {
      for (const w of walls) {
        const cx = Math.max(w.x, Math.min(x, w.x + w.w));
        const cy = Math.max(w.y, Math.min(y, w.y + w.h));
        if ((x - cx) ** 2 + (y - cy) ** 2 < r * r) return true;
      }
      return false;
    }

    function buildWalls(lvl) {
      walls = [];
      if (lvl === 1) return;
      if (lvl % 2 === 0) {
        walls.push({ x: 36, y: 120, w: 72, h: 12 });
        walls.push({ x: W - 108, y: 205, w: 72, h: 12 });
      } else {
        walls.push({ x: 40, y: 95, w: 66, h: 12 });
        walls.push({ x: W / 2 - 35, y: 165, w: 70, h: 12 });
        walls.push({ x: W - 106, y: 235, w: 66, h: 12 });
      }
    }

    function safePos(x, y, sweep = 0) {
      if (Math.hypot(x - W / 2, y - H * 0.8) < 55) return false;
      for (let s = -1; s <= 1; s++) {
        if (hitWall(x, y + s * sweep, 14)) return false;
      }
      for (const sk of skulls) {
        if (Math.hypot(x - sk.x, y - sk.y) < 34) return false;
      }
      return true;
    }

    function spawnSkulls(lvl) {
      skulls = [];
      const cfg = diffs[diffIdx];
      const base = lvl === 1 ? 1 : Math.min(5, lvl + 1);
      const count = Math.max(0, base + cfg.skullBonus);
      const moving = lvl >= 4;
      const sweep = moving ? 38 : 0;

      let tries = 0;
      while (skulls.length < count && tries < 150) {
        tries++;
        const x = 32 + Math.random() * (W - 64);
        const y = 44 + sweep + Math.random() * Math.max(20, H - 88 - sweep * 2);
        if (safePos(x, y, sweep)) {
          skulls.push({
            x, y,
            minY: Math.max(22, y - sweep),
            maxY: Math.min(H - 22, y + sweep),
            dir: Math.random() < 0.5 ? -1 : 1,
            moving,
            r: 8.5
          });
        }
      }
    }

    function spawnItem() {
      const roll = Math.random();
      const kind = roll < 0.6 ? "berry" : (roll < 0.88 ? "citrus" : "star");
      let x = W / 2, y = H * 0.35;
      for (let i = 0; i < 50; i++) {
        const tx = 24 + Math.random() * (W - 48);
        const ty = 24 + Math.random() * (H - 48);
        if (safePos(tx, ty, 0)) { x = tx; y = ty; break; }
      }
      const ptsVal = kind === "star" ? 40 : (kind === "citrus" ? 20 : 10);
      const grow = kind === "star" ? 3 : 2;
      items.push({ x, y, kind, ptsVal, grow, r: kind === "star" ? 6.5 : 5.5 });
    }

    function updateHud() {
      uiLvl.textContent = "Nivel " + level;
      uiPts.textContent = "Puntos: " + pts + " / 300";
      uiSnakes.textContent = "Culebras: " + snakes.length;
    }

    function setupLevel(lvl, resetTotal) {
      level = lvl;
      pts = 0;
      if (resetTotal) totalPts = 0;
      turn = 0;
      snakes = [makeSnake(W / 2, H * 0.8, -Math.PI / 2, 12, 152, true)];
      buildWalls(level);
      spawnSkulls(level);
      items = [];
      for (let i = 0; i < 6; i++) spawnItem();
      saveRecord();
      updateHud();
    }

    function hideAllPanels() {
      panelStart.classList.remove("show");
      panelPause.classList.remove("show");
      panelCfg.classList.remove("show");
    }

    function startPlay() {
      hideAllPanels();
      mode = "play";
      sfx.start();
      setupLevel(1, true);
    }

    function openCfg() {
      hideAllPanels();
      mode = "cfg";
      panelCfg.classList.add("show");
    }

    document.getElementById("btn-play").addEventListener("click", startPlay);
    document.getElementById("btn-cfg").addEventListener("click", openCfg);
    document.getElementById("btn-top-cfg").addEventListener("click", () => {
      if (mode === "play" || mode === "menu" || mode === "pause") openCfg();
    });

    document.getElementById("btn-cfg-done").addEventListener("click", () => {
      panelCfg.classList.remove("show");
      if (totalPts === 0 && pts === 0 && snakes.length === 1 && snakes[0].segs[0].y > H * 0.75) {
        mode = "menu";
        panelStart.classList.add("show");
      } else {
        mode = "play";
      }
    });

    document.getElementById("btn-pause").addEventListener("click", () => {
      if (mode === "play") {
        mode = "pause";
        uiPauseInfo.textContent = "Nivel " + level + " · " + pts + " / 300 pts";
        panelPause.classList.add("show");
      } else if (mode === "pause") {
        panelPause.classList.remove("show");
        mode = "play";
      }
    });

    document.getElementById("btn-resume").addEventListener("click", () => {
      panelPause.classList.remove("show");
      mode = "play";
    });

    document.getElementById("btn-restart").addEventListener("click", startPlay);

    document.getElementById("cfg-diff").addEventListener("click", (e) => {
      diffIdx = (diffIdx + 1) % diffs.length;
      e.target.textContent = "Dificultad: " + diffs[diffIdx].name;
      spawnSkulls(level);
    });

    document.getElementById("cfg-theme").addEventListener("click", (e) => {
      const dark = document.body.classList.toggle("dark");
      e.target.textContent = "Pantalla: " + (dark ? "Oscura" : "Clara");
    });

    document.getElementById("cfg-snd").addEventListener("click", (e) => {
      soundOn = !soundOn;
      e.target.textContent = "Sonido: " + (soundOn ? "Sí" : "No");
      if (soundOn) sfx.eat(false);
    });

    document.getElementById("btn-l").addEventListener("pointerdown", () => (turn = -1));
    document.getElementById("btn-l").addEventListener("pointerup", () => (turn = 0));
    document.getElementById("btn-l").addEventListener("pointerleave", () => (turn = 0));

    document.getElementById("btn-r").addEventListener("pointerdown", () => (turn = 1));
    document.getElementById("btn-r").addEventListener("pointerup", () => (turn = 0));
    document.getElementById("btn-r").addEventListener("pointerleave", () => (turn = 0));

    document.getElementById("btn-s").addEventListener("click", () => {
      if (mode === "over") { startPlay(); return; }
      if (mode !== "play") return;
      const next = [];
      let splitHappened = false;
      for (const s of snakes) {
        if (s.segs.length >= 8 && next.length + snakes.length <= 4) {
          const half = Math.floor(s.segs.length / 2);
          const rightPart = s.segs.splice(half);
          next.push(s);
          next.push(makeSnake(rightPart[0].x, rightPart[0].y, s.ang + 0.7, rightPart.length, (s.hue + 55) % 360, false));
          splitHappened = true;
        } else {
          next.push(s);
        }
      }
      if (splitHappened) { snakes = next; sfx.split(); updateHud(); }
    });

    cv.addEventListener("pointerdown", () => {
      if (mode === "over") startPlay();
    });

    function normAngle(a) {
      while (a > Math.PI) a -= Math.PI * 2;
      while (a < -Math.PI) a += Math.PI * 2;
      return a;
    }

    function update(dt) {
      if (mode !== "play") return;
      const cfg = diffs[diffIdx];
      const spd = cfg.spd + (level - 1) * 4;

      for (const sk of skulls) {
        if (sk.moving) {
          sk.y += sk.dir * cfg.moveSpd * dt;
          if (sk.y <= sk.minY) { sk.y = sk.minY; sk.dir = 1; }
          if (sk.y >= sk.maxY) { sk.y = sk.maxY; sk.dir = -1; }
        }
      }

      const alive = [];
      for (const s of snakes) {
        let dir = turn;
        if (!s.isPlayer) {
          s.aiTimer -= dt;
          if (s.aiTimer <= 0) { s.aiTimer = 0.4 + Math.random() * 0.5; s.aiDir = Math.random() < 0.5 ? -1 : 1; }
          dir = s.aiDir;
          const h = s.segs[0];
          if (h.x < 28 || h.x > W - 28 || h.y < 28 || h.y > H - 28 || hitWall(h.x + Math.cos(s.ang) * 18, h.y + Math.sin(s.ang) * 18, 10)) {
            dir = 1;
          }
        }

        s.ang = normAngle(s.ang + dir * 3.0 * dt);
        const nx = s.segs[0].x + Math.cos(s.ang) * spd * dt;
        const ny = s.segs[0].y + Math.sin(s.ang) * spd * dt;

        const badBorder = nx < s.r || nx > W - s.r || ny < s.r || ny > H - s.r;
        const badWall = hitWall(nx, ny, s.r - 0.5);
        const badSkull = skulls.some(sk => Math.hypot(nx - sk.x, ny - sk.y) < s.r + sk.r - 1.5);

        if (badBorder || badWall || badSkull) {
          if (s.isPlayer) {
            mode = "over";
            saveRecord();
            sfx.crash();
            return;
          }
          continue;
        }

        s.segs.unshift({ x: nx, y: ny });
        s.segs.pop();

        for (let i = items.length - 1; i >= 0; i--) {
          const it = items[i];
          if (Math.hypot(nx - it.x, ny - it.y) < s.r + it.r + 2) {
            items.splice(i, 1);
            spawnItem();
            pts += it.ptsVal;
            totalPts += it.ptsVal;
            saveRecord();
            sfx.eat(it.kind === "star");
            const tail = s.segs[s.segs.length - 1];
            for (let g = 0; g < it.grow; g++) s.segs.push({ ...tail });
            if (pts >= 300) {
              sfx.lvlUp();
              setupLevel(level + 1, false);
              return;
            }
            updateHud();
          }
        }
        alive.push(s);
      }

      if (alive.length !== snakes.length) { snakes = alive; updateHud(); }
    }

    function draw() {
      ctx.clearRect(0, 0, W, H);
      const dark = document.body.classList.contains("dark");

      ctx.fillStyle = dark ? "#475569" : "#64748b";
      for (const w of walls) {
        ctx.fillRect(w.x, w.y, w.w, w.h);
      }

      for (const it of items) {
        ctx.fillStyle = it.kind === "star" ? "#f59e0b" : (it.kind === "citrus" ? "#fb923c" : "#ef4444");
        ctx.beginPath();
        ctx.arc(it.x, it.y, it.r, 0, Math.PI * 2);
        ctx.fill();
      }

      for (const sk of skulls) {
        ctx.fillStyle = sk.moving ? "#dc2626" : "#ef4444";
        ctx.beginPath();
        ctx.arc(sk.x, sk.y, sk.r, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = "#ffffff";
        ctx.fillRect(sk.
