<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Snake Split Arena - Lifted DPad</title>
    <style>
        * { box-sizing: border-box; touch-action: none; }
        body, html { 
            margin: 0; padding: 0; 
            background-color: #050508; color: #fff; 
            font-family: Arial, sans-serif; 
            overflow: hidden; width: 100vw; height: 100vh; 
            display: flex; flex-direction: column; align-items: center; justify-content: space-between;
        }
        #ui-header {
            width: 100%; height: 46px; display: flex; flex-direction: column; 
            justify-content: center; align-items: center; background: #0a0a12;
            border-bottom: 2px solid #ff0055; flex-shrink: 0; z-index: 10;
        }
        #title { font-size: 14px; font-weight: bold; color: #ff0055; margin: 0; }
        #scores { font-size: 12px; font-weight: bold; margin-top: 2px; display: flex; gap: 20px; }
        #score-val { color: #00ffcc; }
        #high-val { color: #ffcc00; }

        /* CANCHA DE JUEGO REAJUSTADA */
        #canvas-container {
            width: 92vw; flex-grow: 1; display: flex; justify-content: center; align-items: center;
            position: relative; margin: 2px 0; max-height: calc(100vh - 270px);
        }
        canvas { 
            border: 3px solid #ff0055; 
            box-shadow: 0 0 18px rgba(255, 0, 85, 0.5); 
            border-radius: 8px;
            background: #000005;
        }

        /* CONTROL D-PAD SUBIDO BASTANTE PARA LIBRAR LOS BOTONES DEL CELULAR */
        #dpad-container {
            width: 100%; height: 210px; display: flex; justify-content: center; 
            align-items: center; background: #050508; flex-shrink: 0; 
            padding-bottom: 85px; /* MARGEN GRANDE INFERIOR */
            z-index: 10;
        }
        #dpad {
            width: 140px; height: 140px; display: grid; 
            grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr);
        }
        .d-btn {
            background: rgba(0, 240, 255, 0.25); border: 2px solid #00f0ff; border-radius: 12px;
            display: flex; justify-content: center; align-items: center; color: #00f0ff; font-size: 24px;
            user-select: none; -webkit-tap-highlight-color: transparent;
        }
        .d-btn:active { background: rgba(0, 240, 255, 0.7); }
        #btn-up { grid-column: 2; grid-row: 1; }
        #btn-left { grid-column: 1; grid-row: 2; }
        #btn-right { grid-column: 3; grid-row: 2; }
        #btn-down { grid-column: 2; grid-row: 3; }
    </style>
</head>
<body>
    <div id="ui-header">
        <div id="title">SNAKE SPLIT: BATTLE ARENA</div>
        <div id="scores">
            <span id="score-val">PUNTOS: 0</span>
            <span id="high-val">RÉCORD: 0</span>
        </div>
    </div>

    <div id="canvas-container">
        <canvas id="gameCanvas"></canvas>
    </div>

    <!-- CONTROL SUBIDO Y DESPEJADO DE ABAJO -->
    <div id="dpad-container">
        <div id="dpad">
            <div id="btn-up" class="d-btn">&#9650;</div>
            <div id="btn-left" class="d-btn">&#9668;</div>
            <div id="btn-right" class="d-btn">&#9658;</div>
            <div id="btn-down" class="d-btn">&#9660;</div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        const GRID_SIZE = 20;
        let COLS = 13;
        let ROWS = 14;
        
        let snake = [];
        let splitSnakes = [];
        let food = { x: 0, y: 0 };
        let splitItem = { x: 0, y: 0 };
        let direction = 'RIGHT';
        let nextDirection = 'RIGHT';
        let score = 0;
        let highScore = parseInt(localStorage.getItem('snake_highscore')) || 0;
        let audioCtx = null;

        function setupCanvasSize() {
            const container = document.getElementById('canvas-container');
            const maxWidth = container.clientWidth - 4;
            const maxHeight = container.clientHeight - 4;

            COLS = Math.floor(maxWidth / GRID_SIZE);
            ROWS = Math.floor(maxHeight / GRID_SIZE);

            if (COLS < 8) COLS = 8;
            if (ROWS < 8) ROWS = 8;

            canvas.width = COLS * GRID_SIZE;
            canvas.height = ROWS * GRID_SIZE;
        }

        function initAudio() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }

        function playSound(type) {
            try {
                initAudio();
                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);

                if (type === 'eat') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(600, audioCtx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.1);
                    gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
                    osc.start(); osc.stop(audioCtx.currentTime + 0.1);
                } else if (type === 'split') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(400, audioCtx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 0.2);
                    gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
                    osc.start(); osc.stop(audioCtx.currentTime + 0.2);
                } else if (type === 'die') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(220, audioCtx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(50, audioCtx.currentTime + 0.3);
                    gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                    osc.start
