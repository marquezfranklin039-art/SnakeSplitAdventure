<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Snake Split Adventure - Fullscreen</title>
    <style>
        * { box-sizing: border-box; }
        body, html { margin: 0; padding: 0; background-color: #080910; color: #fff; font-family: sans-serif; overflow: hidden; width: 100%; height: 100%; }
        #game-container { width: 100vw; height: 100vh; display: flex; justify-content: center; align-items: center; }
        canvas { display: block; border: 2px solid #00f0ff; box-shadow: 0 0 15px rgba(0, 240, 255, 0.4); }
    </style>
</head>
<body>
    <div id="game-container"></div>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
    <script>
        // Tamaño dinámico según la pantalla del teléfono
        const screenWidth = window.innerWidth;
        const screenHeight = window.innerHeight;
        const size = 25; // Tamaño de cada segmento/grilla

        const config = {
            type: Phaser.AUTO,
            width: screenWidth,
            height: screenHeight,
            parent: 'game-container',
            scene: { preload: preload, create: create, update: update }
        };

        let snake = [];
        let splitSnakes = [];
        let food, splitItem, scoreText;
        let direction = 'RIGHT';
        let nextDirection = 'RIGHT';
        let moveTime = 0;
        let score = 0;
        let sceneRef;

        const game = new Phaser.Game(config);

        function preload() {}

        function create() {
            sceneRef = this;
            initGame(this);

            // Controles por toque: toque izquierdo para girar izquierda, toque derecho para girar derecha
            this.input.on('pointerdown', (pointer) => {
                if (pointer.x < screenWidth / 2) {
                    if (direction === 'RIGHT') nextDirection = 'UP';
                    else if (direction === 'UP') nextDirection = 'LEFT';
                    else if (direction === 'LEFT') nextDirection = 'DOWN';
                    else if (direction === 'DOWN') nextDirection = 'RIGHT';
                } else {
                    if (direction === 'RIGHT') nextDirection = 'DOWN';
                    else if (direction === 'DOWN') nextDirection = 'LEFT';
                    else if (direction === 'LEFT') nextDirection = 'UP';
                    else if (direction === 'UP') nextDirection = 'RIGHT';
                }
            });
        }

        function initGame(scene) {
            score = 0;
            direction = 'RIGHT';
            nextDirection = 'RIGHT';

            if (scoreText) scoreText.destroy();
            scene.add.text(screenWidth / 2, 20, 'SNAKE SPLIT ADVENTURE', { fontSize: '18px', fill: '#00f0ff', fontStyle: 'bold' }).setOrigin(0.5);
            scoreText = scene.add.text(screenWidth / 2, 45, 'PUNTOS: 0', { fontSize: '16px', fill: '#00ffcc', fontStyle: 'bold' }).setOrigin(0.5);

            if (snake.length > 0) snake.forEach(s => s.obj.destroy());
            splitSnakes.forEach(sGroup => sGroup.body.forEach(s => s.obj.destroy()));
            splitSnakes = [];

            let startX = Math.floor((screenWidth / 2) / size) * size;
            let startY = Math.floor((screenHeight / 2) / size) * size;

            snake = [];
            for (let i = 0; i < 5; i++) {
                let color = (i === 0) ? 0x00ffcc : 0x00bfff;
                let circle = scene.add.circle(startX - (i * size), startY, size / 2 - 1, color);
                snake.push({ obj: circle, x: startX - (i * size), y: startY });
            }

            if (food) food.destroy();
            food = scene.add.circle(0, 0, size / 2 - 1, 0xff007f);
            spawnFood();

            if (splitItem) splitItem.destroy();
            splitItem = scene.add.circle(0, 0, size / 2 - 1, 0xffcc00);
            spawnSplitItem();
        }

        function spawnFood() {
            let cols = Math.floor((screenWidth - 40) / size);
            let rows = Math.floor((screenHeight - 100) / size);
            let rx = (Math.floor(Math.random() * cols) + 1) * size;
            let ry = (Math.floor(Math.random() * rows) + 3) * size;
            food.setPosition(rx, ry);
        }

        function spawnSplitItem() {
            let cols = Math.floor((screenWidth - 40) / size);
            let rows = Math.floor((screenHeight - 100) / size);
            let rx = (Math.floor(Math.random() * cols) + 1) * size;
            let ry = (Math.floor(Math.random() * rows) + 3) * size;
            splitItem.setPosition(rx, ry);
        }

        function doSplit() {
            if (snake.length <= 3) return;
            let half = Math.floor(snake.length / 2);
            let tailPart = snake.splice(half);

            tailPart.forEach((seg, idx) => {
                seg.obj.setFillStyle(idx === 0 ? 0xffaa00 : 0xff6600);
            });

            splitSnakes.push({
                body: tailPart,
                dir: 'DOWN'
            });
        }

        function update(time) {
            if (time < moveTime) return;
            moveTime = time + 130;

            direction = nextDirection;

            let hx = snake[0].x;
            let hy = snake[0].y;

            if (direction === 'RIGHT') hx += size;
            else if (direction === 'LEFT') hx -= size;
            else if (direction === 'UP') hy -= size;
            else if (direction === 'DOWN') hy += size;

            // Ajuste exacto a los bordes de la pantalla del celular
            if (hx >= screenWidth) hx = 0;
            else if (hx < 0) hx = Math.floor(screenWidth / size) * size - size;
            if (hy >= screenHeight) hy = 70;
            else if (hy < 70) hy = Math.floor(screenHeight / size) * size - size;

            // Choque con su propio cuerpo
            for (let i = 2; i < snake.length; i++) {
                if (hx === snake[i].x && hy === snake[i].y) {
                    initGame(sceneRef);
                    return;
                }
            }

            // Comer comida normal
            if (Math.abs(hx - food.x) < size / 2 && Math.abs(hy - food.y) < size / 2) {
                score += 10;
                scoreText.setText('PUNTOS: ' + score);
                let tail = snake[snake.length - 1];
                let newCircle = sceneRef.add.circle(tail.x, tail.y, size / 2 - 1, 0x00bfff);
                snake.push({ obj: newCircle, x: tail.x, y: tail.y });
                spawnFood();
            }

            // Comer ítem de división (Split)
            if (splitItem && Math.abs(hx - splitItem.x) < size / 2 && Math.abs(hy - splitItem.y) < size / 2) {
                score += 25;
                scoreText.setText('PUNTOS: ' + score);
                doSplit();
                spawnSplitItem();
            }

            // Mover cuerpo principal
            for (let i = snake.length - 1; i > 0; i--) {
                snake[i].x = snake[i - 1].x;
                snake[i].y = snake[i - 1].y;
                snake[i].obj.setPosition(snake[i].x, snake[i].y);
            }
            snake[0].x = hx;
            snake[0].y = hy;
            snake[0].obj.setPosition(hx, hy);

            // Mover serpientes secundarias
            splitSnakes.forEach(sGroup => {
                let sBody = sGroup.body;
                let sHeadX = sBody[0].x;
                let sHeadY = sBody[0].y;

                if (sGroup.dir === 'DOWN') sHeadY += size;
                else if (sGroup.dir === 'UP') sHeadY -= size;
                else if (sGroup.dir === 'RIGHT') sHeadX += size;
                else if (sGroup.dir === 'LEFT') sHeadX -= size;

                if (sHeadX >= screenWidth) sHeadX = 0;
                else if (sHeadX < 0) sHeadX = Math.floor(screenWidth / size) * size - size;
                if (sHeadY >= screenHeight) sHeadY = 70;
                else if (sHeadY < 70) sHeadY = Math.floor(screenHeight / size) * size - size;

                for (let i = sBody.length - 1; i > 0; i--) {
                    sBody[i].x = sBody[i - 1].x;
                    sBody[i].y = sBody[i - 1].y;
                    sBody[i].obj.setPosition(sBody[i].x, sBody[i].y);
                }
                sBody[0].x = sHeadX;
                sBody[0].y = sHeadY;
                sBody[0].obj.setPosition(sHeadX, sHeadY);
            });
        }
    </script>
</body>
</html>
