<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Snake Split Arena - Joystick Pro</title>
    <style>
        * { box-sizing: border-box; touch-action: none; }
        body, html { 
            margin: 0; padding: 0; 
            background-color: #050508; color: #fff; 
            font-family: Arial, sans-serif; 
            overflow: hidden; width: 100vw; height: 100vh; 
            display: flex; flex-direction: column; align-items: center; justify-content: space-between;
        }
        #ui-header {
            width: 100%; height: 50px; display: flex; flex-direction: column; 
            justify-content: center; align-items: center; background: #0a0a12;
            border-bottom: 2px solid #ff0055; flex-shrink: 0; z-index: 10;
        }
        #title { font-size: 15px; font-weight: bold; color: #ff0055; margin: 0; }
        #scores { font-size: 13px; font-weight: bold; margin-top: 3px; display: flex; gap: 20px; }
        #score-val { color: #00ffcc; }
        #high-val { color: #ffcc00; }

        /* CANCHA DE JUEGO */
        #canvas-container {
            width: 96vw; flex-grow: 1; display: flex; justify-content: center; align-items: center;
            position: relative; margin: 5px 0;
        }
        canvas { 
            border: 3px solid #ff0055; 
            box-shadow: 0 0 18px rgba(255, 0, 85, 0.5); 
            border-radius: 8px;
            background: #000005;
        }

        /* JOYSTICK REDONDO ANÁLOGO */
        #joystick-container {
            width: 100%; height: 170px; display: flex; justify-content: center; 
            align-items: center; background: #050508; flex-shrink: 0; padding-bottom: 20px; z-index: 10;
        }
        #joystick-base {
            width: 130px; height: 130px; border-radius: 50%;
            background: rgba(0, 240, 255, 0.15); border: 2px solid #00f0ff;
            position: relative; display: flex; justify-content: center; align-items: center;
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.3);
        }
        #joystick-stick {
            width: 60px; height: 60px; border-radius: 50%;
            background: rgba(0, 240, 255, 0.6); border: 2px solid #ffffff;
            position: absolute; top: 33px; left: 33px;
            box-shadow: 0 0 10px rgba(0, 240, 255, 0.8);
            transition: transform 0.05s linear;
        }
    </style>
</head>
<body>
    <div id="ui-header">
        <div id="title">SNAKE SPLIT: BATTLE ARENA</div>
        <div id="scores">
            <span id="score-val">PUNTOS: 0</span>
            <span id="high-val">RÉCORD: 0</span>
        </div>
    </div>

    <div id="canvas-container">
        <canvas id="gameCanvas"></canvas>
    </div>

    <!-- ZONA DEL JOYSTICK REDONDO -->
    <div id="joystick-container">
        <div id="joystick-base">
            <div id="joystick-stick"></div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        const GRID_SIZE = 22;
        let COLS = 14;
        let ROWS = 16;
        
        let snake = [];
        let splitSnakes = [];
        let food = { x: 0, y: 0 };
        let splitItem = { x: 0, y: 0 };
        let direction = 'RIGHT';
        let nextDirection = 'RIGHT';
        let score = 0;
        let highScore = parseInt(localStorage.getItem('snake_highscore')) || 0;
        let audioCtx = null;

        function setupCanvasSize() {
            const container = document.getElementById('canvas-container');
            const maxWidth = container.clientWidth - 4;
            const maxHeight = container.clientHeight - 4;

            COLS = Math.floor(maxWidth / GRID_SIZE);
            ROWS = Math.floor(maxHeight / GRID_SIZE);

            if (COLS < 8) COLS = 8;
            if (ROWS < 8) ROWS = 8;

            canvas.width = COLS * GRID_SIZE;
            canvas.height = ROWS * GRID_SIZE;
        }

        function initAudio() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }

        function playSound(type) {
            try {
                initAudio();
                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);

                if (type === 'eat') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(600, audioCtx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.1);
                    gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
                    osc.start(); osc.stop(audioCtx.currentTime + 0.1);
                } else if (type === 'split') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(400, audioCtx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 0.2);
                    gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
                    osc.start(); osc.stop(audioCtx.currentTime + 0.2);
                } else if (type === 'die') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(220, audioCtx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(50, audioCtx.currentTime + 0.3);
                    gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                    osc.start(); osc.stop(audioCtx.currentTime + 0.3);
                }
            } catch (e) {}
        }

        function resetGame() {
            score = 0;
            direction = 'RIGHT';
            nextDirection = 'RIGHT';
            document.getElementById('score-val').innerText = 'PUNTOS: ' + score;
            document.getElementById('high-val').innerText = 'RÉCORD: ' + highScore;

            let startX = Math.floor(COLS / 2);
            let startY = Math.floor(ROWS / 2);

            snake = [];
            for (let i = 0; i < 5; i++) {
                snake.push({ x: startX - i, y: startY });
            }

            splitSnakes = [];
            spawnFood();
            spawnSplitItem();
        }

        function spawnFood() {
            food.x = Math.floor(Math.random() * COLS);
            food.y = Math.floor(Math.random() * ROWS);
        }

        function spawnSplitItem() {
            splitItem.x = Math.floor(Math.random() * COLS);
            splitItem.y = Math.floor(Math.random() * ROWS);
        }

        function doSplit() {
            if (snake.length <= 3) return;
            let half = Math.floor(snake.length / 2);
            let tailPart = snake.splice(half);

            let dirs = ['UP', 'DOWN', 'LEFT', 'RIGHT'];
            splitSnakes.push({
                body: tailPart,
                dir: dirs[Math.floor(Math.random() * dirs.length)]
            });
            playSound('split');
        }

        function update() {
            direction = nextDirection;
            let head = { x: snake[0].x, y: snake[0].y };

            if (direction === 'RIGHT') head.x++;
            else if (direction === 'LEFT') head.x--;
            else if (direction === 'UP') head.y--;
            else if (direction === 'DOWN') head.y++;

            // Choque con paredes
            if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS) {
                playSound('die');
                resetGame();
                return;
            }

            // Choque propio
            for (let i = 1; i < snake.length; i++) {
                if (head.x === snake[i].x && head.y === snake[i].y) {
                    playSound('die');
                    resetGame();
                    return;
                }
            }

            // Choque con culebras enemigas
            for (let group of splitSnakes) {
                for (let seg of group.body) {
                    if (head.x === seg.x && head.y === seg.y) {
                        playSound('die');
                        resetGame();
                        return;
                    }
                }
            }

            snake.unshift(head);

            if (head.x === food.x && head.y === food.y) {
                score += 10;
                checkScore();
                playSound('eat');
                spawnFood();
            } else if (head.x === splitItem.x && head.y === splitItem.y) {
                score += 25;
                checkScore();
                doSplit();
                spawnSplitItem();
            } else {
                snake.pop();
            }

            // Movimiento de culebras enemigas
            splitSnakes.forEach(group => {
                let sBody = group.body;
                let sHead = { x: sBody[0].x, y: sBody[0].y };

                if (group.dir === 'DOWN') sHead.y++;
                else if (group.dir === 'UP') sHead.y--;
                else if (group.dir === 'RIGHT') sHead.x++;
                else if (group.dir === 'LEFT') sHead.x--;

                if (sHead.x < 0 || sHead.x >= COLS || sHead.y < 0 || sHead.y >= ROWS) {
                    let dirs = ['UP', 'DOWN', 'LEFT', 'RIGHT'];
                    group.dir = dirs[Math.floor(Math.random() * dirs.length)];
                    return;
                }

                if (Math.random() < 0.15) {
                    let dirs = ['UP', 'DOWN', 'LEFT', 'RIGHT'];
                    group.dir = dirs[Math.floor(Math.random() * dirs.length)];
                }

                sBody.unshift(sHead);
                sBody.pop();
            });

            draw();
        }

        function checkScore() {
            document.getElementById('score-val').innerText = 'PUNTOS: ' + score;
            if (score > highScore) {
                highScore = score;
                localStorage.setItem('snake_highscore', highScore);
                document.getElementById('high-val').innerText = 'RÉCORD: ' + highScore;
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Manzana Rosa
            ctx.fillStyle = '#ff0055';
            ctx.beginPath();
            ctx.arc(food.x * GRID_SIZE + GRID_SIZE/2, food.y * GRID_SIZE + GRID_SIZE/2, GRID_SIZE/2 - 2, 0, Math.PI * 2);
            ctx.fill();

            // Estrella Amarilla
            ctx.fillStyle = '#ffcc00';
            ctx.beginPath();
            ctx.arc(splitItem.x * GRID_SIZE + GRID_SIZE/2, splitItem.y * GRID_SIZE + GRID_SIZE/2, GRID_SIZE/2 - 3, 0, Math.PI * 2);
            ctx.fill();

            // Serpiente Principal
            snake.forEach((seg, index) => {
                let px = seg.x * GRID_SIZE;
                let py = seg.y * GRID_SIZE;

                if (index === 0) {
                    ctx.fillStyle = '#00ffcc';
                    ctx.fillRect(px + 1, py + 1, GRID_SIZE - 2, GRID_SIZE - 2);
                    ctx.fillStyle = '#ff0000';
                    ctx.fillRect(px + 3, py + 3, 4, 4);
                    ctx.fillRect(px + GRID_SIZE - 7, py + 3, 4, 4);
                } else {
                    ctx.fillStyle = '#00bfff';
                    ctx.beginPath();
                    ctx.arc(px + GRID_SIZE/2, py + GRID_SIZE/2, GRID_SIZE/2 - 2, 0, Math.PI * 2);
                    ctx.fill();
                }
            });

            // Serpientes Divididas
            splitSnakes.forEach(group => {
                group.body.forEach((seg, index) => {
                    let px = seg.x * GRID_SIZE;
                    let py = seg.y * GRID_SIZE;

                    if (index === 0) {
                        ctx.fillStyle = '#ff5500';
                        ctx.fillRect(px + 1, py + 1, GRID_SIZE - 2, GRID_SIZE - 2);
                        ctx.fillStyle = '#ffff00';
                        ctx.fillRect(px + 3, py + 3, 4, 4);
                        ctx.fillRect(px + GRID_SIZE - 7, py + 3, 4, 4);
                    } else {
                        ctx.fillStyle = '#ffaa00';
                        ctx.beginPath();
                        ctx.arc(px + GRID_SIZE/2, py + GRID_SIZE/2, GRID_SIZE/2 - 2, 0, Math.PI * 2);
                        ctx.fill();
                    }
                });
            });
        }

        // LÓGICA DEL JOYSTICK ANÁLOGO
        const base = document.getElementById('joystick-base');
        const stick = document.getElementById('joystick-stick');
        let isDragging = false;
        let baseRect, centerX, centerY;

        function updateJoystickCenter() {
            baseRect = base.getBoundingClientRect();
            centerX = baseRect.width / 2;
            centerY = baseRect.height / 2;
        }

        window.addEventListener('resize', updateJoystickCenter);
        updateJoystickCenter();

        function handleTouch(clientX, clientY) {
            let x = clientX - baseRect.left - centerX;
            let y = clientY - baseRect.top - centerY;
            let distance = Math.sqrt(x * x + y * y);
            let maxRadius = 40;

            if (distance > maxRadius) {
                x = (x / distance) * maxRadius;
                y = (y / distance) * maxRadius;
            }

            stick.style.transform = `translate(${x}px, ${y}px)`;

            // Traducir ángulo del joystick a dirección de la serpiente
            if (distance > 10) {
                let angle = Math.atan2(y, x) * (180 / Math.PI);
                initAudio();

                if (angle >= -45 && angle <= 45) {
                    if (direction !== 'LEFT') nextDirection = 'RIGHT';
                } else if (angle > 45 && angle < 135) {
                    if (direction !== 'UP') nextDirection = 'DOWN';
                } else if (angle >= 135 || angle <= -135) {
                    if (direction !== 'RIGHT') nextDirection = 'LEFT';
                } else if (angle > -135 && angle < -45) {
                    if (direction !== 'DOWN') nextDirection = 'UP';
                }
            }
        }

        base.addEventListener('touchstart', (e) => {
            isDragging = true;
            updateJoystickCenter();
            handleTouch(e.touches[0].clientX, e.touches[0].clientY);
        });

        window.addEventListener('touchmove', (e) => {
            if (!isDragging) return;
            handleTouch(e.touches[0].clientX, e.touches[0].clientY);
        });

        window.addEventListener('touchend', () => {
            isDragging = false;
            stick.style.transform = `translate(0px, 0px)`;
        });

        // Soporte para Mouse en PC
        base.addEventListener('mousedown', (e) => {
            isDragging = true;
            updateJoystickCenter();
            handleTouch(e.clientX, e.clientY);
        });

        window.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            handleTouch(e.clientX, e.clientY);
        });

        window.addEventListener('mouseup', () => {
            isDragging = false;
            stick.style.transform = `translate(0px, 0px)`;
        });

        // Inicializar
        setupCanvasSize();
        resetGame();
        draw();
        setInterval(update, 200);
    </script>
</body>
</html>
