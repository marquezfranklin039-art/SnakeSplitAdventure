<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Snake Split Arena</title>
    <style>
        * { box-sizing: border-box; touch-action: none; }
        body, html { 
            margin: 0; padding: 0; 
            background-color: #050508; color: #fff; 
            font-family: Arial, sans-serif; 
            overflow: hidden; width: 100%; height: 100%; 
            display: flex; flex-direction: column; align-items: center;
        }
        #ui-header {
            width: 100%; height: 60px; display: flex; flex-direction: column; 
            justify-content: center; align-items: center; background: #0a0a12;
            border-bottom: 2px solid #ff0055; z-index: 10;
        }
        #title { font-size: 16px; font-weight: bold; color: #ff0055; margin: 0; }
        #scores { font-size: 14px; font-weight: bold; margin-top: 4px; display: flex; gap: 20px; }
        #score-val { color: #00ffcc; }
        #high-val { color: #ffcc00; }

        #canvas-container {
            flex: 1; width: 100%; display: flex; justify-content: center; align-items: center;
            position: relative; padding: 5px;
        }
        canvas { 
            background: #000; border: 2px solid #ff0055; 
            box-shadow: 0 0 15px rgba(255, 0, 85, 0.4); border-radius: 6px;
        }

        /* CONTROL D-PAD CENTRAL */
        #dpad-container {
            height: 170px; width: 100%; display: flex; justify-content: center; 
            align-items: center; padding-bottom: 10px; z-index: 10;
        }
        #dpad {
            width: 150px; height: 150px; display: grid; 
            grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr);
        }
        .d-btn {
            background: rgba(0, 240, 255, 0.25); border: 2px solid #00f0ff; border-radius: 10px;
            display: flex; justify-content: center; align-items: center; color: #00f0ff; font-size: 24px;
            user-select: none; -webkit-tap-highlight-color: transparent;
        }
        .d-btn:active { background: rgba(0, 240, 255, 0.7); }
        #btn-up { grid-column: 2; grid-row: 1; }
        #btn-left { grid-column: 1; grid-row: 2; }
        #btn-right { grid-column: 3; grid-row: 2; }
        #btn-down { grid-column: 2; grid-row: 3; }
    </style>
</head>
<body>
    <div id="ui-header">
        <div id="title">SNAKE SPLIT: BATTLE ARENA</div>
        <div id="scores">
            <span id="score-val">PUNTOS: 0</span>
            <span id="high-val">RÉCORD: 0</span>
        </div>
    </div>

    <div id="canvas-container">
        <canvas id="gameCanvas"></canvas>
    </div>

    <div id="dpad-container">
        <div id="dpad">
            <div id="btn-up" class="d-btn">&#9650;</div>
            <div id="btn-left" class="d-btn">&#9668;</div>
            <div id="btn-right" class="d-btn">&#9658;</div>
            <div id="btn-down" class="d-btn">&#9660;</div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        const GRID_SIZE = 24;
        let COLS, ROWS;
        
        let snake = [];
        let splitSnakes = [];
        let food = { x: 0, y: 0 };
        let splitItem = { x: 0, y: 0 };
        let direction = 'RIGHT';
        let nextDirection = 'RIGHT';
        let score = 0;
        let highScore = parseInt(localStorage.getItem('snake_highscore')) || 0;
        let gameLoop = null;
        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }

        function playSound(type) {
            try {
                initAudio();
                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);

                if (type === 'eat') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(600, audioCtx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.1);
                    gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
                    osc.start(); osc.stop(audioCtx.currentTime + 0.1);
                } else if (type === 'split') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(400, audioCtx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 0.2);
                    gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
                    osc.start(); osc.stop(audioCtx.currentTime + 0.2);
                } else if (type === 'die') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(220, audioCtx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(50, audioCtx.currentTime + 0.3);
                    gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                    osc.start(); osc.stop(audioCtx.currentTime + 0.3);
                }
            } catch (e) {}
        }

        function resizeCanvas() {
            const container = document.getElementById('canvas-container');
            const w = container.clientWidth - 10;
            const h = container.clientHeight - 10;

            COLS = Math.floor(w / GRID_SIZE);
            ROWS = Math.floor(h / GRID_SIZE);

            canvas.width = COLS * GRID_SIZE;
            canvas.height = ROWS * GRID_SIZE;
        }

        function resetGame() {
            score = 0;
            direction = 'RIGHT';
            nextDirection = 'RIGHT';
            document.getElementById('score-val').innerText = 'PUNTOS: ' + score;
            document.getElementById('high-val').innerText = 'RÉCORD: ' + highScore;

            let startX = Math.floor(COLS / 2);
            let startY = Math.floor(ROWS / 2);

            snake = [];
            for (let i = 0; i < 5; i++) {
                snake.push({ x: startX - i, y: startY });
            }

            splitSnakes = [];
            spawnFood();
            spawnSplitItem();
        }

        function spawnFood() {
            food.x = Math.floor(Math.random() * COLS);
            food.y = Math.floor(Math.random() * ROWS);
        }

        function spawnSplitItem() {
            splitItem.x = Math.floor(Math.random() * COLS);
            splitItem.y = Math.floor(Math.random() * ROWS);
        }

        function changeDir(newDir) {
            initAudio();
            if (newDir === 'UP' && direction !== 'DOWN') nextDirection = 'UP';
            if (newDir === 'DOWN' && direction !== 'UP') nextDirection = 'DOWN';
            if (newDir === 'LEFT' && direction !== 'RIGHT') nextDirection = 'LEFT';
            if (newDir === 'RIGHT' && direction !== 'LEFT') nextDirection = 'RIGHT';
        }

        function doSplit() {
            if (snake.length <= 3) return;
            let half = Math.floor(snake.length / 2);
            let tailPart = snake.splice(half);

            let dirs = ['UP', 'DOWN', 'LEFT', 'RIGHT'];
            splitSnakes.push({
                body: tailPart,
                dir: dirs[Math.floor(Math.random() * dirs.length)]
            });
            playSound('split');
        }

        function update() {
            direction = nextDirection;
            let head = { x: snake[0].x, y: snake[0].y };

            if (direction === 'RIGHT') head.x++;
            else if (direction === 'LEFT') head.x--;
            else if (direction === 'UP') head.y--;
            else if (direction === 'DOWN') head.y++;

            // 1. Paredes mortales
            if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS) {
                playSound('die');
                resetGame();
                return;
            }

            // 2. Choque con su propio cuerpo
            for (let i = 1; i < snake.length; i++) {
                if (head.x === snake[i].x && head.y === snake[i].y) {
                    playSound('die');
                    resetGame();
                    return;
                }
            }

            // 3. Choque con serpientes divididas
            for (let group of splitSnakes) {
                for (let seg of group.body)
