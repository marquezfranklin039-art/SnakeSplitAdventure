<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Snake Split Adventure - Master Edition</title>
    <style>
        * { box-sizing: border-box; }
        body, html { 
            margin: 0; padding: 0; 
            background-color: #050508; color: #fff; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            overflow: hidden; width: 100%; height: 100%; 
            display: flex; justify-content: center; align-items: center;
        }
        #game-container { 
            width: 100vw; height: 100vh; 
            display: flex; justify-content: center; align-items: center; 
            position: relative; background: #000;
        }
        canvas { 
            display: block; 
            border: 3px solid #ff0055; 
            box-shadow: 0 0 20px rgba(255, 0, 85, 0.5); 
            border-radius: 8px; 
        }
        
        /* D-PAD CENTRAL EN CRUZ TOTALMENTE CENTRADO */
        #dpad-container {
            position: absolute; 
            bottom: 25px; 
            left: 50%; 
            transform: translateX(-50%);
            width: 180px; 
            height: 180px; 
            display: grid; 
            grid-template-columns: repeat(3, 1fr); 
            grid-template-rows: repeat(3, 1fr);
            z-index: 100; 
            user-select: none; 
            touch-action: manipulation;
        }
        .d-btn {
            background: rgba(0, 240, 255, 0.25); 
            border: 2px solid #00f0ff; 
            border-radius: 12px;
            display: flex; justify-content: center; align-items: center; 
            color: #00f0ff; font-size: 30px;
            backdrop-filter: blur(6px); 
            user-select: none; 
            -webkit-tap-highlight-color: transparent;
            box-shadow: 0 0 10px rgba(0, 240, 255, 0.3);
        }
        .d-btn:active { 
            background: rgba(0, 240, 255, 0.7); 
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.8);
        }
        #btn-up { grid-column: 2; grid-row: 1; }
        #btn-left { grid-column: 1; grid-row: 2; }
        #btn-right { grid-column: 3; grid-row: 2; }
        #btn-down { grid-column: 2; grid-row: 3; }
    </style>
</head>
<body>
    <div id="game-container">
        <div id="dpad-container">
            <div id="btn-up" class="d-btn">&#9650;</div>
            <div id="btn-left" class="d-btn">&#9668;</div>
            <div id="btn-right" class="d-btn">&#9658;</div>
            <div id="btn-down" class="d-btn">&#9660;</div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
    <script>
        const GRID_SIZE = 30;
        const SCREEN_W = window.innerWidth;
        const SCREEN_H = window.innerHeight;

        // Cálculos exactos para el límite de la cancha
        const COLS = Math.floor((SCREEN_W - 20) / GRID_SIZE);
        const ROWS = Math.floor((SCREEN_H - 240) / GRID_SIZE);
        const PLAY_W = COLS * GRID_SIZE;
        const PLAY_H = ROWS * GRID_SIZE;
        const OFFSET_X = Math.floor((SCREEN_W - PLAY_W) / 2);
        const OFFSET_Y = 70;

        const config = {
            type: Phaser.AUTO,
            width: SCREEN_W,
            height: SCREEN_H,
            parent: 'game-container',
            scene: { create: create, update: update }
        };

        let snake = [];
        let splitSnakes = [];
        let food, splitItem, scoreText, highScoreText, arenaBorder;
        let direction = 'RIGHT';
        let nextDirection = 'RIGHT';
        let moveTime = 0;
        let score = 0;
        let highScore = parseInt(localStorage.getItem('snake_highscore')) || 0;
        let sceneRef;
        let audioCtx;

        const game = new Phaser.Game(config);

        function playSound(type) {
            try {
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                if (audioCtx.state === 'suspended') audioCtx.resume();
                
                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);

                if (type === 'eat') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(600, audioCtx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.1);
                    gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
                    osc.start(); osc.stop(audioCtx.currentTime + 0.1);
                } else if (type === 'split') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(400, audioCtx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 0.2);
                    gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
                    osc.start(); osc.stop(audioCtx.currentTime + 0.2);
                } else if (type === 'die') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(220, audioCtx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(50, audioCtx.currentTime + 0.35);
                    gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.35);
                    osc.start(); osc.stop(audioCtx.currentTime + 0.35);
                }
            } catch (e) {}
        }

        function create() {
            sceneRef = this;
            
            // Dibujar borde neón exacto de la cancha
            arenaBorder = this.add.graphics();
            arenaBorder.lineStyle(3, 0xff0055, 0.9);
            arenaBorder.strokeRect(OFFSET_X - 2, OFFSET_Y - 2, PLAY_W + 4, PLAY_H + 4);

            initGame(this);

            // Eventos táctiles para los 4 botones
            const bindBtn = (id, dir) => {
                const el = document.getElementById(id);
                const trigger = (e) => { e.preventDefault(); changeDir(dir); };
                el.addEventListener('touchstart', trigger);
                el.addEventListener('mousedown', trigger);
            };

            bindBtn('btn-up', 'UP');
            bindBtn('btn-down', 'DOWN');
            bindBtn('btn-left', 'LEFT');
            bindBtn('btn-right', 'RIGHT');
        }

        function changeDir(newDir) {
            if (newDir === 'UP' && direction !== 'DOWN') nextDirection = 'UP';
            if (newDir === 'DOWN' && direction !== 'UP') nextDirection = '
